[project]
name = "oathforge"
dynamic = ["version"]
description = "Narrative Telegram RPG with an AI Dungeon Master over a deterministic d20 engine"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
oathforge = "oathforge.cli:main"
oath = "oathforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "pillow>=10", "telethon>=1.36", "ruff>=0.17", "import-linter>=2.1", "pyright[nodejs]>=1.1.400", "pre-commit>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "oathforge.__version__"}

[tool.setuptools.packages.find]
include = ["oathforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "content", "artifacts"]
force-exclude = true  # pre-commit passes files one by one: keep the exclusions anyway

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines: ruff format wraps the code; what is left are texts and comments
    "B905",  # zip() without strict=: the lists are paired on purpose
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # a package re-exports its modules

[tool.ruff.lint.isort]
known-first-party = ["oathforge", "tests"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true  # a list that fits in one line stays in one line

# Invariants of AGENTS.md checked by code: `lint-imports`
[tool.importlinter]
root_package = "oathforge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine is pure: no database, services, bot, AI, Telegram nor SQL"
type = "forbidden"
source_modules = ["oathforge.engine"]
forbidden_modules = ["oathforge.database", "oathforge.services", "oathforge.bot", "oathforge.ai", "telegram", "sqlalchemy", "google"]

[[tool.importlinter.contracts]]
name = "services never reach up to the Telegram layer"
type = "forbidden"
source_modules = ["oathforge.services", "oathforge.content", "oathforge.database"]
forbidden_modules = ["oathforge.bot", "telegram"]

[[tool.importlinter.contracts]]
name = "only ai/client.py talks to Gemini"
type = "forbidden"
source_modules = ["oathforge"]
forbidden_modules = ["google"]
ignore_imports = ["oathforge.ai.client -> google"]

[tool.pyright]
include = ["oathforge/engine", "oathforge/services"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
