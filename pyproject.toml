[project]
name = "oathforge"
dynamic = ["version"]
description = "Narrative Telegram RPG with an AI Dungeon Master over a deterministic d20 engine"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
oathforge = "oathforge.cli:main"
oath = "oathforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "pillow>=10", "telethon>=1.36", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "oathforge.__version__"}

[tool.setuptools.packages.find]
include = ["oathforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "content", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # a package re-exports its modules

[tool.ruff.lint.isort]
known-first-party = ["oathforge", "tests"]

[tool.ruff.format]
skip-magic-trailing-comma = true  # a list that fits in one line stays in one line
