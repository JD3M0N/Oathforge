# Respaldo bilingüe; condiciones y marcadores en planning/narratio.md.
default:
- es: '{npc} te dedica un gesto breve. «Te escucho, pero no tengo una respuesta.»'
  en: '{npc} gives you a brief nod. "I hear you, but I have no answer."'
- es: «No sabría qué añadir, {name}», responde {npc}.
  en: '"I would not know what to add, {name}," {npc} replies.'
- es: '{npc} guarda silencio antes de hablar. «Prefiero no aventurar palabras.»'
  en: '{npc} is silent before speaking. "I would rather not venture a guess."'
- es: «No tengo mucho que decir al respecto», te dice {npc}.
  en: '"I have little to say about that," {npc} tells you.'
- es: '{npc} inclina la cabeza. «Dejémoslo ahí por ahora.»'
  en: '{npc} tilts their head. "Let us leave it there for now."'
- es: «Las palabras no siempre ayudan», comenta {npc}, sin entrar en detalles.
  en: '"Words do not always help," {npc} remarks, without going into detail.'
- es: '{npc} te escucha sin interrumpir. «No voy a fingir que sé qué decir.»'
  en: '{npc} listens without interrupting. "I will not pretend I know what to say."'
- es: «No quisiera hablar sin fundamento», responde {npc}.
  en: '"I would not want to speak without grounds," {npc} replies.'
- es: '{npc} deja pasar una pausa. «No puedo llevar esta charla más lejos.»'
  en: '{npc} lets a pause pass. "I cannot take this conversation further."'
- es: «Por ahora, pocas palabras», dice {npc} con un gesto sobrio.
  en: '"Few words for now," {npc} says with a sober gesture.'
- es: '{npc} te mira con atención. «No tengo una historia que ofrecerte sobre eso.»'
  en: '{npc} looks at you attentively. "I have no story to offer you about that."'
- es: «Mejor no llenar el silencio por llenarlo, {name}», dice {npc}.
  en: '"Best not fill silence merely to fill it, {name}," {npc} says.'
bram:
- es: Bram se frota la barbilla. «Para hablar por hablar ya están los borrachos.»
  en: Bram rubs his chin. "The drunks do enough talking for its own sake."
- es: «Pocas palabras hoy, {name}. Hasta un tabernero necesita callarse», dice Bram.
  en: '"Few words today, {name}. Even a tavern keeper needs to be quiet," Bram says.'
- es: Bram suelta un bufido. «No voy a servirte humo como si fuera cerveza.»
  en: Bram snorts. "I will not serve you smoke and call it ale."
- es: «No tengo una buena respuesta para eso», admite Bram. «Y las malas salen caras.»
  en: '"I have no good answer for that," Bram admits. "And bad ones cost dearly."'
- es: Bram te escucha y ladea la cabeza. «Dejemos reposar esa charla.»
  en: Bram listens and tilts his head. "Let that conversation settle."
- es: «No toda pausa necesita un cuento», dice Bram, con una sonrisa escueta.
  en: '"Not every pause needs a tale," Bram says with a faint smile.'
- es: Bram se cruza de brazos. «Hoy mi lengua no está para largos viajes.»
  en: Bram folds his arms. "My tongue is not up for long journeys today."
- es: «No te voy a marear con palabrería, {name}», responde Bram.
  en: '"I will not drown you in chatter, {name}," Bram replies.'
- es: Bram resopla con humor seco. «Mira que cuesta encontrarme sin palabras.»
  en: Bram huffs with dry humour. "It takes some doing to find me short of words."
- es: «La charla también necesita descanso», dice Bram. «Dejémosla respirar.»
  en: '"Talk needs rest too," Bram says. "Let it breathe."'
- es: Bram baja la voz. «No tengo nada que añadir que merezca tu oído.»
  en: Bram lowers his voice. "I have nothing to add worth your hearing."
- es: «No voy a inventarme una historia para llenar el hueco», dice Bram.
  en: '"I will not make up a story just to fill the gap," Bram says.'
mira:
- es: Mira te observa. «El silencio también tiene valor.»
  en: Mira watches you. "Silence has value too."
- es: «No tengo nada que añadir, {name}», dice Mira, sin alzar la voz.
  en: '"I have nothing to add, {name}," Mira says without raising her voice.'
- es: Mira entrelaza los dedos. «Hablemos poco.»
  en: Mira interlaces her fingers. "Let us speak little."
- es: «Una pregunta no obliga a una respuesta», señala Mira.
  en: '"A question does not compel an answer," Mira points out.'
- es: Mira deja que el silencio se estire. «Con eso basta por ahora.»
  en: Mira lets the silence stretch. "That is enough for now."
- es: «Las palabras gastadas no vuelven», dice Mira. «Prefiero medirlas.»
  en: '"Spent words never return," Mira says. "I prefer to measure them."'
- es: Mira inclina apenas la cabeza. «No voy a especular.»
  en: Mira barely inclines her head. "I will not speculate."
- es: «No confundas reserva con descortesía», murmura Mira.
  en: '"Do not mistake reserve for discourtesy," Mira murmurs.'
- es: Mira te escucha sin comprometerse. «Lo dejaré sin comentario.»
  en: Mira listens without committing herself. "I will leave that without comment."
- es: «No todas las conversaciones abren puertas», dice Mira.
  en: '"Not every conversation opens doors," Mira says.'
- es: Mira baja la mirada un instante. «No tengo una respuesta para ti.»
  en: Mira lowers her gaze for a moment. "I have no answer for you."
- es: «A veces lo prudente es detener la charla», responde Mira.
  en: '"Sometimes prudence means stopping the conversation," Mira replies.'
holt:
- es: Holt te escucha con gesto severo. «Sin más comentarios.»
  en: Holt listens with a stern expression. "No further comment."
- es: «No hablaré sin certeza», dice Holt. «Eso también es disciplina.»
  en: '"I will not speak without certainty," Holt says. "That too is discipline."'
- es: Holt endereza la espalda. «Seamos breves.»
  en: Holt straightens his back. "Let us be brief."
- es: «No tengo una respuesta que darte, {name}», declara Holt.
  en: '"I have no answer to give you, {name}," Holt states.'
- es: Holt aprieta los labios. «No voy a llenar ese vacío con suposiciones.»
  en: Holt presses his lips together. "I will not fill that gap with assumptions."
- es: «Un juramento pesa más que una charla», dice Holt.
  en: '"An oath carries more weight than talk," Holt says.'
- es: Holt asiente una vez. «No añadiré nada por ahora.»
  en: Holt nods once. "I will add nothing for now."
- es: «La prudencia exige medir las palabras», responde Holt.
  en: '"Prudence requires measured words," Holt replies.'
- es: Holt mantiene un tono formal. «Dejemos esta conversación aquí.»
  en: Holt keeps his tone formal. "Let us leave this conversation here."
- es: «No soy hombre de discursos», te dice Holt.
  en: '"I am not a man for speeches," Holt tells you.'
- es: Holt te mira de frente. «Prefiero el silencio a una afirmación sin fundamento.»
  en: Holt looks you in the eye. "I prefer silence to an unfounded assertion."
- es: «Por ahora, eso es todo», concluye Holt con sobriedad.
  en: '"For now, that is all," Holt concludes soberly.'
tessa:
- es: Tessa ladea la cabeza. «La charla también tiene que enfriarse a veces.»
  en: Tessa tilts her head. "Talk needs to cool sometimes too."
- es: «No tengo respuesta, {name}. Y no voy a martillar una a la fuerza», dice Tessa.
  en: '"I have no answer, {name}. And I will not hammer one into shape by force," Tessa says.'
- es: Tessa ríe por lo bajo. «Hasta yo puedo quedarme sin palabras.»
  en: Tessa chuckles. "Even I can run out of words."
- es: «No voy a venderte palabrería como si fuera buen acero», dice Tessa.
  en: '"I will not sell you chatter as though it were good steel," Tessa says.'
- es: Tessa se cruza de brazos. «Dejemos descansar esa conversación.»
  en: Tessa folds her arms. "Let that conversation rest."
- es: «Una respuesta mal templada se rompe enseguida», comenta Tessa.
  en: '"A poorly tempered answer breaks at once," Tessa remarks.'
- es: Tessa te escucha con una media sonrisa. «No tengo mucho que añadir.»
  en: Tessa listens with a half smile. "I have little to add."
- es: «Para alargar esto sin sentido, mejor callarse», dice Tessa con franqueza.
  en: '"Better to be quiet than drag this out for nothing," Tessa says frankly.'
- es: Tessa se encoge de hombros. «Con eso no sé ayudarte de palabra.»
  en: Tessa shrugs. "I do not know how to help you with words on that."
- es: «No todo se arregla hablando», te dice Tessa. «Aunque ganas no falten.»
  en: '"Not everything can be fixed by talking," Tessa tells you. "Even when we would like to."'
- es: Tessa deja escapar una risa breve. «Mi lengua pide una pausa.»
  en: Tessa lets out a brief laugh. "My tongue wants a pause."
- es: «Mejor una pausa honrada que una respuesta torcida», concluye Tessa.
  en: '"Better an honest pause than a crooked answer," Tessa concludes.'
ysolde:
- es: Ysolde junta las manos. «No siempre hay palabras, {name}.»
  en: Ysolde folds her hands. "There are not always words, {name}."
- es: «El silencio también puede ser amable», te dice Ysolde.
  en: '"Silence can be kind too," Ysolde tells you.'
- es: Ysolde inclina la cabeza. «No quisiera darte una respuesta vacía.»
  en: Ysolde inclines her head. "I would not want to give you an empty answer."
- es: «Dejemos reposar la conversación», sugiere Ysolde con suavidad.
  en: '"Let the conversation rest," Ysolde suggests softly.'
- es: Ysolde te escucha en silencio. «No tengo nada certero que añadir.»
  en: Ysolde listens in silence. "I have nothing certain to add."
- es: «La paciencia no necesita un sermón», dice Ysolde con humor seco.
  en: '"Patience does not need a sermon," Ysolde says with dry humour.'
- es: Ysolde esboza una sonrisa cansada. «Hasta los consejos necesitan descanso.»
  en: Ysolde offers a tired smile. "Even advice needs rest."
- es: «Prefiero admitir que no sé qué decir», responde Ysolde.
  en: '"I would rather admit I do not know what to say," Ysolde replies.'
- es: Ysolde baja la voz. «No voy a cubrir la incertidumbre con palabras solemnes.»
  en: Ysolde lowers her voice. "I will not cover uncertainty with solemn words."
- es: «Por ahora, dejémoslo ahí», dice Ysolde sin dureza.
  en: '"For now, let us leave it there," Ysolde says without harshness.'
- es: Ysolde hace una pausa. «Una respuesta apresurada rara vez consuela.»
  en: Ysolde pauses. "A hurried answer seldom comforts."
- es: «No hace falta hablar para respetar una pausa, {name}», murmura Ysolde.
  en: '"We need not speak to respect a pause, {name}," Ysolde murmurs.'
vale:
- es: Vale da un golpecito al diario que llevas. «Tu siguiente orden está ahí, recluta. Y en /quests.»
  en: 'Vale taps the journal you carry. "Your next order is in there, recruit. And in /quests."'
- es: «Si te pierdes, pulsa 📍 y mira lo que hay a tu alrededor», dice Vale señalando la plaza.
  en: '"If you get lost, press 📍 and look at what is around you," Vale says, pointing at the plaza.'
- es: Vale se cruza de brazos. «Menos charla y más botas en el barro, {name}.»
  en: Vale crosses her arms. "Less talk, more boots in the mud, {name}."
- es: «Eso me lo cuentas cuando vuelvas entero», dice Vale con una risotada.
  en: '"Tell me that when you come back in one piece," Vale says with a bark of laughter.'
- es: Vale señala el diario que llevas. «Lo que toca está ahí escrito. Léelo.»
  en: Vale points at your journal. "What you need to do is written there. Read it."
- es: «Pregúntale a Bram, que se lo sabe todo», gruñe Vale sin mirarte.
  en: '"Ask Bram, he knows everything," Vale grunts without looking at you.'
- es: Vale te da una palmada en el hombro que casi te tumba. «Ánimo, recluta.»
  en: Vale claps you on the shoulder so hard you nearly fall. "Chin up, recruit."
- es: «Ahora no, {name}. Tengo a tres reclutas perdidos y uno llorando», suspira Vale.
  en: '"Not now, {name}. I have three lost recruits and one crying," Vale sighs.'
- es: Vale entorna los ojos. «Si no sabes qué hacer, abre el /rulebook. Para eso está.»
  en: Vale narrows her eyes. "If you don't know what to do, open the /rulebook. That's what it's for."
- es: «Primero haz lo que te mandé. Luego hablamos», zanja Vale.
  en: '"First do what I told you. Then we talk," Vale says, and that is that.'
- es: Vale escupe a un lado. «En mis tiempos no se preguntaba tanto.»
  en: Vale spits to one side. "In my day recruits didn't ask so many questions."
- es: «Come, duerme y afila el acero, {name}. Lo demás viene solo», dice Vale.
  en: '"Eat, sleep and sharpen your steel, {name}. The rest comes on its own," says Vale.'
ilva:
- es: Ilva no levanta la vista del alambique. «Ahora mismo no puedo pensar en eso.»
  en: Ilva does not look up from the still. "I can't think about that right now."
- es: «Pregúntame cuando esto no esté a punto de hervir», dice Ilva.
  en: '"Ask me when this is not about to boil," Ilva says.'
- es: Ilva se limpia los dedos en el mandil. «No tengo una respuesta limpia para darte.»
  en: Ilva wipes her fingers on her apron. "I have no clean answer to give you."
- es: «De eso no entiendo, {name}. De hierbas, sí», responde Ilva.
  en: '"I know nothing of that, {name}. Of herbs, yes," Ilva replies.'
- es: Ilva cuenta gotas en voz baja y niega con la cabeza sin dejar de contar.
  en: Ilva counts drops under her breath and shakes her head without stopping.
- es: «Eso tendría que consultarlo, y mis libros están en desorden», dice Ilva.
  en: '"I would have to look that up, and my books are a mess," Ilva says.'
- es: Ilva aparta un frasco antes de contestar. «Mejor no decir nada a medias.»
  en: Ilva moves a flask aside before answering. "Better not to say something half-true."
- es: «Un alquimista que improvisa acaba sin cejas», comenta Ilva.
  en: '"An alchemist who improvises ends up without eyebrows," Ilva remarks.'
- es: Ilva asiente despacio. «Lo pensaré mientras esto reposa.»
  en: Ilva nods slowly. "I will think about it while this settles."
- es: «No tengo nada que valga la tinta de contarte», dice Ilva.
  en: '"I have nothing worth the ink of telling you," Ilva says.'
- es: Ilva sopla sobre una cuchara caliente. «Dame menos prisa y más datos.»
  en: Ilva blows on a hot spoon. "Give me less haste and more facts."
- es: «Hoy no, {name}. Hoy el fuego manda», dice Ilva.
  en: '"Not today, {name}. Today the fire decides," Ilva says.'
garrick:
- es: Garrick pasa la mano por una tabla. «No sabría decirte.»
  en: Garrick runs a hand over a board. "I couldn't tell you."
- es: «Mido dos veces antes de hablar, y aún no he medido», dice Garrick.
  en: '"I measure twice before speaking, and I have not measured yet," Garrick says.'
- es: Garrick se encoge de hombros sin soltar el formón.
  en: Garrick shrugs without letting go of the chisel.
- es: «De eso hablan otros mejor que yo, {name}», responde Garrick.
  en: '"Others speak of that better than I do, {name}," Garrick replies.'
- es: Garrick sopla el serrín del banco. «Déjame con la madera, que la entiendo.»
  en: Garrick blows sawdust off the bench. "Leave me the wood, I understand that."
- es: «Poca cosa puedo añadir», dice Garrick, y vuelve a la mordaza.
  en: '"Little I can add," Garrick says, and goes back to the vice.'
- es: Garrick tarda en contestar y, cuando lo hace, solo niega con la cabeza.
  en: Garrick takes his time answering and, when he does, only shakes his head.
- es: «Si no sé una cosa, no la relleno con palabras», dice Garrick.
  en: '"If I do not know a thing, I do not pad it with words," Garrick says.'
- es: Garrick golpea dos veces una pieza para comprobarla. «Otra vez será.»
  en: Garrick taps a piece twice to test it. "Another time."
- es: «Pregunta en el gremio, allí apuntan todo», sugiere Garrick.
  en: '"Ask at the guild, they write everything down," Garrick suggests.'
- es: Garrick señala la puerta con el mentón. «Vuelve cuando cierre el taller.»
  en: Garrick nods toward the door. "Come back when I close the workshop."
- es: «Hoy hablo poco, {name}. Tengo un encargo tarde», dice Garrick.
  en: '"I am short of words today, {name}. I have a late order," Garrick says.'
oda:
- es: Oda se ríe. «Mira que venir a la curtiduría a hablar de eso.»
  en: Oda laughs. "Imagine coming to a tannery to talk about that."
- es: «Ni idea, y no voy a inventármelo», dice Oda.
  en: '"No idea, and I am not going to invent one," Oda says.'
- es: Oda hunde una piel en la cuba antes de contestar, y ya no contesta.
  en: Oda sinks a hide into the vat before answering, and then does not answer.
- es: «Tráeme algo con pellejo y hablamos, {name}», responde Oda.
  en: '"Bring me something with a hide and we will talk, {name}," Oda replies.'
- es: Oda se limpia las manos en un trapo que no mejora nada.
  en: Oda wipes her hands on a rag that improves nothing.
- es: «De eso hay quien sabe más y cobra menos», dice Oda.
  en: '"There are people who know more about that and charge less," Oda says.'
- es: Oda tensa una correa entre las manos. «Hoy no me da la cabeza.»
  en: Oda pulls a strap taut between her hands. "My head is not up to it today."
- es: «No te voy a marear con suposiciones», dice Oda.
  en: '"I will not dizzy you with guesses," Oda says.'
- es: Oda mira el bastidor, luego a ti. «Otra cosa será.»
  en: Oda looks at the frame, then at you. "Some other matter, then."
- es: «Pregúntale a Tessa, que esa habla por las dos», dice Oda.
  en: '"Ask Tessa, she talks enough for both of us," Oda says.'
- es: Oda resopla. «Respira por la boca y cambiemos de tema.»
  en: Oda snorts. "Breathe through your mouth and let us change the subject."
- es: «Poco que decir, mucho que curtir», zanja Oda.
  en: '"Little to say, plenty to tan," Oda concludes.'
pell:
- es: Pell no aparta el ojo de la lupa. «Ahora no, por favor.»
  en: Pell does not take his eye off the glass. "Not now, if you please."
- es: «Prefiero no opinar sin mirarlo de cerca», dice Pell.
  en: '"I would rather not opine without a closer look," Pell says.'
- es: Pell deja las pinzas con un cuidado exagerado y guarda silencio.
  en: Pell sets down the tweezers with exaggerated care and stays silent.
- es: «No es mi campo, {name}, y finjo mal», responde Pell.
  en: '"Not my field, {name}, and I feign badly," Pell replies.'
- es: Pell sopla una mota invisible de la bandeja de fieltro.
  en: Pell blows an invisible speck off the felt tray.
- es: «Una respuesta apresurada se raya como una gema mal sujeta», dice Pell.
  en: '"A hasty answer scratches like a badly held gem," Pell says.'
- es: Pell asiente con cortesía y no añade nada.
  en: Pell nods politely and adds nothing.
- es: «Si vuelve usted mañana, quizá lo haya pensado», dice Pell.
  en: '"If you come back tomorrow, perhaps I will have thought it over," Pell says.'
- es: Pell gira una pieza hacia la luz. «Hoy la vista me pide calma.»
  en: Pell turns a piece toward the light. "Today my eyes ask for quiet."
- es: «Hay preguntas que no se engastan», comenta Pell.
  en: '"Some questions cannot be set," Pell remarks.'
- es: Pell señala la reja. «Hablamos con la tienda abierta, no antes.»
  en: Pell points at the grille. "We talk with the shop open, not before."
- es: «Nada que contarle, y no es descortesía», dice Pell.
  en: '"Nothing to tell you, and it is not discourtesy," Pell says.'
lorent:
- es: Lorent levanta la pluma para que no gotee. «No tengo línea para eso.»
  en: Lorent lifts the quill so it does not drip. "I have no line for that."
- es: «Lo consultaría, pero el archivo está húmedo», dice Lorent.
  en: '"I would check, but the archive is damp," Lorent says.'
- es: Lorent sopla sobre la tinta fresca y no dice más.
  en: Lorent blows on the fresh ink and says no more.
- es: «Sin fuente no escribo, {name}, y sin fuente no hablo», responde Lorent.
  en: '"Without a source I do not write, {name}, and without a source I do not speak," Lorent replies.'
- es: Lorent alinea dos pergaminos que ya estaban alineados.
  en: Lorent aligns two parchments that were already aligned.
- es: «Una frase mal puesta cuesta un pergamino entero», dice Lorent.
  en: '"A badly placed sentence costs a whole parchment," Lorent says.'
- es: Lorent niega con la cabeza, muy pulcramente.
  en: Lorent shakes his head, very neatly.
- es: «Preferiría no dictar lo que no sé», dice Lorent.
  en: '"I would rather not dictate what I do not know," Lorent says.'
- es: Lorent mira la cuerda donde se secan los pergaminos. «Hoy voy tarde.»
  en: Lorent glances at the line where the parchments dry. "I am behind today."
- es: «Eso no está copiado en ninguna parte», dice Lorent.
  en: '"That is not copied anywhere," Lorent says.'
- es: Lorent cambia de pluma como quien cambia de tema.
  en: Lorent changes quills the way other people change the subject.
- es: «Con la prisa cobro más y sé lo mismo», dice Lorent.
  en: '"In a hurry I charge more and know the same," Lorent says.'
dunn:
- es: Dunn levanta las manos. «Ni idea, y mejor así.»
  en: Dunn raises his hands. "No idea, and just as well."
- es: «Luego te lo cuento, que esto está armado», dice Dunn.
  en: '"I will tell you later, this thing is primed," Dunn says.'
- es: Dunn aparta un cajón de la izquierda y se olvida de contestar.
  en: Dunn moves a crate on the left and forgets to answer.
- es: «De eso no tengo plano, {name}», responde Dunn.
  en: '"I have no blueprint for that, {name}," Dunn replies.'
- es: Dunn da cuerda a algo que hace clic y escucha, encantado.
  en: Dunn winds something that clicks and listens to it, delighted.
- es: «Si no lo entiendo, lo abro; y esto no se puede abrir», dice Dunn.
  en: '"If I do not understand a thing, I open it; and this cannot be opened," Dunn says.'
- es: Dunn se toca la ceja que le falta a medias. «Prefiero no aventurar.»
  en: Dunn touches his half-missing eyebrow. "I would rather not venture it."
- es: «Pregunta en el gremio, que ellos lo apuntan todo», dice Dunn.
  en: '"Ask at the guild, they note everything down," Dunn says.'
- es: Dunn asiente deprisa, como si ya estuviera en otra cosa.
  en: Dunn nods quickly, as if he were already on to something else.
- es: «Hoy ando con una mecha que no quiere arder igual dos veces», dice Dunn.
  en: '"Today I am fighting a fuse that will not burn the same twice," Dunn says.'
- es: Dunn señala la puerta abierta. «Y no traigas farol.»
  en: Dunn points at the open door. "And don't bring a lantern."
- es: «Nada que decir y mucho que medir», dice Dunn.
  en: '"Nothing to say and plenty to measure," Dunn says.'
