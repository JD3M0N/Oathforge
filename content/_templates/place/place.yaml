name: {es: "TODO(new) __name__", en: "__name__"}
article: {es: "", en: ""}  # «el», «la»… delante del nombre en una frase; vacío si no lleva
kind: __kind__  # city, wild o dungeon
description: {es: TODO(new), en: "__description__"}
night: {es: TODO(new), en: TODO(new)}
exits:
  - {to: __to__, minutes: 5}  # danger: 0-3, requires_flag: <flag>, yards: <n> si el terreno es lento
