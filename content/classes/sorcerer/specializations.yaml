    deeper_slow:
      level: 13
      name: {es: Lentitud Profunda, en: Deeper Slowness}
      description: {es: El Tiempo entrecortado hace 5d8 y traba 1 turno más., en: Stuttering Time deals 5d8 and restrains 1 turn longer.}
      patches:
        stuttering_time:
          damage: 5d8
          status_turns: 1
    cheap_bolt:
      level: 17
      name: {es: Dardo Económico, en: Cheap Bolt}
      description: {es: El Dardo temporal cuesta 3 menos., en: Time Bolt costs 3 less.}
      patches:
        time_bolt:
          cost: -3
    grander_collapse:
      level: 17
      name: {es: Colapso Mayor, en: Grander Collapse}
      description: {es: El Colapso temporal hace 12d8 en lugar de 9d8., en: Temporal Collapse deals 12d8 instead of 9d8.}
