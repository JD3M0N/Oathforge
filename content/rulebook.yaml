# /rulebook: one page per section, in this order. Plain text (it is escaped); /commands stay tappable.
# A new section is just a new entry here.

dice:
  icon: "🎲"
  title: {es: Tiradas y dificultad, en: Rolls and difficulty}
  body:
    es: |-
      Casi todo se decide con un d20, un dado de 20 caras: d20 + tu bonificador contra una dificultad (CD). Si igualas o superas la CD, lo consigues.
      • CD {dc_trivial} trivial · {dc_easy} fácil · {dc_medium} normal · {dc_hard} difícil · {dc_very_hard} muy difícil.
      • Tu bonificador = el modificador del atributo + tu competencia si dominas esa habilidad (+2 a nivel 1, +3 a nivel {max_level}).
      • Con ventaja tiras dos d20 y te quedas el mayor; con desventaja, el menor.
      • Un 20 natural en un ataque es un crítico (dobla los dados de daño); un 1 natural siempre falla. Alguna habilidad amplía ese rango y acierta crítico también con 19.
      Cada prueba de habilidad se intenta una vez al día en cada lugar; al subir de nivel puedes volver a intentarla. Las tiradas las hace siempre el motor del juego, nunca la IA.
    en: |-
      Almost everything is decided with a d20, a twenty-sided die: d20 + your bonus against a difficulty class (DC). Meet or beat the DC and you succeed.
      • DC {dc_trivial} trivial · {dc_easy} easy · {dc_medium} normal · {dc_hard} hard · {dc_very_hard} very hard.
      • Your bonus = the ability modifier + your proficiency if you are trained in that skill (+2 at level 1, +3 at level {max_level}).
      • With advantage you roll two d20 and keep the higher; with disadvantage, the lower.
      • A natural 20 on an attack is a critical hit (damage dice doubled); a natural 1 always misses. A few abilities widen that range and also crit on a 19.
      Each skill check can be tried once a day in each place; a level up lets you try again. Rolls are always made by the game engine, never by the AI.

abilities:
  icon: "⚖️"
  title: {es: Atributos y modificadores, en: Abilities and modifiers}
  body:
    es: |-
      Seis atributos describen a tu héroe. Cada uno da un modificador: (atributo − 10) ÷ 2, redondeando hacia abajo. 10 da +0, 14 da +2, 16 da +3, 8 da −1.
      Se reparten al crear el personaje con {points} puntos (como en D&D) más el bonificador de tu linaje. En los niveles {training_levels} eliges un entrenamiento, y al nivel {branch_level} tu rama de clase (mira /path).
    en: |-
      Six abilities describe your hero. Each gives a modifier: (score − 10) ÷ 2, rounded down. 10 gives +0, 14 gives +2, 16 gives +3, 8 gives −1.
      You assign them at creation with {points} points (as in D&D) plus your lineage bonus. At levels {training_levels} you pick a training, and at level {branch_level} your class branch (see /path).

armor:
  icon: "🛡️"
  title: {es: Clase de armadura (CA), en: Armor class (AC)}
  body:
    es: |-
      La CA mide lo difícil que es acertarte. Un ataque acierta si d20 + bonificador de ataque iguala o supera tu CA.
      • Sin armadura: 10 + DES. Con armadura: su valor + DES, con un tope según la armadura (las pesadas no suman DES).
      • Un escudo suma +2, y algunas habilidades de clase también suben la CA.
      En el combate verás la 🛡️ CA de cada combatiente; la tuya está en /hero.
    en: |-
      AC measures how hard you are to hit. An attack hits if d20 + attack bonus meets or beats your AC.
      • No armor: 10 + DEX. With armor: its value + DEX, capped by the armor (heavy armor adds no DEX).
      • A shield adds +2, and some class abilities raise AC too.
      In combat you see each fighter's 🛡️ AC; yours is in /hero.

health:
  icon: "❤️"
  title: {es: Puntos de vida y dado de golpe, en: Hit points and hit die}
  body:
    es: |-
      Los puntos de vida (PV) son el aguante de tu héroe. A 0 PV caes derrotado: despiertas en un lugar seguro con la mitad de la vida, herido (hasta un descanso largo) y con un {defeat_gold_pct} % menos de oro (como mucho {defeat_gold_cap} por nivel). Nunca pierdes equipo ni compañeros.
      El dado de golpe depende de la clase (d6 para el Hechicero, d10 para el Paladín…). A nivel 1 tienes el máximo del dado + tu modificador de CON; cada nivel suma la mitad del dado + 1 + CON.
      Por eso la Constitución importa a todas las clases.
    en: |-
      Hit points (HP) are your hero's staying power. At 0 HP you are defeated: you wake up somewhere safe at half HP, injured (until a long rest) and with {defeat_gold_pct}% less gold (at most {defeat_gold_cap} per level). You never lose gear or companions.
      The hit die depends on the class (d6 for the Sorcerer, d10 for the Paladin…). At level 1 you get the die's maximum + your CON modifier; each level adds half the die + 1 + CON.
      That is why Constitution matters to every class.

combat:
  icon: "⚔️"
  title: {es: Combate, en: Combat}
  body:
    es: |-
      El combate es por turnos, en el orden de la iniciativa (d20 + DES). En tu turno tienes una acción (atacar, una habilidad de clase, usar un objeto) y a veces una acción adicional.
      • Cada clase tiene su propia barra (Foco, Furia, Convicción, Energía, Maná, Resonancia, Esencia, Carga o Poder rúnico): las habilidades la gastan y el coste está en el botón. El ataque básico siempre es gratis. Un descanso largo la llena.
      • «🎒 Objetos»: pociones, pergaminos y bombas.
      • Huir es una prueba de Atletismo o Acrobacias contra CD {flee_dc_base} + {flee_dc_step} por enemigo; si falla, pierdes el turno.
      Al acabar, «📜 Informe» (o /report) cuenta la batalla tirada a tirada.
    en: |-
      Combat is turn-based, in initiative order (d20 + DEX). On your turn you get one action (attack, a class ability, use an item) and sometimes a bonus action.
      • Every class has its own bar (Focus, Fury, Conviction, Energy, Mana, Resonance, Essence, Charge or Runic Power): abilities spend it and the cost is on the button. The basic attack is always free. A long rest fills it.
      • "🎒 Items": potions, scrolls and bombs.
      • Fleeing is an Athletics or Acrobatics check against DC {flee_dc_base} + {flee_dc_step} per enemy; if it fails, you lose the turn.
      Afterwards, "📜 Report" (or /report) tells the battle roll by roll.

rest:
  icon: "🛌"
  title: {es: Descanso y curación, en: Rest and healing}
  body:
    es: |-
      • Descanso largo en la posada de La Corona Rota: {rest_gold} de oro y {rest_min} minutos reales. Si lo abandonas no recuperas nada. Recuperas toda la vida y tu barra de clase, se curan las heridas graves y vuelven tus descansos cortos.
      • El Puesto del Vado, en el Valle de la Fragua Gris, tiene su propia cama (también de pago): el único refugio fuera de Crownreach.
      • «Curar heridas» en la Capilla del Alba: {heal_gold} de oro (si llevas menos, te atienden por lo que tengas) y al momento. La hermana Ysolde cierra también las heridas graves que deja una derrota.
      • Descanso corto, en cualquier sitio: {short_rest_min} minutos, gratis; recuperas un {short_rest_pct} % de la vida (sin pasar del límite de las heridas graves) y parte de tu barra o de un uso gastado. Solo {short_rests} entre dos descansos largos.
      • Las pociones de curación ayudan fuera de la ciudad; el tónico del reposo da un descanso corto y luego tarda un rato en poder usarse otra vez.
      En el juego también pasan el día y la noche: algunas criaturas cambian según la hora.
    en: |-
      • Long rest at the Broken Crown inn: {rest_gold} gold and {rest_min} real minutes. If you abandon it you recover nothing. You recover all your HP and your class bar, grave wounds heal and your short rests come back.
      • Ford Post, in Greyforge Vale, has its own bed (also for a fee): the only shelter outside Crownreach.
      • "Cure wounds" at the Chapel of Dawn: {heal_gold} gold (if you carry less, they treat you for what you have) and right away. Sister Ysolde also closes the grave wounds a defeat leaves.
      • Short rest, anywhere: {short_rest_min} minutes, free; you recover {short_rest_pct}% of your HP (never past the grave-wound limit) and part of your bar or of a spent use. Only {short_rests} between two long rests.
      • Healing potions help outside the city; the rest draught grants a short rest and then needs a while before it works again.
      The game also has day and night: some creatures change with the hour.

lineages:
  icon: "🧬"
  title: {es: Linajes, en: Lineages}
  body:
    es: |-
      Tu linaje (humano, elfo, enano, orco) suma puntos a tus atributos y te da un rasgo propio, como los sentidos agudos del elfo o la resistencia implacable del orco.
      Todos los linajes con sus bonificadores: /lineage
    en: |-
      Your lineage (human, elf, dwarf, orc) adds points to your abilities and gives you a trait of its own, like the elf's keen senses or the orc's relentless endurance.
      Every lineage with its bonuses: /lineage

backgrounds:
  icon: "📜"
  title: {es: Trasfondos, en: Backgrounds}
  body:
    es: |-
      Tu trasfondo es quién eras antes de la aventura: te da 2 habilidades dominadas, oro inicial y algo de equipo. También puedes escribir el tuyo propio al crear el personaje.
      Todos los trasfondos: /background
    en: |-
      Your background is who you were before adventuring: it gives you 2 trained skills, starting gold and some gear. You can also write your own when creating your character.
      Every background: /background

classes:
  icon: "📚"
  title: {es: Clases, en: Classes}
  body:
    es: |-
      La clase decide cómo luchas: tu dado de golpe, tu atributo principal, tu barra de recurso y tus habilidades por nivel. Tu rama de clase se elige al nivel {branch_level} (/path).
      Guerrero, Bárbaro, Paladín y Caballero de la Muerte aguantan en primera línea; el Monje pelea con técnica, el Pícaro desde las sombras y el Explorador desde lejos; Hechicero, Brujo, Druida y Chamán lanzan conjuros, el Artífice usa su aparato, y Clérigo y Bardo cuidan del grupo.
      Todas las clases y sus habilidades: /classes
    en: |-
      Your class decides how you fight: your hit die, your primary ability, your resource bar and your abilities by level. Your class branch is chosen at level {branch_level} (/path).
      Warrior, Barbarian, Paladin and Death Knight hold the front line; the Monk fights with technique, the Rogue from the shadows and the Ranger from afar; Sorcerer, Warlock, Druid and Shaman cast spells, the Artificer uses a device, and Cleric and Bard look after the party.
      Every class and its abilities: /classes

activities:
  icon: "🧺"
  title: {es: Actividades, en: Activities}
  body:
    es: |-
      Fuera de la ciudad, cada lugar tiene sus actividades. Llevan tiempo real, también en el tutorial: mientras trabajas no puedes viajar ni hacer otra cosa. Al acabar, el bot te manda lo obtenido aunque hayas cerrado Telegram. Todas están en «⚒ Actividades» (teclado fijo o escena), con su duración y lo que te falta.
      • ⛏️ Minar (pico), 🪓 talar (hacha), 🌿 recolectar hierbas (hoz) y 🎣 pescar (caña): «Trabajar» dura {gather_min} min y da {gather_units} materiales. Sin peligro.
      • 🏕️ Expedición larga: {stay_min} min y {stay_units} materiales, más XP. Al final puede haber emboscada ({ambush} según el lugar): si ganas te lo llevas todo, si huyes la mitad y si caes lo pierdes.
      • 🐾 Rastrear: {track_min} min siguiendo huellas. El {prey_pct} % de las veces das con una presa y peleas; si la vences, te llevas trofeos además del desuello.
      • 🏹 Cazar: pelear al momento contra lo que vive en el lugar.
      • 🔪 Desollar: tras vencer a una bestia, /skin con el cuchillo de desollar ({skin_s} s una presa pequeña, hasta {skin_s_max} s las grandes) da pieles y carne. Si te vas o empiezas otra cosa, la pieza se pierde.
      • 🛏️ Descansar: en la taberna, 8 horas de juego ({rest_min} min) para recuperar PV y habilidades.
      Cada actividad sube su maestría, de 0 a {max_rank}: cada rango da un {bonus_pct} % más de probabilidad de botín extra (hasta {bonus_cap} %) y abre recursos más raros. Todas: /masteries
    en: |-
      Outside the city, each place has its own activities. They take real time, the tutorial included: while you work you cannot travel or do anything else. When it ends, the bot sends you what you got even if you closed Telegram. They all live in "⚒ Activities" (fixed keyboard or scene), with how long they take and what you lack.
      • ⛏️ Mining (pickaxe), 🪓 woodcutting (axe), 🌿 herb gathering (sickle) and 🎣 fishing (rod): "Work" takes {gather_min} min and gives {gather_units} materials. No danger.
      • 🏕️ Long expedition: {stay_min} min and {stay_units} materials, more XP. At the end you may be ambushed ({ambush} depending on the place): win and you keep it all, flee and you keep half, fall and you lose it.
      • 🐾 Tracking: {track_min} min following tracks. {prey_pct} % of the time you find prey and fight it; beat it and you get trophies on top of skinning.
      • 🏹 Hunting: fight whatever lives in the place, right away.
      • 🔪 Skinning: after beating a beast, /skin with a skinning knife ({skin_s} s for small prey, up to {skin_s_max} s for the big ones) gives hides and meat. If you leave or start something else, the carcass is lost.
      • 🛏️ Resting: at the tavern, 8 game hours ({rest_min} min) to recover HP and abilities.
      Each activity raises its mastery, from 0 to {max_rank}: every rank adds {bonus_pct} % chance of bonus loot (up to {bonus_cap} %) and opens rarer resources. All of them: /masteries

professions:
  icon: "⛏️"
  title: {es: Recolección y oficios, en: Gathering and crafts}
  body:
    es: |-
      Hay tres cosas distintas:
      • ⛏️ Maestrías de campo (minería, tala, herboristería, desuello, rastreo): libres para todos, suben con las actividades. /masteries
      • 🛠️ Oficios (herrería, alquimia, carpintería, peletería, joyería, escribanía, ingeniería y sastrería): tienes {slots} plazas. Cada oficio se aprende gratis con su maestro, en su puesto del Barrio de Oficios, y allí mismo se fabrica; cambiarlo cuesta {swap_cost} de oro y no pierdes lo aprendido. /professions
      • 🍲 Aficiones (cocina y pesca): opcionales y sin plaza. /hobbies
      • 🔨 Refinar es cosa de las maestrías, no de los oficios: en el Gremio de Aventureros, la mena se funde en lingotes en el horno (XP de Minería), los troncos se asierran en tablones (Tala), las pieles se curan en cuero (Desuello) y la fibra se limpia en la mesa de preparación (Herboristería). No hace falta oficio para refinar, y lo refinado es lo que piden los oficios.
      Al subir de rango aprendes de golpe una técnica entera, con todas sus recetas comunes: no se compran una a una. Las recetas especiales no se aprenden por rango, sino leyendo su 📘 plano, que se gasta al hacerlo y no se olvida nunca (ni al cambiar de oficio); si ya la conoces, el plano no se gasta y puedes venderlo.
      Con lo refinado y lo del campo fabricas en el puesto de cada oficio: armas, armaduras, pociones, anillos, pergaminos o bombas. Fabricar es al momento si tienes los ingredientes y el rango, y puedes hacer varias de una vez (hasta {craft_batch}). Con /recipes ves todas tus recetas por pestañas, cada una con su /r_<receta>; desde ahí fabricas, o escribes /craft_<receta> 5.
    en: |-
      There are three different things:
      • ⛏️ Field masteries (mining, woodcutting, herbalism, skinning, tracking): free for everyone, they grow with activities. /masteries
      • 🛠️ Professions (blacksmithing, alchemy, carpentry, leatherworking, jewelcrafting, scribing, engineering and tailoring): you have {slots} slots. Each trade is learned for free from its master, at their stall on Craftsmen’s Row, and crafted there too; swapping one costs {swap_cost} gold and you keep what you learned. /professions
      • 🍲 Hobbies (cooking and fishing): optional and slot-free. /hobbies
      • 🔨 Refining belongs to the masteries, not to the trades: at the Adventurers' Guild, ore is smelted into ingots at the furnace (Mining XP), logs are sawn into planks (Woodcutting), hides are cured into leather (Skinning) and fiber is cleaned at the preparation table (Herbalism). No profession is needed to refine, and what you refine is what the trades ask for.
      Each new rank teaches you a whole technique at once, with all its common recipes: you never buy them one by one. Special recipes are not learned by rank but by reading their 📘 blueprint, which is spent doing it and is never forgotten (not even when you change trade); if you already know it, the blueprint is not spent and you can sell it.
      With refined and field materials you craft at each trade's stall: weapons, armor, potions, rings, scrolls or bombs. Crafting is instant if you have the ingredients and the rank, and you can make several at once (up to {craft_batch}). /recipes shows all your recipes in tabs, each with its /r_<recipe>; you craft from there, or type /craft_<recipe> 5.

specializations:
  icon: "🌿"
  title: {es: Ramas de maestría, en: Mastery branches}
  body:
    es: |-
      Cada maestría de campo (y la Pesca) tiene dos ramas. Al llegar a rango {spec_rank} eliges una en el Gremio de Aventureros; la otra queda pausada, con lo aprendido, y volver a ella cuesta {spec_cost} de oro. Solo la activa cuenta: las pausadas no suman nada.
      • Una rama de volumen da una oportunidad de **unidad extra por actividad completa** (no por cada cosa que sacas, y esa unidad no da XP).
      • Una rama selectiva mejora el **hallazgo raro**, que también se tira una vez por actividad y sustituye una unidad común.
      • Los bonos de raro son **relativos**, no puntos: con un 10 % de base, un +5 % lo deja en 10,5 %, no en 15 %. Y por muchos que se junten, nunca llega a ser seguro.
      • La rama que cuenta es la que tenías al **empezar** la actividad: cambiarla a mitad no cambia el premio, y con un trabajo en marcha no se puede cambiar.
      🧰 **Herramientas especializadas**: cada disciplina tiene tres diseños —rápido (−10 % de tiempo), selectivo (raro ×1,05) y productivo (5 % de una unidad extra por actividad)—. Eliges **una por disciplina** en 🛠️ Oficios → Maestrías → 🧰 Herramientas; llevar tres no suma. La rama y la herramienta se suman una sola vez, y la herramienta también queda fijada al empezar. Las herramientas no se desgastan.
      Un ejemplo con las dos formas de contar: si la base de encontrar algo raro es del 10 %, un bono **relativo** del +5 % la deja en 10,5 % (10 × 1,05); si fueran **puntos**, la dejaría en 15 %. Aquí siempre es lo primero.
    en: |-
      Every field mastery (and Fishing) has two branches. On reaching rank {spec_rank} you choose one at the Adventurers' Guild; the other is paused, with what it learned, and coming back to it costs {spec_cost} gold. Only the active one counts: paused ones add nothing.
      • A volume branch gives a chance of **one extra unit per completed activity** (not per item you pull out, and that unit pays no XP).
      • A selective branch improves the **rare find**, which is also rolled once per activity and replaces a common unit.
      • Rare bonuses are **relative**, not points: on a 10 % base, +5 % makes it 10.5 %, not 15 %. And however many pile up, it never becomes certain.
      • The branch that counts is the one you had when the activity **started**: switching halfway changes no prize, and with work under way you cannot switch at all.
      🧰 **Specialized tools**: each discipline has three designs — quick (−10 % time), selective (rare ×1.05) and productive (5 % chance of one extra unit per activity). You choose **one per discipline** in 🛠️ Professions → Masteries → 🧰 Tools; carrying three adds nothing. Branch and tool are added once, and the tool is frozen at the start too. Tools do not wear out.
      An example of the two ways of counting: if the base chance of a rare find is 10 %, a **relative** +5 % makes it 10.5 % (10 × 1.05); as **points** it would make it 15 %. Here it is always the first.

home:
  icon: "🏠"
  title: {es: Tu cuarto y el cofre, en: Your room and the chest}
  body:
    es: |-
      El Gremio de Aventureros da un cuarto a sus socios, y la misión «Un cuarto propio» te lo amuebla: con tablones montas el 📦 cofre y, con tablones y la tela del gremio, la 🛏️ cama. No hace falta ser carpintero ni sastre: son dos recetas de iniciación que solo existen mientras esa misión dura.
      • 🛏️ Dormir en tu cama es un descanso largo normal, con lo que recupera y lo que tarda, pero no cuesta oro.
      • 📦 El cofre guarda {chest_slots} huecos. Lo que está dentro no se lleva encima: no se vende, no se gasta y no se fabrica con ello hasta que lo saques. Cada cosa conserva quién la hizo.
      • Con /room ves el cuarto, y con /stash_<objeto> 5 y /take_<objeto> 5 mueves lo que quieras.
      • Un carpintero puede fabricar la mejora del cofre, que añade {chest_upgrade} huecos sin tocar lo guardado; quien no lo sea, se la compra.
    en: |-
      The Adventurers' Guild gives its members a room, and the mission "A Room of Your Own" furnishes it: planks build the 📦 chest and, with planks and the guild's cloth, the 🛏️ bed. You need be neither carpenter nor tailor: they are two starter recipes that exist only while that mission runs.
      • 🛏️ Sleeping in your bed is an ordinary long rest, with the same recovery and the same wait, but it costs no gold.
      • 📦 The chest holds {chest_slots} slots. What is inside is not carried: it cannot be sold, spent or crafted with until you take it out. Each piece keeps who made it.
      • /room opens the room, and /stash_<item> 5 and /take_<item> 5 move things either way.
      • A carpenter can make the chest upgrade, which adds {chest_upgrade} slots without touching what is stored; everyone else buys it.

travel:
  icon: "🧭"
  title: {es: Viajar y explorar, en: Travel and explore}
  body:
    es: |-
      Eliges adónde ir y el juego pone el camino. A cualquier lugar que ya conozcas llegas en un toque, aunque esté lejos: del Puesto del Vado a la plaza, o de la plaza a la mina. Lo que aún no conoces se explora camino a camino.
      ⚠️ es el peligro del peor tramo del viaje. Cada viaje tira una sola vez por emboscada: un tramo ⚠️ tiene un {trip_base} % y cada ⚠️ más del peor tramo suma otro {trip_base} %; cada tramo peligroso de más añade {trip_step} %, hasta un {trip_cap} % como mucho. Si te emboscan, el viaje se para ahí; al acabar, «▶️ Seguir» te lleva al destino sin otra tirada.
      El mapa enseña dónde estás, tu objetivo (📜, si ya sabes llegar), a dónde puedes ir, a qué distancia (en yardas) y qué se puede hacer en cada lugar: /map
      Viajar es inmediato: la distancia es solo una referencia y no gasta tiempo. Lo que sí lleva tiempo real son las actividades.
      Los botones cubren lo habitual, pero también puedes escribir lo que quieras hacer («me escondo tras la barra y escucho»): la IA lo interpreta y el motor decide qué pasa.
    en: |-
      You choose where to go and the game finds the way. Any place you already know is one tap away, however far: from Ford Post to the plaza, or from the plaza to the mine. What you don't know yet is explored one road at a time.
      ⚠️ is the danger of the worst stretch of the trip. Each trip rolls for an ambush only once: a ⚠️ road has a {trip_base} % chance and each further ⚠️ on the worst stretch adds another {trip_base} %; every extra dangerous stretch adds {trip_step} %, up to {trip_cap} % at most. If you are ambushed, the trip stops there; afterwards, «▶️ Carry on» takes you to the destination with no further roll.
      The map shows where you are, your objective (📜, if you already know the way), where you can go, how far it is (in yards) and what you can do in each place: /map
      Travelling is immediate: the distance is only a reference and takes no time. What does take real time are the activities.
      Buttons cover the usual, but you can also type whatever you want to do ("I hide behind the bar and listen"): the AI interprets it and the engine decides what happens.

achievements:
  icon: "🏆"
  title: {es: Logros y títulos, en: Achievements and titles}
  body:
    es: |-
      Los logros reconocen lo que has hecho de verdad: el motor registra cada hecho y el logro se concede solo, una única vez. La IA no los da.
      • No dan poder: ni vida, ni daño, ni oro. Solo puntos de logro, títulos y presumir.
      • Algunos vienen con pista en vez de descripción; otros están ocultos hasta que los consigues. Nada se pierde por tardar y no hay rachas que castiguen ausencias.
      • Unos pocos conceden un título. Puedes equipar uno y se ve junto a tu nombre: /achievements
      • Hasta tres logros destacados en tu héroe y tres objetivos seguidos en el diario, para tener algo que perseguir.
      Todo lo que el motor registra queda también en el Libro del Héroe, la crónica de tu partida: 📖 Diario → 🕯️ Crónica.
    en: |-
      Achievements recognise what you actually did: the engine records each fact and the achievement is granted on its own, exactly once. The AI never grants them.
      • They give no power: no HP, no damage, no gold. Only achievement points, titles and bragging rights.
      • Some come with a hint instead of a description; others stay hidden until you earn them. Nothing is lost by taking your time, and no streak punishes you for being away.
      • A few grant a title. You can equip one and it shows next to your name: /achievements
      • Up to three featured achievements on your hero and three tracked objectives in the journal, so there is always something to chase.
      Everything the engine records also goes into the Hero's Book, the chronicle of your game: 📖 Journal → 🕯️ Chronicle.
