  type: tool
  value: 15

woodaxe:
  name: {es: Hacha de leñador, en: Woodcutter's axe}
  description: {es: "Hoja ancha y pesada, hecha para troncos y no para cráneos.", en: "A broad heavy blade made for logs, not skulls."}
