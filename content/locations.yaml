start: crownreach_plaza

locations:
  crownreach_plaza:
    name: {es: Plaza de Crownreach, en: Crownreach Plaza}
    kind: city
    respawn: true
    description:
      es: >-
        La plaza mayor bulle de carros, pregoneros y soldados de la Guardia de Plata. Al norte se alza
        la capilla, donde los sanadores atienden a los aventureros que vuelven a rastras.
      en: >-
        The great plaza bustles with carts, criers and Silver Guard soldiers. To the north stands the
        chapel, where healers tend to adventurers who come back crawling.
    night:
      es: Las farolas tiemblan bajo la llovizna. Solo la capilla y la taberna mantienen la luz encendida.
      en: Streetlamps flicker in the drizzle. Only the chapel and the tavern keep their lights on.
    exits:
      - {to: broken_crown_tavern, minutes: 2}
      - {to: crownreach_market, minutes: 3}
      - {to: old_kings_road, minutes: 30, danger: 1}
    discoveries:
      chapel_inscription:
        skill: religion
        tier: easy
        sets_flag: lore_chapel_oath
        text:
          es: >-
            Bajo el altar lees una inscripción: «El guardián no dormirá mientras el sello siga roto».
            Alguien ha pasado los dedos por esas letras hace poco.
          en: >-
            Beneath the altar you read an inscription: "The warden shall not sleep while the seal is broken."
            Someone ran their fingers over those letters recently.

  broken_crown_tavern:
    name: {es: Taberna La Corona Rota, en: The Broken Crown Tavern}
    kind: city
    rest_cost: 5
    description:
      es: >-
        El olor a madera quemada y carne asada llena el salón. Dos mercenarios discuten junto a la
        chimenea y el suelo cruje con cada paso.
      en: >-
        The smell of burning wood and roast meat fills the hall. Two mercenaries argue by the fireplace
        and the floor creaks with every step.
    night:
      es: La taberna está llena. Entre el humo y las risas, alguien observa la puerta sin parpadear.
      en: The tavern is packed. Between the smoke and the laughter, someone watches the door without blinking.
    exits:
      - {to: crownreach_plaza, minutes: 2}
    discoveries:
      loose_floorboard:
        skill: investigation
        tier: hard
        sets_flag: found_floorboard_stash
        gold: 15
        text:
          es: Una tabla suelta junto a la chimenea esconde una bolsita con quince monedas de oro.
          en: A loose board by the fireplace hides a small pouch with fifteen gold coins.

  crownreach_market:
    name: {es: Mercado de Crownreach, en: Crownreach Market}
    kind: city
    description:
      es: Toldos de colores, el martilleo de la herrería y mercaderes que juran que su precio es el más justo.
      en: Colorful awnings, the hammering of the smithy, and merchants swearing their price is the fairest.
    night:
      es: Los puestos están cerrados. Solo las ratas y algún comprador discreto recorren los pasillos.
      en: The stalls are shut. Only rats and the odd discreet buyer walk the aisles.
    exits:
      - {to: crownreach_plaza, minutes: 3}

  old_kings_road:
    name: {es: Camino del Viejo Rey, en: Old King's Road}
    kind: wild
    description:
      es: >-
        Una calzada antigua y agrietada que une Crownreach con el bosque. Los carros abandonados
        cuentan historias que nadie quiere escuchar.
      en: >-
        An old, cracked causeway linking Crownreach to the forest. Abandoned carts tell stories no one
        wants to hear.
    exits:
      - {to: crownreach_plaza, minutes: 30, danger: 1}
      - {to: whispering_woods, minutes: 40, danger: 2}
    encounters:
      - {monsters: [bandit], weight: 3}
      - {monsters: [bandit, bandit], weight: 2}
      - {monsters: [goblin_scout, goblin_scout], weight: 2}
      - {monsters: [bandit_captain, bandit], weight: 1}
    scene_objects:
      overturned_cart:
        name: {es: Carro volcado, en: Overturned cart}
        description: {es: Un carro cargado de barriles en precario equilibrio., en: A cart loaded with barrels in a precarious balance.}
        skill: athletics
        tier: medium
        effect: {damage: 2d6, targets: one}
    discoveries:
      bandit_tracks:
        skill: survival
        tier: medium
        sets_flag: found_bandit_tracks
        text:
          es: Huellas frescas salen del camino hacia el bosque. Alguien ha estado vigilando a los viajeros.
          en: Fresh tracks leave the road toward the forest. Someone has been watching travelers.

  whispering_woods:
    name: {es: Bosque de los Susurros, en: Whispering Woods}
    kind: wild
    description:
      es: >-
        La lluvia golpea las hojas de los robles de Thornwood. Entre los troncos, el viento parece
        pronunciar nombres.
      en: >-
        Rain beats on the leaves of the Thornwood oaks. Between the trunks, the wind seems to speak names.
    exits:
      - {to: old_kings_road, minutes: 40, danger: 2}
      - {to: crypt_entrance, minutes: 20, requires_flag: crypt_unlocked}
    encounters:
      - {monsters: [grey_wolf], weight: 3}
      - {monsters: [grey_wolf, grey_wolf], weight: 2}
      - {monsters: [goblin_scout, bandit], weight: 1}
    scene_objects:
      hornet_nest:
        name: {es: Avispero, en: Hornet nest}
        description: {es: Un enorme avispero cuelga de una rama baja., en: A huge hornet nest hangs from a low branch.}
        skill: athletics
        tier: easy
        effect: {damage: 1d4, damage_type: poison, targets: all_enemies, status: {status: poisoned, turns: 2}}
    discoveries:
      healing_herbs:
        skill: medicine
        tier: easy
        sets_flag: found_healing_herbs
        gives: {healing_potion: 1}
        text:
          es: Reconoces raíz de sangre entre los helechos y preparas un ungüento curativo.
          en: You spot bloodroot among the ferns and prepare a healing salve.
      hidden_stairs:
        skill: perception
        tier: very_hard
        sets_flag: crypt_unlocked
        text:
          es: Bajo un manto de hiedra descubres unos peldaños de piedra que descienden hacia la oscuridad.
          en: Beneath a curtain of ivy you find stone steps descending into darkness.

  crypt_entrance:
    name: {es: "Cripta Hundida: entrada", en: "Sunken Crypt: entrance"}
    kind: dungeon
    description:
      es: Escalones resbaladizos bajan hasta una puerta de bronce. El aire huele a tierra húmeda y a hierro viejo.
      en: Slippery steps lead down to a bronze door. The air smells of damp earth and old iron.
    exits:
      - {to: whispering_woods, minutes: 20}
      - {to: crypt_hall, minutes: 2}
    fixed_encounters:
      - {monsters: [crypt_skeleton], flag: cleared_crypt_entrance, unless_flag: syndicate_in_crypt}
      - {monsters: [bandit, bandit], flag: cleared_crypt_entrance, if_flag: syndicate_in_crypt}

  crypt_hall:
    name: {es: "Cripta Hundida: sala de los juramentos", en: "Sunken Crypt: hall of oaths"}
    kind: dungeon
    description:
      es: Estatuas de caballeros sin rostro flanquean la sala. Sus espadas apuntan todas hacia el mismo pasillo.
      en: Faceless knight statues line the hall. Their swords all point toward the same corridor.
    exits:
      - {to: crypt_entrance, minutes: 2}
      - {to: crypt_ossuary, minutes: 2}
      - {to: crypt_gallery, minutes: 3}
    fixed_encounters:
      - {monsters: [crypt_skeleton, crypt_skeleton], flag: cleared_crypt_hall}

  crypt_ossuary:
    name: {es: "Cripta Hundida: osario", en: "Sunken Crypt: ossuary"}
    kind: dungeon
    description:
      es: Miles de cráneos ordenados con un cuidado inquietante cubren las paredes.
      en: Thousands of skulls, arranged with unsettling care, cover the walls.
    exits:
      - {to: crypt_hall, minutes: 2}
    discoveries:
      warden_epitaph:
        skill: history
        tier: medium
        sets_flag: warden_lore
        text:
          es: >-
            Un epitafio cuenta que Ser Aldren juró custodiar el relicario hasta que «una mano honesta»
            lo devolviera. Murió esperando.
          en: >-
            An epitaph tells how Ser Aldren swore to guard the reliquary until "an honest hand" returned it.
            He died waiting.
      ossuary_coins:
        skill: investigation
        tier: easy
        sets_flag: found_ossuary_coins
        gold: 25
        text:
          es: Entre los huesos, ofrendas olvidadas. Recoges veinticinco monedas antiguas.
          en: Among the bones, forgotten offerings. You gather twenty-five old coins.

  crypt_gallery:
    name: {es: "Cripta Hundida: galería inundada", en: "Sunken Crypt: flooded gallery"}
    kind: dungeon
    description:
      es: El agua negra te llega a las rodillas. Algo se mueve bajo la superficie, o quizá solo sea el eco.
      en: Black water rises to your knees. Something moves beneath the surface, or maybe it is only the echo.
    exits:
      - {to: crypt_hall, minutes: 3}
      - {to: crypt_sanctum, minutes: 2}
    fixed_encounters:
      - {monsters: [crypt_skeleton], flag: cleared_crypt_gallery}

  crypt_sanctum:
    name: {es: "Cripta Hundida: santuario", en: "Sunken Crypt: sanctum"}
    kind: dungeon
    description:
      es: >-
        Una lámpara de hierro cuelga sobre un sarcófago abierto. Junto a él, una figura con armadura
        se levanta despacio, como si hubiera estado esperándote.
      en: >-
        An iron chandelier hangs above an open sarcophagus. Beside it, an armored figure slowly rises,
        as if it had been waiting for you.
    exits:
      - {to: crypt_gallery, minutes: 2}
    fixed_encounters:
      - {monsters: [crypt_warden], flag: cleared_crypt_sanctum}
    scene_objects:
      iron_chandelier:
        name: {es: Lámpara de hierro, en: Iron chandelier}
        description: {es: Cuelga de una cadena oxidada justo sobre el sarcófago., en: It hangs from a rusty chain right above the sarcophagus.}
        skill: athletics
        tier: medium
        effect: {damage: 3d6, targets: one, status: {status: stunned, turns: 1}}
