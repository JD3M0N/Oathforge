  name: {es: Huérfano callejero, en: Urchin}
  description: {es: Los tejados y las alcantarillas de Crownreach fueron tu escuela y tu cama., en: The rooftops and sewers of Crownreach were your school and your bed.}
  skills: [sleight_of_hand, stealth]
  gold: 10
  items: {torch: 1}

entertainer:
  icon: "🎪"
  name: {es: Artista, en: Entertainer}
  description: {es: "Malabares, canciones y piruetas en las ferias: sabes ganarte a un público difícil.", en: "Juggling, songs and somersaults at fairs: you know how to win over a tough crowd."}
  skills: [acrobatics, persuasion]
  gold: 15
  items: {hunter_stew: 1}

folk_hero:
  icon: "🌾"
  name: {es: Héroe del pueblo, en: Folk hero}
  description: {es: Plantaste cara a un recaudador abusivo y tu aldea aún canta tu nombre., en: You stood up to a cruel tax collector and your village still sings your name.}
  skills: [insight, survival]
  gold: 10
  items: {sickle: 1}

