  name: {es: Forastero, en: Outlander}
  description: {es: Creciste lejos de los caminos; la ciudad te parece ruidosa y el bosque es tu casa., en: You grew up far from the roads; the city feels noisy and the forest is your home.}
  skills: [athletics, survival]
  gold: 10
  items: {skinning_knife: 1, raw_meat: 2}

sailor:
