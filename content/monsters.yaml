bandit:
  name: {es: Bandido, en: Bandit}
  indefinite: {es: un bandido, en: a bandit}
  icon: 🗡️
  description: {es: Un desertor con una espada mellada y pocas ganas de morir., en: A deserter with a notched sword and little wish to die.}
  hp: 7
  ac: 12
  dex: 1
  attacks:
    - {name: {es: Cimitarra, en: Scimitar}, to_hit: 2, damage: 1d4, damage_type: slashing}
  xp: 25
  gold: 2d6
  loot:
    - {item: dagger, chance: 0.2}
  cowardly: true
  habitat: {es: Camino del Viejo Rey, en: Old King's Road}
  lore:
    es: Desertores y campesinos arruinados que viven de asaltar caravanas. Huyen en cuanto el combate se tuerce.
    en: Deserters and ruined farmers who live off raiding caravans. They run as soon as a fight turns against them.

bandit_captain:
  name: {es: Capitán bandido, en: Bandit captain}
  indefinite: {es: un capitán bandido, en: a bandit captain}
  icon: 🎖️
  description: {es: Lleva las cicatrices de cien emboscadas y las botas de un noble., en: Wears the scars of a hundred ambushes and a nobleman's boots.}
  hp: 26
  ac: 14
  dex: 2
  wis: 0
  attacks:
    - {name: {es: Sable, en: Saber}, to_hit: 4, damage: 1d8+1, damage_type: slashing, applies: {status: bleeding, turns: 2, chance: 0.3}}
  xp: 200
  gold: 4d10
  loot:
    - {item: healing_potion, chance: 0.5}
  habitat: {es: Camino del Viejo Rey, en: Old King's Road}
  lore:
    es: Manda a los bandidos del camino. Sus golpes abren heridas que sangran durante varios turnos.
    en: Leads the road bandits. Their cuts open wounds that keep bleeding for several turns.

goblin_scout:
  name: {es: Goblin explorador, en: Goblin scout}
  indefinite: {es: un goblin explorador, en: a goblin scout}
  icon: 👺
  description: {es: "Pequeño, rápido y armado con un arco que robó a alguien más grande.", en: "Small, quick and armed with a bow it stole from someone bigger."}
  hp: 9
  ac: 13
  dex: 2
  row: back
  attacks:
    - {name: {es: Arco corto, en: Shortbow}, to_hit: 4, damage: 1d6+2, damage_type: piercing, ranged: true}
    - {name: {es: Cuchillo, en: Knife}, to_hit: 4, damage: 1d4+2, damage_type: piercing}
  xp: 50
  gold: 1d6
  loot:
    - {item: shortbow, chance: 0.1}
    - {item: torch, chance: 0.4}
  cowardly: true
  habitat: {es: Camino del Viejo Rey y Bosque de los Susurros, en: Old King's Road and Whispering Woods}
  lore:
    es: Dispara desde la retaguardia. Ataca primero a quien lo amenaza de cerca.
    en: Shoots from the back row. Strike it first if you can reach it.

grey_wolf:
  name: {es: Lobo gris, en: Grey wolf}
  indefinite: {es: un lobo gris, en: a grey wolf}
  icon: 🐺
  description: {es: "Hambriento y nunca solo por mucho tiempo.", en: "Hungry, and never alone for long."}
  hp: 13
  ac: 13
  dex: 2
  wis: 1
  attacks:
    - {name: {es: Mordisco, en: Bite}, to_hit: 4, damage: 2d4+2, damage_type: piercing, applies: {status: bleeding, turns: 2, chance: 0.25}}
  xp: 50
  skin_seconds: 20
  harvest:
    - {item: wolf_pelt, chance: 0.7}
    - {item: raw_meat, chance: 0.5}
  type: beast
  habitat: {es: Bosque de los Susurros y Arboleda Antigua, en: Whispering Woods and Elderwood Grove}
  lore:
    es: Caza en manada. Su mordisco puede dejar al objetivo sangrando.
    en: Hunts in packs. Its bite can leave its prey bleeding.

crypt_skeleton:
  name: {es: Esqueleto de la cripta, en: Crypt skeleton}
  indefinite: {es: un esqueleto de la cripta, en: a crypt skeleton}
  icon: 💀
  description: {es: Huesos unidos por una voluntad que no es la suya., en: Bones bound together by a will not their own.}
  hp: 7
  ac: 13
  dex: 2
  attacks:
    - {name: {es: Espada oxidada, en: Rusted sword}, to_hit: 2, damage: 1d4, damage_type: slashing}
  xp: 50
  gold: 1d4
  immune: [poisoned, frightened, bleeding]
  type: undead
  vulnerable: [bludgeoning, radiant]
  immune_damage: [poison]
  habitat: {es: Cripta Hundida, en: Sunken Crypt}
  lore:
    es: Soldados de Ser Aldren que siguen montando guardia. Las mazas y la luz sagrada los hacen pedazos.
    en: Ser Aldren's soldiers, still standing guard. Maces and holy light shatter them.

crypt_warden:
  name: {es: Guardián de la Cripta, en: Crypt Warden}
  indefinite: {es: el Guardián de la Cripta, en: the Crypt Warden}
  icon: 👻
  description:
    es: Un caballero muerto hace siglos, aún fiel a un juramento que nadie recuerda.
    en: A knight dead for centuries, still loyal to an oath no one remembers.
  hp: 40
  ac: 15
  dex: 0
  wis: 2
  attacks:
    - {name: {es: Espadón espectral, en: Spectral greatsword}, to_hit: 4, damage: 1d8+2, damage_type: necrotic, applies: {status: frightened, turns: 1, chance: 0.25}}
    - {name: {es: Lamento helado, en: Freezing wail}, to_hit: 4, damage: 2d4, damage_type: cold, ranged: true}
  xp: 700
  gold: 6d10
  loot:
    - {item: healing_potion, chance: 1.0, qty: 2}
  immune: [poisoned, frightened, bleeding]
  type: undead
  vulnerable: [radiant]
  resist: [necrotic, cold]
  immune_damage: [poison]
  habitat: {es: "Cripta Hundida: santuario", en: "Sunken Crypt: sanctum"}
  lore:
    es: >-
      Ser Aldren juró custodiar el relicario hasta que una mano honesta lo devolviera. Su espadón infunde
      miedo; la luz sagrada le hace mucho daño.
    en: >-
      Ser Aldren swore to guard the reliquary until an honest hand returned it. His greatsword instills
      fear; holy light hurts him badly.

boar:
  name: {es: Jabalí, en: Boar}
  indefinite: {es: un jabalí, en: a boar}
  icon: 🐗
  description: {es: Una bestia de cerdas negras y colmillos curvos que no retrocede., en: A black-bristled beast with curved tusks that never backs down.}
  hp: 7
  ac: 11
  dex: 0
  attacks:
    - {name: {es: Colmillo, en: Tusk}, to_hit: 2, damage: 1d4, damage_type: slashing}
  xp: 25
  loot:
    - {item: boar_tusk, chance: 0.6}
  skin_seconds: 15
  harvest:
    - {item: boar_hide, chance: 0.7}
    - {item: raw_meat, chance: 0.8, qty: 2}
  type: beast
  active: day
  habitat: {es: Prado de los Colmillos (de día y de noche), en: Tusk Meadow (day and night)}
  lore:
    es: Hoza en los campos al sur de Crownreach y embiste a quien se acerque. Sus colmillos se venden bien en el mercado.
    en: Roots through the fields south of Crownreach and charges anyone who comes close. Its tusks sell well at the market.

cave_bat:
  name: {es: Murciélago de cueva, en: Cave bat}
  indefinite: {es: un murciélago de cueva, en: a cave bat}
  icon: 🦇
  description: {es: Un murciélago del tamaño de un halcón que anida en las galerías y caza al anochecer., en: A hawk-sized bat that roosts in mine tunnels and hunts at dusk.}
  hp: 5
  ac: 12
  dex: 2
  wis: 1
  attacks:
    - {name: {es: Mordisco, en: Bite}, to_hit: 3, damage: 1d4, damage_type: piercing}
  xp: 15
  loot:
    - {item: bat_wing, chance: 0.5}
  type: beast
  active: any
  habitat: {es: Mina del Paso Viejo (siempre) y Prado de los Colmillos (de noche), en: Old Pass Mine (always) and Tusk Meadow (at night)}
  lore:
    es: Duerme a oscuras en la mina y, cuando cae el sol, sale por las grietas del prado. Débil por separado, peligroso en bandada.
    en: Sleeps in the dark of the mine and, when the sun sets, pours out of the meadow's cracks. Weak alone, dangerous in a swarm.

old_tusk:
  name: {es: El Viejo Colmillo, en: Old Tusk}
  indefinite: {es: "ese viejo jabalí, el Viejo Colmillo", en: "that old boar, Old Tusk"}
  icon: 🦣
  description: {es: Un jabalí enorme cubierto de cicatrices y puntas de flecha rotas., en: A huge boar covered in scars and broken arrowheads.}
  hp: 18
  ac: 11
  dex: 0
  wis: 1
  attacks:
    - {name: {es: Embestida, en: Gore}, to_hit: 3, damage: 1d8+1, damage_type: slashing, applies: {status: bleeding, turns: 2, chance: 0.3}}
  xp: 300
  gold: 3d10
  loot:
    - {item: boar_tusk, chance: 1.0, qty: 3}
    - {item: blueprint_tusk_dagger, chance: 1.0, qty: 1}
  skin_seconds: 40
  harvest:
    - {item: boar_hide, chance: 1.0, qty: 2}
    - {item: raw_meat, chance: 1.0, qty: 4}
  immune: [frightened]
  type: beast
  active: day
  habitat: {es: Prado de los Colmillos, en: Tusk Meadow}
  lore:
    es: El patriarca de los jabalíes del prado. Los cazadores llevan veinte años intentando abatirlo.
    en: The patriarch of the meadow boars. Hunters have been trying to bring it down for twenty years.

giant_rat:
  name: {es: Rata gigante, en: Giant rat}
  indefinite: {es: una rata gigante, en: a giant rat}
  icon: 🐀
  description: {es: "Una rata del tamaño de un perro, con los ojos rojos y el pelo apelmazado de hollín.", en: A dog-sized rat with red eyes and soot-matted fur.}
  hp: 7
  ac: 11
  dex: 1
  attacks:
    - {name: {es: Mordisco, en: Bite}, to_hit: 3, damage: 1d4+1, damage_type: piercing, applies: {status: poisoned, turns: 2, chance: 0.15}}
  xp: 15
  loot:
    - {item: coal, chance: 0.3}
  type: beast
  habitat: {es: Mina del Paso Viejo, en: Old Pass Mine}
  lore:
    es: Anida en las galerías abandonadas y roe todo lo que los mineros dejan atrás. Su mordisco puede infectarse.
    en: Nests in abandoned tunnels and gnaws whatever the miners leave behind. Its bite can fester.
