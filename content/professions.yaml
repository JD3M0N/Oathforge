# Oficios: cada personaje tiene dos activos. Cada oficio se aprende y se cambia con su maestro, en su puesto
# del Barrio de Oficios (Location.teaches); la estación de cada uno está en ese mismo puesto.
# Una afición (hobby: true) no ocupa plaza: cualquiera la practica y la sube si quiere.
# Cada uno trabaja en una estación (Location.stations). Diseño en planning/opificia.md.
# guide: la mini guía de /prof_<clave>.

blacksmithing:
  name: {es: Herrería, en: Blacksmithing}
  icon: "⚒️"
  techniques:
    weapons: {name: {es: Forja de armas, en: Weaponsmithing}, rank: 1}
  station: anvil
  description:
    es: Forja armas, armaduras, herramientas y herrajes en el yunque, con los lingotes que salen del horno.
    en: Forges weapons, armor, tools and fittings at the anvil, from the ingots that come out of the furnace.
  guide:
    es: >-
      Mina hierro y carbón en la Mina del Paso Viejo (⛏️ Minería) y funde los lingotes en el horno del Gremio de
      Aventureros: fundir es cosa de la Minería, da XP de Minería y no hace falta ser herrero. Con los lingotes, en
      el yunque de la Forja de Tessa, forjas a rango 1 una espada (más un tablón). Tus lingotes también los piden
      la peletería, la joyería y la ingeniería.
    en: >-
      Mine iron and coal at Ironvein Mine (⛏️ Mining) and smelt the ingots at the Adventurers Guild furnace:
      smelting belongs to Mining, pays Mining XP and needs no smith. With the ingots, at the anvil of Tessas forge,
      you forge a sword at rank 1 (plus a plank). Leatherworking, jewelcrafting and engineering want your ingots
      too.

alchemy:
  name: {es: Alquimia, en: Alchemy}
  icon: "⚗️"
  techniques:
    potions: {name: {es: Pociones, en: Potions}, rank: 0}
    draughts: {name: {es: Tónicos, en: Draughts}, rank: 3}
  station: alchemy_table
  description:
    es: Destila hierbas en pociones. La raíz de sangre del bosque es su base.
    en: Distils herbs into potions. Bloodroot from the woods is its base.
  guide:
    es: >-
      Recoge raíz de sangre, hoja de luna y musgo del reposo (🌿 Herboristería) y compra frascos de agua a Mira.
      Pociones de curación desde el principio, de maná a rango 1 y el tónico del reposo a rango 3.
    en: >-
      Gather bloodroot, moonleaf and restmoss (🌿 Herbalism) and buy water flasks from Mira. Healing potions
      from the start, mana potions at rank 1 and the rest draught at rank 3.

carpentry:
  name: {es: Carpintería, en: Carpentry}
  icon: "🪚"
  techniques:
    woodwork: {name: {es: Torneado, en: Woodturning}, rank: 1}
  station: carpenter_bench
  description:
    es: "Trabaja la madera ya aserrada: bastones, mangos, cañas y piezas para otros oficios."
    en: "Works wood already sawn: staves, handles, rods and parts for other crafts."
  guide:
    es: >-
      Tala robles en la Arboleda Antigua (🪓 Tala) y asiérralos en el puesto de aserrado del Gremio de Aventureros:
      aserrar es cosa de la Tala y da XP de Tala. Con los tablones, en tu banco, haces a rango 1 bastones para
      magos. Los tablones los necesita también la herrería para sus espadas.
    en: >-
      Fell oaks at the Elderwood Grove (🪓 Woodcutting) and saw them at the Adventurers Guild sawing station:
      sawing belongs to Woodcutting and pays Woodcutting XP. With the planks, at your bench, you make staves for
      mages at rank 1. Blacksmiths need planks for their swords too.

leatherworking:
  name: {es: Peletería, en: Leatherworking}
  icon: "🧵"
  techniques:
    armour: {name: {es: Armaduras ligeras, en: Light armour}, rank: 1}
  station: tannery
  description:
    es: Cose armaduras ligeras, correas y fundas con el cuero del secadero. Vive de lo que traen los cazadores.
    en: Stitches light armour, straps and cases from the leather off the curing rack. Lives on what hunters bring.
  guide:
    es: >-
      Caza jabalíes y lobos con un cuchillo de desollar (🔪 Desuello) y cura sus pieles en el secadero del Gremio
      de Aventureros: curtir es cosa del Desuello y da XP de Desuello. Con el cuero, en la curtiduría, a rango 1 el
      cuero reforzado (con un lingote) da 1 punto más de CA que el de la tienda.
    en: >-
      Hunt boars and wolves with a skinning knife (🔪 Skinning) and cure their hides at the Adventurers Guild
      curing rack: curing belongs to Skinning and pays Skinning XP. With the leather, at the tannery, reinforced
      leather at rank 1 (plus an ingot) gives 1 more AC than the shops.

jewelcrafting:
  name: {es: Joyería, en: Jewelcrafting}
  icon: "💍"
  techniques:
    rings: {name: {es: Anillería, en: Ringwork}, rank: 0}
    gemwork: {name: {es: Engaste de gemas, en: Gem setting}, rank: 2}
  station: jeweler_bench
  description:
    es: Anillos de cobre y engastes de gemas que valen mucho en el mercado.
    en: Copper rings and gem settings that fetch a good price at the market.
  guide:
    es: >-
      Necesitas Minería de rango 1 para el cobre y de rango 3 para las gemas. Los anillos se venden bien: es el
      oficio para hacer oro.
    en: >-
      You need Mining rank 1 for copper and rank 3 for gems. Rings sell well: it is the profession for making gold.

scribing:
  name: {es: Escribanía, en: Scribing}
  icon: "📜"
  techniques:
    inks: {name: {es: Tintas y pergaminos, en: Inks and parchment}, rank: 0}
    scrolls: {name: {es: Pergaminos menores, en: Lesser scrolls}, rank: 0}
    greater_scrolls: {name: {es: Pergaminos mayores, en: Greater scrolls}, rank: 2}
  station: scribe_desk
  description:
    es: Tinta de hierbas y pergamino de piel para escribir pergaminos de un solo uso que cualquiera puede leer en combate.
    en: Herb ink and hide parchment to write single-use scrolls anyone can read in combat.
  guide:
    es: >-
      La tinta sale de raíz de sangre y carbón (🌿 Herboristería, ⛏️ Minería) y el pergamino, de cuero de jabalí
      (🔪 Desuello). Con los dos escribes pergaminos: Dardo de fuego desde el principio, Curar heridas y Égida a
      rango 1, Sueño a rango 2. En combate, «🎒 Objetos» los lanza aunque tu clase no sepa magia.
    en: >-
      Ink comes from bloodroot and coal (🌿 Herbalism, ⛏️ Mining) and parchment from boar hide (🔪 Skinning). With
      both you write scrolls: Fire Bolt from the start, Cure Wounds and Aegis at rank 1, Sleep at rank 2. In combat,
      "🎒 Items" casts them even if your class knows no magic.

engineering:
  name: {es: Ingeniería, en: Engineering}
  icon: "💣"
  techniques:
    powder: {name: {es: Pólvora y mechas, en: Powder and fuses}, rank: 0}
    bombs: {name: {es: Bombas, en: Bombs}, rank: 0}
    devices: {name: {es: Artificios, en: Devices}, rank: 2}
  station: workbench
  description:
    es: Pólvora de carbón y hierro, mechas de fibra y bombas para lanzar en combate.
    en: Powder from coal and iron, fibre fuses and bombs to throw in combat.
  guide:
    es: >-
      La pólvora sale de carbón y mena de hierro (⛏️ Minería) y la mecha, de fibra vegetal (🌿 Herboristería,
      🪓 Tala). Bomba de humo desde el principio (huyes sin tirada), bomba de fuego a rango 1 (quema una fila
      entera) y bomba cegadora a rango 2 (aturde). En combate, desde «🎒 Objetos».
    en: >-
      Powder comes from coal and iron ore (⛏️ Mining) and fuses from plant fibre (🌿 Herbalism, 🪓 Woodcutting).
      Smoke bomb from the start (escape without a roll), fire bomb at rank 1 (burns a whole row) and flash bomb at
      rank 2 (stuns). In combat, from "🎒 Items".

tailoring:
  name: {es: Sastrería, en: Tailoring}
  icon: "🪡"
  techniques:
    spinning: {name: {es: Hilado y tejido, en: Spinning and weaving}, rank: 0}
    garments: {name: {es: Prendas, en: Garments}, rank: 1}
    cordage: {name: {es: Cordelería, en: Cordage}, rank: 2}
  station: loom
  description:
    es: Hila y teje la fibra limpia en hilo, tela y prendas; también hace el sedal de las cañas.
    en: Spins and weaves clean fiber into thread, cloth and garments; it also makes the line for fishing rods.
  guide:
    es: >-
      Recoge fibra vegetal (🌿 Herboristería) y límpiala en la mesa del Gremio de Aventureros. En el telar hilas
      la fibra limpia y tejes la tela; con ella haces a rango 1 un jubón acolchado y, a rango 2, el sedal que la
      carpintería necesita para sus cañas. La tela también sirve para la cama de tu habitación.
    en: >-
      Gather plant fiber (🌿 Herbalism) and clean it at the Adventurers Guild table. At the loom you spin clean
      fiber into thread and weave it into cloth; with it you make a padded jerkin at rank 1 and, at rank 2, the
      line carpentry needs for its rods. Cloth is also what the bed in your room is made of.

fishing:
  name: {es: Pesca, en: Fishing}
  icon: "🎣"
  practice: fishing
  hobby: true
  description:
    es: Afición libre. Pescar en la ribera con caña; los peces van a la cocina.
    en: A free hobby. Fishing at the riverbank with a rod; the fish go to the kitchen.
  guide:
    es: >-
      No ocupa plaza de oficio ni tiene recetas: sube pescando. En la Ribera de Silverbrook, con una caña de
      pescar, pulsa «🎣 Pescar» ({gather_min} min) o haz una expedición larga. A rango 3 aparecen truchas de escama
      plateada, que la 🍲 Cocina convierte en raciones mejores.
    en: >-
      It takes no profession slot and has no recipes: it grows by fishing. At Silverbrook Bank, with a fishing rod,
      press "🎣 Fish" ({gather_min} min) or go on a long expedition. At rank 3 come silverscale trout, which 🍲
      Cooking turns into better rations.

cooking:
  name: {es: Cocina, en: Cooking}
  icon: "🍲"
  techniques:
    stews: {name: {es: Guisos, en: Stews}, rank: 0}
    rations: {name: {es: Raciones, en: Rations}, rank: 1}
  station: hearth
  hobby: true
  description:
    es: Afición libre. Guisos y raciones que reponen fuerzas fuera del combate. El fogón está en La Corona Rota.
    en: A free hobby. Stews and rations that restore strength outside combat. The hearth is at The Broken Crown.
  guide:
    es: >-
      No ocupa plaza de oficio: cualquiera puede cocinar. Carne de caza (🔪 Desuello) o peces de la ribera
      (🎣 Pesca) con raíz de sangre, en el fogón de La Corona Rota.
    en: >-
      It takes no profession slot: anyone can cook. Game meat (🔪 Skinning) or river fish (🎣 Fishing) with
      bloodroot, at the hearth of The Broken Crown.
