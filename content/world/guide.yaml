summary:
  es: >-
    Aetherfall es un mundo de fantasía oscura de juramentos, magia, caminos peligrosos, ciudades amuralladas,
    gremios, artesanos y ruinas de reinos anteriores.
  en: >-
    Aetherfall is a dark-fantasy world of oaths, magic, dangerous roads, walled cities, guilds, artisans,
    and the ruins of earlier kingdoms.
setting:
  es: >-
    Los héroes comienzan en Crownreach, en Terra Coronata. En torno a la ciudad hay bosques, minas, caminos,
    santuarios y ruinas; otros lugares de Aetherfall pueden formar parte del pasado de un personaje sin volverlos
    hechos públicos ni alterar el estado actual del mundo.
  en: >-
    Heroes begin in Crownreach, in Terra Coronata. Around the city lie forests, mines, roads, shrines, and ruins;
    other places in Aetherfall may be part of a character's past without making them public facts or changing the
    world's current state.
society:
  es: >-
    Mercaderes, campesinos, soldados, delincuentes, nobles, clérigos, artistas y trabajadores de toda clase forman
    su sociedad. Los oficios adultos, incluido el trabajo sexual, pueden aparecer sin detalles explícitos.
  en: >-
    Merchants, farmers, soldiers, criminals, nobles, clerics, artists, and workers of every kind make up its
    society. Adult livelihoods, including sex work, may appear without explicit detail.
technology:
  es: >-
    La artesanía, la alquimia y la ingeniería incluyen forjas, telares, escribanía, mecanismos, pólvora y bombas.
    No existen internet, redes sociales, teléfonos, plataformas digitales ni corporaciones modernas.
  en: >-
    Craft, alchemy, and engineering include forges, looms, scribing, mechanisms, gunpowder, and bombs. There is no
    internet, social media, telephone, digital platform, or modern corporation.
magic:
  es: >-
    La magia, los conjuros, las criaturas sobrenaturales, los objetos encantados y los juramentos con poder forman
    parte del mundo, pero un trasfondo no concede poderes, objetos ni privilegios de juego.
  en: >-
    Magic, spells, supernatural creatures, enchanted objects, and empowered oaths are part of the world, but a
    background grants no powers, items, or gameplay privileges.
backgrounds:
  es: >-
    Un trasfondo puede crear recuerdos, personas y lugares menores de la vida del héroe. No puede declarar hechos
    canónicos sobre el mundo, controlar personajes existentes ni fijar oro, equipo, nivel, reputación o resultados.
  en: >-
    A background may create memories and minor people or places from the hero's life. It cannot declare canonical
    world facts, control existing characters, or set gold, equipment, level, reputation, or outcomes.
