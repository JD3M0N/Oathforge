name: {es: Bosque de los Susurros, en: Whispering Woods}
article: {es: el, en: the}
kind: wild
description:
  es: >-
    La lluvia golpea las hojas de los robles de Thornwood. Entre los troncos, el viento parece
    pronunciar nombres.
  en: >-
    Rain beats on the leaves of the Thornwood oaks. Between the trunks, the wind seems to speak names.
exits:
  - {to: old_kings_road, minutes: 40, danger: 2}
  - {to: elderwood_grove, minutes: 20, danger: 1}
  - {to: redroot_clearing, minutes: 15, danger: 1}
encounters:
  - {monsters: [boar], weight: 2}  # the tutorial gathers bloodroot here at level 2-3: only weak prey before level 3
  - {monsters: [goblin_scout], weight: 1}
  - {monsters: [grey_wolf], weight: 3, min_level: 3}
  - {monsters: [grey_wolf, grey_wolf], weight: 2, min_level: 4}
  - {monsters: [goblin_scout, bandit], weight: 1, min_level: 3}
gathering:
  - skill: herbalism
    tool: sickle
    stay_ambush: 0.15
    resources:
      - {item: bloodroot, weight: 40}
      - {item: plant_fiber, weight: 40}
scene_objects:
  hornet_nest:
    name: {es: Avispero, en: Hornet nest}
    description: {es: Un enorme avispero cuelga de una rama baja., en: A huge hornet nest hangs from a low branch.}
    skill: athletics
    tier: easy
    effect: {damage: 1d4, damage_type: poison, targets: all_enemies, status: {status: poisoned, turns: 2}}
discoveries:
  healing_herbs:
    skill: medicine
    tier: easy
    sets_flag: found_healing_herbs
    gives: {healing_potion: 1}
    text:
      es: Reconoces raíz de sangre entre los helechos y preparas un ungüento curativo.
      en: You spot bloodroot among the ferns and prepare a healing salve.
