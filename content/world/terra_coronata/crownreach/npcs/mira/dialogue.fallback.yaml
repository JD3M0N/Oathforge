- es: Mira te observa. «El silencio también tiene valor.»
  en: Mira watches you. "Silence has value too."
- es: «No tengo nada que añadir, {name}», dice Mira, sin alzar la voz.
  en: '"I have nothing to add, {name}," Mira says without raising her voice.'
- es: Mira entrelaza los dedos. «Hablemos poco.»
  en: Mira interlaces her fingers. "Let us speak little."
- es: «Una pregunta no obliga a una respuesta», señala Mira.
  en: '"A question does not compel an answer," Mira points out.'
- es: Mira deja que el silencio se estire. «Con eso basta por ahora.»
  en: Mira lets the silence stretch. "That is enough for now."
- es: «Las palabras gastadas no vuelven», dice Mira. «Prefiero medirlas.»
  en: '"Spent words never return," Mira says. "I prefer to measure them."'
- es: Mira inclina apenas la cabeza. «No voy a especular.»
  en: Mira barely inclines her head. "I will not speculate."
- es: «No confundas reserva con descortesía», murmura Mira.
  en: '"Do not mistake reserve for discourtesy," Mira murmurs.'
- es: Mira te escucha sin comprometerse. «Lo dejaré sin comentario.»
  en: Mira listens without committing herself. "I will leave that without comment."
- es: «No todas las conversaciones abren puertas», dice Mira.
  en: '"Not every conversation opens doors," Mira says.'
- es: Mira baja la mirada un instante. «No tengo una respuesta para ti.»
  en: Mira lowers her gaze for a moment. "I have no answer for you."
- es: «A veces lo prudente es detener la charla», responde Mira.
  en: '"Sometimes prudence means stopping the conversation," Mira replies.'
