- es: Holt te escucha con gesto severo. «Sin más comentarios.»
  en: Holt listens with a stern expression. "No further comment."
- es: «No hablaré sin certeza», dice Holt. «Eso también es disciplina.»
  en: '"I will not speak without certainty," Holt says. "That too is discipline."'
- es: Holt endereza la espalda. «Seamos breves.»
  en: Holt straightens his back. "Let us be brief."
- es: «No tengo una respuesta que darte, {name}», declara Holt.
  en: '"I have no answer to give you, {name}," Holt states.'
- es: Holt aprieta los labios. «No voy a llenar ese vacío con suposiciones.»
  en: Holt presses his lips together. "I will not fill that gap with assumptions."
- es: «Un juramento pesa más que una charla», dice Holt.
  en: '"An oath carries more weight than talk," Holt says.'
- es: Holt asiente una vez. «No añadiré nada por ahora.»
  en: Holt nods once. "I will add nothing for now."
- es: «La prudencia exige medir las palabras», responde Holt.
  en: '"Prudence requires measured words," Holt replies.'
- es: Holt mantiene un tono formal. «Dejemos esta conversación aquí.»
  en: Holt keeps his tone formal. "Let us leave this conversation here."
- es: «No soy hombre de discursos», te dice Holt.
  en: '"I am not a man for speeches," Holt tells you.'
- es: Holt te mira de frente. «Prefiero el silencio a una afirmación sin fundamento.»
  en: Holt looks you in the eye. "I prefer silence to an unfounded assertion."
- es: «Por ahora, eso es todo», concluye Holt con sobriedad.
  en: '"For now, that is all," Holt concludes soberly.'
