- es: Oda se ríe. «Mira que venir a la curtiduría a hablar de eso.»
  en: Oda laughs. "Imagine coming to a tannery to talk about that."
- es: «Ni idea, y no voy a inventármelo», dice Oda.
  en: '"No idea, and I am not going to invent one," Oda says.'
- es: Oda hunde una piel en la cuba antes de contestar, y ya no contesta.
  en: Oda sinks a hide into the vat before answering, and then does not answer.
- es: «Tráeme algo con pellejo y hablamos, {name}», responde Oda.
  en: '"Bring me something with a hide and we will talk, {name}," Oda replies.'
- es: Oda se limpia las manos en un trapo que no mejora nada.
  en: Oda wipes her hands on a rag that improves nothing.
- es: «De eso hay quien sabe más y cobra menos», dice Oda.
  en: '"There are people who know more about that and charge less," Oda says.'
- es: Oda tensa una correa entre las manos. «Hoy no me da la cabeza.»
  en: Oda pulls a strap taut between her hands. "My head is not up to it today."
- es: «No te voy a marear con suposiciones», dice Oda.
  en: '"I will not dizzy you with guesses," Oda says.'
- es: Oda mira el bastidor, luego a ti. «Otra cosa será.»
  en: Oda looks at the frame, then at you. "Some other matter, then."
- es: «Pregúntale a Tessa, que esa habla por las dos», dice Oda.
  en: '"Ask Tessa, she talks enough for both of us," Oda says.'
- es: Oda resopla. «Respira por la boca y cambiemos de tema.»
  en: Oda snorts. "Breathe through your mouth and let us change the subject."
- es: «Poco que decir, mucho que curtir», zanja Oda.
  en: '"Little to say, plenty to tan," Oda concludes.'
