- es: Lorent levanta la pluma para que no gotee. «No tengo línea para eso.»
  en: Lorent lifts the quill so it does not drip. "I have no line for that."
- es: «Lo consultaría, pero el archivo está húmedo», dice Lorent.
  en: '"I would check, but the archive is damp," Lorent says.'
- es: Lorent sopla sobre la tinta fresca y no dice más.
  en: Lorent blows on the fresh ink and says no more.
- es: «Sin fuente no escribo, {name}, y sin fuente no hablo», responde Lorent.
  en: '"Without a source I do not write, {name}, and without a source I do not speak," Lorent replies.'
- es: Lorent alinea dos pergaminos que ya estaban alineados.
  en: Lorent aligns two parchments that were already aligned.
- es: «Una frase mal puesta cuesta un pergamino entero», dice Lorent.
  en: '"A badly placed sentence costs a whole parchment," Lorent says.'
- es: Lorent niega con la cabeza, muy pulcramente.
  en: Lorent shakes his head, very neatly.
- es: «Preferiría no dictar lo que no sé», dice Lorent.
  en: '"I would rather not dictate what I do not know," Lorent says.'
- es: Lorent mira la cuerda donde se secan los pergaminos. «Hoy voy tarde.»
  en: Lorent glances at the line where the parchments dry. "I am behind today."
- es: «Eso no está copiado en ninguna parte», dice Lorent.
  en: '"That is not copied anywhere," Lorent says.'
- es: Lorent cambia de pluma como quien cambia de tema.
  en: Lorent changes quills the way other people change the subject.
- es: «Con la prisa cobro más y sé lo mismo», dice Lorent.
  en: '"In a hurry I charge more and know the same," Lorent says.'
