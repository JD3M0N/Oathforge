- es: Hedda no suelta la lanzadera. «De eso no sé nada.»
  en: Hedda does not let go of the shuttle. "I know nothing about that."
- es: «Pregúntame de telas y te hablo una hora», dice Hedda.
  en: '"Ask me about cloth and I will talk for an hour," Hedda says.'
- es: Hedda cuenta hilos con el dedo y pierde el hilo de la conversación.
  en: Hedda counts threads with a finger and loses the thread of the conversation.
- es: «Tú no has venido a eso, {name}», responde Hedda sin levantar la vista.
  en: '"That is not what you came for, {name}," Hedda replies without looking up.'
- es: Hedda alisa un retal con la mano y lo dobla muy despacio.
  en: Hedda smooths a piece of cloth with her hand and folds it very slowly.
- es: «Lo que se dice sin pensar se descose igual que lo que se cose sin medir», dice Hedda.
  en: '"What is said without thinking comes apart like what is sewn without measuring," Hedda says.'
- es: Hedda niega con la cabeza y se quita un alfiler del cuello.
  en: Hedda shakes her head and takes a pin from her collar.
- es: «Prefiero callar antes que decir algo mal hilado», dice Hedda.
  en: '"I would rather be quiet than say something badly spun," Hedda says.'
- es: Hedda mira el telar. «Primero acabo la pasada.»
  en: Hedda looks at the loom. "I will finish this pass first."
- es: «Trae fibra limpia y hablamos de lo que quieras», dice Hedda.
  en: '"Bring clean fiber and we can talk about whatever you like," Hedda says.'
- es: Hedda señala tu capa descosida y cambia de tema con elegancia.
  en: Hedda points at your unstitched cloak and changes the subject gracefully.
- es: «Nada que contarte hoy, {name}. Tengo urdimbre montada», dice Hedda.
  en: '"Nothing to tell you today, {name}. I have a warp set up," Hedda says.'
