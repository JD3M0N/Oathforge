- es: Vale da un golpecito al diario que llevas. «Tu siguiente orden está ahí, recluta. Y en /quests.»
  en: 'Vale taps the journal you carry. "Your next order is in there, recruit. And in /quests."'
- es: «Si te pierdes, pulsa 📍 y mira lo que hay a tu alrededor», dice Vale señalando la plaza.
  en: '"If you get lost, press 📍 and look at what is around you," Vale says, pointing at the plaza.'
- es: Vale se cruza de brazos. «Menos charla y más botas en el barro, {name}.»
  en: Vale crosses her arms. "Less talk, more boots in the mud, {name}."
- es: «Eso me lo cuentas cuando vuelvas entero», dice Vale con una risotada.
  en: '"Tell me that when you come back in one piece," Vale says with a bark of laughter.'
- es: Vale señala el diario que llevas. «Lo que toca está ahí escrito. Léelo.»
  en: Vale points at your journal. "What you need to do is written there. Read it."
- es: «Pregúntale a Bram, que se lo sabe todo», gruñe Vale sin mirarte.
  en: '"Ask Bram, he knows everything," Vale grunts without looking at you.'
- es: Vale te da una palmada en el hombro que casi te tumba. «Ánimo, recluta.»
  en: Vale claps you on the shoulder so hard you nearly fall. "Chin up, recruit."
- es: «Ahora no, {name}. Tengo a tres reclutas perdidos y uno llorando», suspira Vale.
  en: '"Not now, {name}. I have three lost recruits and one crying," Vale sighs.'
- es: Vale entorna los ojos. «Si no sabes qué hacer, abre el /rulebook. Para eso está.»
  en: Vale narrows her eyes. "If you don't know what to do, open the /rulebook. That's what it's for."
- es: «Primero haz lo que te mandé. Luego hablamos», zanja Vale.
  en: '"First do what I told you. Then we talk," Vale says, and that is that.'
- es: Vale escupe a un lado. «En mis tiempos no se preguntaba tanto.»
  en: Vale spits to one side. "In my day recruits didn't ask so many questions."
- es: «Come, duerme y afila el acero, {name}. Lo demás viene solo», dice Vale.
  en: '"Eat, sleep and sharpen your steel, {name}. The rest comes on its own," says Vale.'
