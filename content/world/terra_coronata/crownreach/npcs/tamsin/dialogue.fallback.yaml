- es: Tamsin da un golpecito al farol de latón. «Mira primero, corre después. Lo que toca está en tu diario, recluta.»
  en: Tamsin taps her brass lantern. "Look first, run later. What you need to do is in your journal, recruit."
- es: «Los carros no dejan huellas así si van vacíos», murmura Tamsin sobre el mapa. «Fíjate en los detalles pequeños, {name}.»
  en: '"Carts do not leave tracks like that when they are empty," Tamsin murmurs over the map. "Mind the small details, {name}."'
- es: Tamsin sonríe de lado. «Te lo cuento cuando vuelvas entero. Esa es mi norma, no del gremio.»
  en: Tamsin smiles crookedly. "I will tell you when you come back in one piece. That is my rule, not the guild's."
- es: «Un respiro a tiempo vale más que una poción», dice Tamsin sin levantar la vista del mapa.
  en: '"A breather at the right time is worth more than a potion," Tamsin says without looking up from the map.'
- es: Tamsin ajusta el farol. «Ve con humo en la mochila y sin prisa por ser un héroe, {name}.»
  en: Tamsin adjusts her lantern. "Go with smoke in your pack and no hurry to be a hero, {name}."
- es: Tamsin despliega un mapa viejo con el pulgar. «Aquí. Y aquí. Lo demás es cuestión de paciencia.»
  en: Tamsin unrolls an old map with her thumb. "Here. And here. The rest is a matter of patience."
- es: «No me des las gracias por adelantado, recluta», dice Tamsin. «Dámelas cuando volvamos los dos.»
  en: '"Do not thank me in advance, recruit," Tamsin says. "Thank me when we both come back."'
- es: Tamsin se queda mirando la llama del farol. «Hubo un tiempo en que yo también tenía prisa.»
  en: Tamsin watches the flame of her lantern. "There was a time when I was in a hurry too."
- es: «Pregunta a Vale por el libro del gremio, {name}. Ella sabe contar; yo solo sé leer caminos.»
  en: '"Ask Vale about the guild''s ledger, {name}. She can count; I can only read roads."'
- es: Tamsin se encoge de hombros. «Las órdenes se pueden falsificar. Las huellas, casi nunca.»
  en: Tamsin shrugs. "Orders can be forged. Tracks almost never."
- es: «Si dudas, retírate. Volver también es vencer», dice Tamsin con media sonrisa.
  en: '"If in doubt, withdraw. Coming back is winning too," Tamsin says with half a smile.'
- es: Tamsin te acerca una taza de algo caliente. «Bebe. Se piensa mejor con el estómago lleno.»
  en: Tamsin pushes a cup of something hot towards you. "Drink. One thinks better with a full stomach."
