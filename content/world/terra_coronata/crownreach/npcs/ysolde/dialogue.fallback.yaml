- es: Ysolde junta las manos. «No siempre hay palabras, {name}.»
  en: Ysolde folds her hands. "There are not always words, {name}."
- es: «El silencio también puede ser amable», te dice Ysolde.
  en: '"Silence can be kind too," Ysolde tells you.'
- es: Ysolde inclina la cabeza. «No quisiera darte una respuesta vacía.»
  en: Ysolde inclines her head. "I would not want to give you an empty answer."
- es: «Dejemos reposar la conversación», sugiere Ysolde con suavidad.
  en: '"Let the conversation rest," Ysolde suggests softly.'
- es: Ysolde te escucha en silencio. «No tengo nada certero que añadir.»
  en: Ysolde listens in silence. "I have nothing certain to add."
- es: «La paciencia no necesita un sermón», dice Ysolde con humor seco.
  en: '"Patience does not need a sermon," Ysolde says with dry humour.'
- es: Ysolde esboza una sonrisa cansada. «Hasta los consejos necesitan descanso.»
  en: Ysolde offers a tired smile. "Even advice needs rest."
- es: «Prefiero admitir que no sé qué decir», responde Ysolde.
  en: '"I would rather admit I do not know what to say," Ysolde replies.'
- es: Ysolde baja la voz. «No voy a cubrir la incertidumbre con palabras solemnes.»
  en: Ysolde lowers her voice. "I will not cover uncertainty with solemn words."
- es: «Por ahora, dejémoslo ahí», dice Ysolde sin dureza.
  en: '"For now, let us leave it there," Ysolde says without harshness.'
- es: Ysolde hace una pausa. «Una respuesta apresurada rara vez consuela.»
  en: Ysolde pauses. "A hurried answer seldom comforts."
- es: «No hace falta hablar para respetar una pausa, {name}», murmura Ysolde.
  en: '"We need not speak to respect a pause, {name}," Ysolde murmurs.'
