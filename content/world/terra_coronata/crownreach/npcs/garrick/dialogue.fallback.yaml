- es: Garrick pasa la mano por una tabla. «No sabría decirte.»
  en: Garrick runs a hand over a board. "I couldn't tell you."
- es: «Mido dos veces antes de hablar, y aún no he medido», dice Garrick.
  en: '"I measure twice before speaking, and I have not measured yet," Garrick says.'
- es: Garrick se encoge de hombros sin soltar el formón.
  en: Garrick shrugs without letting go of the chisel.
- es: «De eso hablan otros mejor que yo, {name}», responde Garrick.
  en: '"Others speak of that better than I do, {name}," Garrick replies.'
- es: Garrick sopla el serrín del banco. «Déjame con la madera, que la entiendo.»
  en: Garrick blows sawdust off the bench. "Leave me the wood, I understand that."
- es: «Poca cosa puedo añadir», dice Garrick, y vuelve a la mordaza.
  en: '"Little I can add," Garrick says, and goes back to the vice.'
- es: Garrick tarda en contestar y, cuando lo hace, solo niega con la cabeza.
  en: Garrick takes his time answering and, when he does, only shakes his head.
- es: «Si no sé una cosa, no la relleno con palabras», dice Garrick.
  en: '"If I do not know a thing, I do not pad it with words," Garrick says.'
- es: Garrick golpea dos veces una pieza para comprobarla. «Otra vez será.»
  en: Garrick taps a piece twice to test it. "Another time."
- es: «Pregunta en el gremio, allí apuntan todo», sugiere Garrick.
  en: '"Ask at the guild, they write everything down," Garrick suggests.'
- es: Garrick señala la puerta con el mentón. «Vuelve cuando cierre el taller.»
  en: Garrick nods toward the door. "Come back when I close the workshop."
- es: «Hoy hablo poco, {name}. Tengo un encargo tarde», dice Garrick.
  en: '"I am short of words today, {name}. I have a late order," Garrick says.'
