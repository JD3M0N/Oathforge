- es: Tessa ladea la cabeza. «La charla también tiene que enfriarse a veces.»
  en: Tessa tilts her head. "Talk needs to cool sometimes too."
- es: «No tengo respuesta, {name}. Y no voy a martillar una a la fuerza», dice Tessa.
  en: '"I have no answer, {name}. And I will not hammer one into shape by force," Tessa says.'
- es: Tessa ríe por lo bajo. «Hasta yo puedo quedarme sin palabras.»
  en: Tessa chuckles. "Even I can run out of words."
- es: «No voy a venderte palabrería como si fuera buen acero», dice Tessa.
  en: '"I will not sell you chatter as though it were good steel," Tessa says.'
- es: Tessa se cruza de brazos. «Dejemos descansar esa conversación.»
  en: Tessa folds her arms. "Let that conversation rest."
- es: «Una respuesta mal templada se rompe enseguida», comenta Tessa.
  en: '"A poorly tempered answer breaks at once," Tessa remarks.'
- es: Tessa te escucha con una media sonrisa. «No tengo mucho que añadir.»
  en: Tessa listens with a half smile. "I have little to add."
- es: «Para alargar esto sin sentido, mejor callarse», dice Tessa con franqueza.
  en: '"Better to be quiet than drag this out for nothing," Tessa says frankly.'
- es: Tessa se encoge de hombros. «Con eso no sé ayudarte de palabra.»
  en: Tessa shrugs. "I do not know how to help you with words on that."
- es: «No todo se arregla hablando», te dice Tessa. «Aunque ganas no falten.»
  en: '"Not everything can be fixed by talking," Tessa tells you. "Even when we would like to."'
- es: Tessa deja escapar una risa breve. «Mi lengua pide una pausa.»
  en: Tessa lets out a brief laugh. "My tongue wants a pause."
- es: «Mejor una pausa honrada que una respuesta torcida», concluye Tessa.
  en: '"Better an honest pause than a crooked answer," Tessa concludes.'
