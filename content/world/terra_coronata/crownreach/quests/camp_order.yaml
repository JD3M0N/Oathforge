name: {es: "Una entrega sospechosa", en: "A Suspicious Delivery"}
summary:
  es: "Vale te enseña una orden del gremio que no cuadra con su libro. Hay una exploradora que quiere hablar con alguien nuevo."
  en: "Vale shows you a guild order that does not match her ledger. A scout wants to talk to someone new."
hint:
  es: "Habla con Tamsin Harrow en el Gremio de Aventureros (de noche, en la taberna). Luego sal al Camino del Viejo Rey y derrota a dos bandidos: «🏹 Cazar» o lo que salga al viajar."
  en: "Talk to Tamsin Harrow at the Adventurers' Guild (at night, in the tavern). Then go out on the Old King's Road and beat two bandits: \"🏹 Hunt\" or whatever turns up on the way."
start_stage: locked
unlock_stage: active
objective_stage: active
