summary:
  es: «Nadie sale de la ciudad sin pociones», dice Vale. Quiere que conozcas a quienes las venden.
  en: "\"Nobody leaves the city without potions,\" says Vale. She wants you to meet the people who sell them."
hint:
  es: Habla con Mira en el Mercado de Crownreach y con Tessa en su forja, el primer puesto del Barrio de Oficios («💬 Hablar»). Con «🛒 Comerciar» ves sus tiendas.
  en: Talk to Mira at Crownreach Market and to Tessa at her forge, the first stall on Craftsmen's Row ("💬 Talk"). "🛒 Trade" opens their shops.
