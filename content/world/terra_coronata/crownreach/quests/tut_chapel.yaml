name: {es: Heridas de guerra, en: Battle Scars}
summary:
  es: «Nadie vuelve entero de ahí fuera», dice Vale. Antes de darte por listo, quiere que conozcas a la hermana Ysolde.
  en: "\"Nobody comes back whole from out there,\" says Vale. Before she calls you ready, she wants you to meet Sister Ysolde."
hint:
  es: Ve a la Capilla del Alba y habla con la hermana Ysolde («⚒ Actividades» → «🙏 Curar heridas»; si no llevas con qué pagar, te atienden igual). Luego haz un «🛏️ Descanso largo» en las Actividades de la taberna, que devuelve la vida y los usos de tus habilidades. Después, vuelve con Vale.
  en: Go to the Chapel of the Dawn and talk to Sister Ysolde ("⚒ Activities" → "🙏 Cure wounds"; if you can't pay, they treat you anyway). Then take a "🛏️ Long rest" from the tavern's Activities, which restores your health and your abilities' uses. Then report back to Vale.
