    journal: {es: Falta una última lección., en: One last lesson remains.}
  active:
    journal:
      es: Habla con la hermana Ysolde en la Capilla del Alba, descansa en la taberna y vuelve a informar a Vale.
      en: Talk to Sister Ysolde at the Chapel of the Dawn, rest at the tavern and report back to Vale.
  done:
    state: completed
    journal:
      es: "«Casi estás listo», dijo Vale. «Una última prueba: Bram, en la taberna, lleva años hablando de un jabalí que nadie ha podido abatir»."
      en: "\"You're almost ready,\" Vale said. \"One last test: Bram, at the tavern, has been talking for years about a boar nobody could bring down.\""
