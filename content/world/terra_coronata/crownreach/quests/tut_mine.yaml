summary:
  es: Los caminos del norte están cortados y la herrera Tessa no tiene hierro. Vale te manda a la mina con el pico.
  en: The northern roads are cut off and Tessa the smith has no iron. Vale sends you to the mine with the pickaxe.
hint:
  es: Por el Camino del Viejo Rey llegas a la Mina del Paso Viejo. En «⚒ Actividades», pulsa «⛏️ Minar» (4 min, sin peligro); la «🏕️ Expedición larga» saca más, pero puede haber emboscada.
  en: The Old King's Road takes you to the Old Pass Mine. In "⚒ Activities", press "⛏️ Mine" (4 min, no danger); a "🏕️ Long expedition" yields more, but you may be ambushed.
