legacy_done: [night_wings]
name: {es: Calles de Crownreach, en: Streets of Crownreach}
summary:
  es: «Un recluta que se pierde en su propia ciudad no me sirve», dice Vale. Quiere que conozcas la taberna y el Barrio de Oficios, donde cada oficio tiene su puesto.
  en: "\"A recruit who gets lost in their own city is no use to me,\" says Vale. She wants you to know the tavern and Craftsmen's Row, where every trade has its own stall."
hint:
  es: Abre /map (o «🧭 Viajar»). En la ciudad vas directo a cualquier lugar. Ve al Barrio de Oficios (de él salen los puestos de cada oficio) y luego a la taberna La Corona Rota, y habla allí con Bram.
  en: Open /map (or "🧭 Travel"). In the city you go straight anywhere. Visit Craftsmen's Row (the stalls of each trade hang off it), then the Broken Crown Tavern, and talk to Bram there.
