rewards:
  - xp: 25
  - gold: 5
stages:
  locked:
    state: locked
    journal: {es: La sargenta Vale tiene algo que enseñarte., en: Sergeant Vale has something to show you.}
  active:
    journal:
      es: Visita el Barrio de Oficios (un puesto por oficio) y la taberna La Corona Rota, y habla allí con Bram, el tabernero.
      en: Visit Craftsmen's Row (one stall per trade) and the Broken Crown Tavern, and talk to Bram, the tavern keeper, there.
    location_text:
      crownreach_workshops:
        es: "Yunques, alambiques y tinteros, cada cosa en su puesto: la forja de Tessa, la botica, el carpintero, la curtiduría, el joyero, el escriba y el ingeniero. Cada maestro enseña su oficio (🛠️ Oficios)."
        en: "Anvils, stills and inkwells, each in its own stall: Tessa's forge, the alchemist's shop, the carpenter, the tannery, the jeweler, the scribe and the engineer. Each master teaches their trade (🛠️ Professions)."
  done:
    state: completed
    journal:
      es: Ya sabes moverte por Crownreach. Bram te invitó a una cerveza «para la próxima».
      en: You know your way around Crownreach now. Bram offered you a beer "for next time".
