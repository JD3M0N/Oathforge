name: {es: Terra Coronata, en: Terra Coronata}
description:
  es: >-
    La «tierra coronada», corazón de Aetherfall. Desde las torres de Crownreach hasta los robles de
    Thornwood, aquí se juraron los primeros pactos del reino.
  en: >-
    The "crowned land", heart of Aetherfall. From the towers of Crownreach to the oaks of Thornwood,
    the realm's first oaths were sworn here.
