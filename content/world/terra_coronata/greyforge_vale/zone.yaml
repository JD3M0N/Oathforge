name: {es: Valle de la Fragua Gris, en: Greyforge Vale}
kind: wilds
description:
  es: "Una cuenca de bosques, canteras y puestos de transporte al norte del Camino del Viejo Rey. Abastece de materiales a Crownreach, y de allí salían los cargamentos que las órdenes falsas desviaban. (Región provisional: nombre y lore pendientes de aprobación.)"
  en: "A basin of forests, quarries and transport posts north of the Old King's Road. It supplies Crownreach with materials, and it is where the cargo that the forged orders diverted came from. (Provisional region: name and lore pending approval.)"
