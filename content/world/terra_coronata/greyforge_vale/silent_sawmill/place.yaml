name: {es: "Aserradero Silencioso", en: "Silent Sawmill"}
article: {es: el, en: "the"}
kind: wild
hunting: true
description:
  es: "Un aserradero con las sierras quietas y el río represado. Nadie ha trabajado aquí en meses, pero las cadenas todavía se mueven solas cuando no las miras."
  en: "A sawmill with its saws still and the river dammed. Nobody has worked here in months, but the chains still move by themselves when you are not looking."
exits:
  - {to: ash_quarry, minutes: 35, danger: 2}
  - {to: antler_wood, minutes: 25, danger: 2}
  - {to: regulator_workshop, minutes: 30, danger: 2}
encounters:
  - {monsters: [lumber_brute], weight: 3}
  - {monsters: [sawblade_automaton], weight: 3}
  - {monsters: [lumber_brute, sawblade_automaton], weight: 2, min_level: 16}
