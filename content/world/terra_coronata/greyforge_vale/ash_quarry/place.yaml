name: {es: "Cantera de Ceniza", en: "Ash Quarry"}
article: {es: la, en: "the"}
kind: wild
hunting: true
description:
  es: "Una cantera a cielo abierto cuyas paredes grises sueltan polvo con cada paso. Las grúas de los carreteros están rotas y hay cajas selladas abandonadas entre el escombro."
  en: "An open-air quarry whose grey walls shed dust with every step. The carters' cranes are broken and sealed crates lie abandoned among the rubble."
exits:
  - {to: valley_crossing, minutes: 25, danger: 2}
  - {to: ford_post, minutes: 30, danger: 1}
  - {to: silent_sawmill, minutes: 35, danger: 2}
encounters:
  - {monsters: [quarry_crawler], weight: 3}
  - {monsters: [ash_crossbowman, ash_smuggler], weight: 2}
  - {monsters: [quarry_crawler, quarry_crawler], weight: 2, min_level: 13}
gathering:
  - skill: mining
    tool: pickaxe
    stay_ambush: 0.25
    resources:
      - {item: iron_ore, weight: 40}
      - {item: coal, weight: 40}
      - {item: rough_gem, weight: 12, min_rank: 3}
      - {item: deep_iron_ore, weight: 18, min_rank: 3}
