- es: 'Orsa remueve la hoguera sin mirarte. «El que descansa en el Vado vuelve entero. Esa es mi norma.»'
  en: 'Orsa stirs the fire without looking at you. "Whoever rests at the Ford comes back whole. That is my rule."'
- es: '«La barcaza es mía; la historia del valle, de todos», dice Orsa.'
  en: '"The barge is mine; the vale''s story is everyone''s," says Orsa.'
- es: 'Orsa señala el camino con la barbilla. «Si dudas, sube a la cantera. Kellan tiene cuentas pendientes.»'
  en: 'Orsa points down the road with her chin. "If in doubt, go up to the quarry. Kellan has accounts to settle."'
- es: '«No te fíes del agua clara, {name}. En la Ribera, cuanto más clara, peor.»'
  en: '"Do not trust clear water, {name}. On the Shore, the clearer it is, the worse."'
- es: 'Orsa te acerca un cuenco de caldo. «Bebe. El valle pesa más con el estómago vacío.»'
  en: 'Orsa pushes a bowl of broth towards you. "Drink. The vale weighs more on an empty stomach."'
- es: '«Las balizas hablan con Iwen. A mí solo me dan dolor de cabeza», gruñe Orsa.'
  en: '"The beacons speak to Iwen. To me they only give a headache," grumbles Orsa.'
- es: 'Orsa se encoge de hombros. «Yo cobro el pasaje. Lo que lleves en la mochila no lo pregunto.»'
  en: 'Orsa shrugs. "I charge the fare. What you carry in your pack I do not ask."'
- es: '«Los carros pasaban de noche, {name}. Eso lo vi yo y nadie me preguntó.»'
  en: '"The carts crossed at night, {name}. I saw that myself and nobody asked."'
- es: 'Orsa golpea el remo contra el suelo. «Si te hieren, vuelve aquí. Para eso está el Vado.»'
  en: 'Orsa taps her oar on the ground. "If you are hurt, come back here. That is what the Ford is for."'
- es: '«Cada baliza que se apaga me cuesta un cliente», dice Orsa. «Pero también me cuesta un secreto.»'
  en: '"Every beacon that goes dark costs me a customer," says Orsa. "But it also costs me a secret."'
- es: 'Orsa levanta la vista del fuego. «Tamsin siempre ha tenido buen ojo para los reclutas. Y mal ojo para los consejos.»'
  en: 'Orsa looks up from the fire. "Tamsin always had a good eye for recruits. And a bad one for advice."'
- es: '«El valle es grande, {name}. Pero no más que un hombre con prisa.»'
  en: '"The vale is big, {name}. But no bigger than a man in a hurry."'
