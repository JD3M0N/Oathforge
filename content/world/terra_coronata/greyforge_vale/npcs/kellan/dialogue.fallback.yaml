- es: 'Kellan cuenta con los dedos sin levantar la vista del libro. «Cuarenta carros. Treinta y siete vuelven vacíos.»'
  en: 'Kellan counts on his fingers without looking up from the ledger. "Forty carts. Thirty-seven come back empty."'
- es: '«Una piedra pesa lo que pesa», dice Kellan. «Lo que no cuadra en el peso, miente.»'
  en: '"A stone weighs what it weighs," says Kellan. "What does not add up in the weight is lying."'
- es: 'Kellan escupe polvo. «Pregúntame por la carga y te cuento. Por lo demás, ve a ver a Orsa.»'
  en: 'Kellan spits dust. "Ask me about the cargo and I will tell you. For the rest, go see Orsa."'
- es: '«El agua baja, el polvo sube y los carreteros no vuelven, {name}. Algo no encaja.»'
  en: '"The water goes down, the dust goes up and the carters do not come back, {name}. Something does not fit."'
- es: 'Kellan golpea el libro con el lápiz. «Todo está aquí. Es lo que no está escrito lo que me da miedo.»'
  en: 'Kellan taps the ledger with his pencil. "It is all here. It is what is not written that scares me."'
- es: '«Las grúas se rompieron solas», dice Kellan. «Eso me dicen, y yo no soy tonto.»'
  en: '"The cranes broke by themselves," says Kellan. "That is what they tell me, and I am no fool."'
- es: 'Kellan te mira de arriba abajo. «Cinco estaciones sin un ayudante que valga. ¿Tú vales?»'
  en: 'Kellan looks you up and down. "Five seasons without a helper worth anything. Are you worth anything?"'
- es: '«Los reptantes salieron de la veta, {name}. Nadie los puso ahí.»'
  en: '"The crawlers came out of the seam, {name}. Nobody put them there."'
- es: 'Kellan se limpia las manos en el delantal. «Si encuentras cajas selladas, no las abras: tráemelas.»'
  en: 'Kellan wipes his hands on his apron. "If you find sealed crates, do not open them: bring them to me."'
- es: '«El aserradero lleva callado desde antes del invierno», murmura Kellan. «Y eso no es normal.»'
  en: '"The sawmill has been silent since before winter," Kellan murmurs. "And that is not normal."'
- es: 'Kellan cierra el libro de golpe. «Hoy no. Hoy hay demasiadas cosas que no me cuadran.»'
  en: 'Kellan snaps the ledger shut. "Not today. Today too many things do not add up."'
- es: '«Trabaja bien y no mires las cajas», dice Kellan, y de pronto se ríe sin ganas. «Es una broma. Más o menos.»'
  en: '"Work well and do not look at the crates," says Kellan, and suddenly laughs without joy. "A joke. More or less."'
