- es: 'Iwen pasa el dedo por un engranaje muerto. «Cada pieza guarda la memoria de un giro. Escúchala.»'
  en: 'Iwen runs a finger over a dead gear. "Every piece keeps the memory of a turn. Listen to it."'
- es: '«Una baliza no ilumina: avisa», dice Iwen. «Es una diferencia importante.»'
  en: '"A beacon does not light: it warns," says Iwen. "That is an important difference."'
- es: 'Iwen mira hacia la loma. «El Custodio no es un enemigo, {name}. Es una pregunta.»'
  en: 'Iwen looks towards the rise. "The Keeper is not an enemy, {name}. He is a question."'
- es: '«Los centinelas son del taller, no del valle», explica Iwen. «Sus núcleos son lo único que puede encender las torres.»'
  en: '"The sentinels belong to the workshop, not the vale," Iwen explains. "Their cores are the only thing that can light the towers."'
- es: 'Iwen sonríe con calma. «No te diré qué elegir, {name}. Te diré qué cuesta cada cosa.»'
  en: 'Iwen smiles calmly. "I will not tell you what to choose, {name}. I will tell you what each thing costs."'
- es: '«Mi madre vigiló las torres cuarenta años y nunca vio una luz», dice Iwen. «Yo quiero verla una vez.»'
  en: '"My mother watched the towers for forty years and never saw a light," says Iwen. "I want to see it once."'
- es: 'Iwen te ofrece una taza de infusión. «Con calma se afina la mano.»'
  en: 'Iwen offers you a cup of infusion. "With calm the hand is tuned."'
- es: '«Las anguilas de la Ribera guardan la luz que el valle perdió», dice Iwen. «No las subestimes.»'
  en: '"The Shore''s eels keep the light the vale lost," says Iwen. "Do not underestimate them."'
- es: 'Iwen comprueba una cuerda con el pulgar. «Un buen veterano no es el que más golpea, sino el que mejor responde.»'
  en: 'Iwen checks a rope with her thumb. "A good veteran is not the one who hits hardest, but the one who responds best."'
- es: '«El valle te recordará lo que hagas», dice Iwen. «Aunque no quieras que te recuerde.»'
  en: '"The vale will remember what you do," says Iwen. "Even if you do not want to be remembered."'
- es: 'Iwen cierra los ojos un instante. «Hoy las torres callan. Mañana, quizá, no.»'
  en: 'Iwen closes her eyes a moment. "Today the towers are silent. Tomorrow, perhaps, not."'
- es: '«Tamsin me escribió de ti, {name}. Dice que miras antes de correr. Buena costumbre.»'
  en: '"Tamsin wrote to me about you, {name}. She says you look before you run. A good habit."'
