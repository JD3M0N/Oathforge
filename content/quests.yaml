    en: "A group that does not eat does not march. Tamsin asks you for fish and a hot stew."
  hint:
    es: "Pesca dos peces en la Orilla del Arroyo de Plata (necesitas la caña de Tessa) y cocina un estofado del cazador en el fogón de la taberna."
    en: "Catch two fish at Silverbrook Bank (you need Tessa's rod) and cook a hunter's stew at the tavern hearth."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
