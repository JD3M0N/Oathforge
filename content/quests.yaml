# Misiones. Las que tienen `objectives` se completan solas al cumplirlos (muertes, charlas, lugares, objetos
# recogidos, desollados o fabricados, descansos, curaciones) y dan `rewards`; la siguiente se desbloquea con
# `after` (misión completada) o `unlock_flag`. El diario las ordena por `order`.
# 1-8: el tutorial de la sargenta Vale (de nivel 1 a 3, una actividad por misión); 9-11 llevan a nivel 5.
# `tutorial`: la primera actividad que encaja con su objetivo termina al momento y da lo que falta (una vez).
# `legacy_done`: quien completó alguna de esas misiones antiguas empieza con esta completada (sin recompensa).

tut_muster:
  order: 1
  tutorial: true
  giver: vale
  legacy_done: [night_wings]
  name: {es: Alistamiento, en: Mustering In}
  summary:
    es: La sargenta Vale recibe a los recién llegados en la plaza. Dice que la ciudad necesita manos… y que las tuyas parecen servir.
    en: Sergeant Vale greets newcomers in the plaza. She says the city needs hands… and yours look useful.
  hint:
    es: Estás en la plaza. Pulsa «💬 Hablar» y elige a la sargenta Vale. Luego abre el /rulebook y lee «🧺 Actividades».
    en: You are in the plaza. Press "💬 Talk" and pick Sergeant Vale. Then open the /rulebook and read "🧺 Activities".
  start_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: vale}
    - {kind: read, target: activities}
  rewards:
    - xp: 25
    - give_item: {skinning_knife: 1}
  stages:
    active:
      journal:
        es: "Preséntate a la sargenta Vale en la plaza de Crownreach. «Antes de salir, lee el reglamento», te dice: el /rulebook explica cómo funciona todo, y «🧺 Actividades», qué es minar, talar, recolectar o desollar."
        en: "Report to Sergeant Vale in Crownreach Plaza. \"Read the rulebook before you head out,\" she tells you: the /rulebook explains how everything works, and \"🧺 Activities\" what mining, woodcutting, gathering or skinning are."
      location_text:
        crownreach_plaza:
          es: "Una sargenta de la Guardia de Plata, con la voz de quien ha gritado a mil reclutas, llama a los recién llegados: «¡Eh, cara nueva! Ven aquí». 🗨️ Habla con ella para empezar."
          en: "A Silver Guard sergeant, with the voice of someone who has shouted at a thousand recruits, calls to the newcomers: \"Hey, new face! Over here.\" 🗨️ Talk to her to begin."
    done:
      state: completed
      journal:
        es: Vale te apuntó en su lista y te dio un cuchillo de desollar. «Primero, conoce la ciudad».
        en: Vale put you on her list and handed you a skinning knife. "First, learn the city."

tut_town:
  order: 2
  tutorial: true
  giver: vale
  after: tut_muster
  legacy_done: [night_wings]
  name: {es: Calles de Crownreach, en: Streets of Crownreach}
  summary:
    es: «Un recluta que se pierde en su propia ciudad no me sirve», dice Vale. Quiere que conozcas la taberna y el Barrio de Oficios.
    en: "\"A recruit who gets lost in their own city is no use to me,\" says Vale. She wants you to know the tavern and Craftsmen's Row."
  hint:
    es: Abre /map (o «🧭 Viajar»). En la ciudad vas directo a cualquier lugar. Ve al Barrio de Oficios y luego a la taberna La Corona Rota, y habla allí con Bram.
    en: Open /map (or "🧭 Travel"). In the city you go straight anywhere. Visit Craftsmen's Row, then the Broken Crown Tavern, and talk to Bram there.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: visit, target: crownreach_workshops}
    - {kind: visit, target: broken_crown_tavern}
    - {kind: talk, target: bram}
  rewards:
    - xp: 25
    - gold: 5
  stages:
    locked:
      state: locked
      journal: {es: La sargenta Vale tiene algo que enseñarte., en: Sergeant Vale has something to show you.}
    active:
      journal:
        es: Visita el Barrio de Oficios (talleres y gremio) y la taberna La Corona Rota, y habla allí con Bram, el tabernero.
        en: Visit Craftsmen's Row (workshops and guild) and the Broken Crown Tavern, and talk to Bram, the tavern keeper, there.
      location_text:
        crownreach_workshops:
          es: Yunques, alambiques y tinteros. Aquí se aprende un oficio y se fabrica con lo que traes de fuera (🛠️ Oficios).
          en: Anvils, stills and inkwells. Here you learn a trade and craft with what you bring back from outside (🛠️ Professions).
    done:
      state: completed
      journal:
        es: Ya sabes moverte por Crownreach. Bram te invitó a una cerveza «para la próxima».
        en: You know your way around Crownreach now. Bram offered you a beer "for next time".

tut_boars:
  order: 3
  tutorial: true
  giver: vale
  after: tut_town
  legacy_done: [night_wings]
  name: {es: Colmillos en el prado, en: Tusks in the Meadow}
  summary:
    es: Los jabalíes destrozan los campos al sur de la ciudad. Vale quiere ver cómo peleas… y cómo aprovechas lo que cazas.
    en: Boars are wrecking the fields south of the city. Vale wants to see how you fight… and how you use what you hunt.
  hint:
    es: El Prado de los Colmillos sale directo de la plaza. Ve con la vida llena y una poción a mano; pulsa «🏹 Cazar», a cualquier hora. Al ganar, pulsa «🔪 Desollar» o /skin para sacar el cuero (unos segundos).
    en: Tusk Meadow leaves straight from the plaza. Go with full health and a potion at hand; press "🏹 Hunt", at any hour. When you win, press "🔪 Skin" or /skin to take the hide (a few seconds).
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: kill, target: boar, count: 2}
    - {kind: skin, target: boar_hide}
  rewards:
    - xp: 100
    - give_item: {sickle: 1}
  stages:
    locked:
      state: locked
      journal: {es: Algo hoza en los campos del sur., en: Something is rooting in the southern fields.}
    active:
      journal:
        es: Caza dos jabalíes en el Prado de los Colmillos y consigue una piel desollando.
        en: Hunt two boars in Tusk Meadow and get a hide by skinning.
      location_text:
        tusk_meadow:
          es: "La hierba está removida a hozadas. Un recluta de la Guardia te grita desde la valla: «¡Cuidado con los colmillos, que no perdonan!»."
          en: The grass is torn up by snouts. A Guard recruit shouts from the fence, "Mind the tusks, they don't forgive!"
    done:
      state: completed
      journal:
        es: El prado respira. Vale asintió al ver la piel («no está mal») y te dio una hoz.
        en: The meadow breathes again. Vale nodded at the hide ("not bad") and gave you a sickle.

tut_herbs:
  order: 4
  tutorial: true
  giver: vale
  after: tut_boars
  legacy_done: [night_wings]
  name: {es: Raíz de sangre, en: Bloodroot}
  summary:
    es: La capilla se queda sin raíz de sangre y la Guardia sin pociones. Vale te manda al bosque con la hoz.
    en: The chapel is running out of bloodroot and the Guard out of potions. Vale sends you to the woods with the sickle.
  hint:
    es: Sal por la plaza al Camino del Viejo Rey y sigue hasta el Bosque de los Susurros (o el Claro de la Raíz Roja). Pulsa «🌿 Recolectar hierbas» (en el tutorial, la primera vez termina al momento). Los caminos con ⚠️ pueden traer emboscadas.
    en: Leave through the plaza to the Old King's Road and on to the Whispering Woods (or Redroot Clearing). Press "🌿 Gather herbs" (in the tutorial, the first time is done at once). Roads marked ⚠️ may bring ambushes.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: gather, target: bloodroot, count: 3}
  rewards:
    - xp: 50
    - gold: 5
  stages:
    locked:
      state: locked
      journal: {es: A la capilla le falta algo., en: The chapel is short of something.}
    active:
      journal:
        es: Recoge 3 raíces de sangre en el Bosque de los Susurros o el Claro de la Raíz Roja.
        en: Gather 3 bloodroot in the Whispering Woods or Redroot Clearing.
      location_text:
        whispering_woods:
          es: Entre los helechos asoman tallos rojizos. Raíz de sangre, como dijo Vale.
          en: Reddish stalks peek out between the ferns. Bloodroot, just as Vale said.
        redroot_clearing:
          es: El claro entero huele a raíz de sangre. Aquí no te costará llenar el morral.
          en: The whole clearing smells of bloodroot. Filling your pack won't be hard here.
    done:
      state: completed
      journal:
        es: "Volviste con raíz de sangre y sin un rasguño (o con pocos). Guarda alguna: te hará falta para cocinar."
        en: "You came back with bloodroot and few scratches. Keep some: you'll need it for cooking."

tut_stew:
  order: 5
  tutorial: true
  giver: vale
  after: tut_herbs
  legacy_done: [night_wings]
  name: {es: Guiso del cazador, en: Hunter's Stew}
  summary:
    es: «Un soldado con hambre es un soldado muerto». Vale quiere que aprendas a cocinar lo que cazas.
    en: "\"A hungry soldier is a dead soldier.\" Vale wants you to learn to cook what you hunt."
  hint:
    es: "En la taberna La Corona Rota está el fogón. Abre «🛠️ Oficios» y fabrica un estofado del cazador (2 de carne cruda + 1 raíz de sangre). La Cocina es una afición: no ocupa plaza de oficio."
    en: "The hearth is at The Broken Crown Tavern. Open \"🛠️ Professions\" and craft a Hunter's stew (2 raw meat + 1 bloodroot). Cooking is a hobby: it takes no profession slot."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: craft, target: hunter_stew}
  rewards:
    - xp: 50
    - give_item: {pickaxe: 1}
  stages:
    locked:
      state: locked
      journal: {es: Se acerca la hora de comer., en: Mealtime is coming.}
    active:
      journal:
        es: Cocina un estofado del cazador en el fogón de La Corona Rota.
        en: Cook a Hunter's stew at the hearth of The Broken Crown.
      location_text:
        broken_crown_tavern:
          es: "El fogón crepita al fondo. Bram te señala la olla con el trapo: «Es toda tuya, mientras no la quemes»."
          en: The hearth crackles at the back. Bram points his rag at the pot, "All yours, as long as you don't burn it."
    done:
      state: completed
      journal:
        es: El guiso olía tan bien que medio salón te pidió la receta. Vale te dio un pico y otro encargo.
        en: The stew smelled so good half the room asked for the recipe. Vale gave you a pickaxe and another job.

tut_mine:
  order: 6
  tutorial: true
  giver: vale
  after: tut_stew
  legacy_done: [night_wings]
  name: {es: Hierro para la Guardia, en: Iron for the Guard}
  summary:
    es: Los caminos del norte están cortados y la herrera Tessa no tiene hierro. Vale te manda a la mina con el pico.
    en: The northern roads are cut off and Tessa the smith has no iron. Vale sends you to the mine with the pickaxe.
  hint:
    es: Por el Camino del Viejo Rey llegas a la Mina del Paso Viejo. Pulsa «⛏️ Minar» (en el tutorial, la primera vez termina al momento). Fuera del tutorial, la «🏕️ Expedición larga» saca más, pero puede haber emboscada.
    en: The Old King's Road takes you to the Old Pass Mine. Press "⛏️ Mine" (in the tutorial, the first time is done at once). Outside the tutorial, a "🏕️ Long expedition" yields more, but you may be ambushed.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: gather, target: iron_ore, count: 3}
  rewards:
    - xp: 60
    - gold: 10
  stages:
    locked:
      state: locked
      journal: {es: La herrería de Tessa está demasiado tranquila., en: Tessa's forge is too quiet.}
    active:
      journal:
        es: Saca 3 menas de hierro en la Mina del Paso Viejo.
        en: Dig out 3 iron ore at the Old Pass Mine.
      location_text:
        ironvein_mine:
          es: Las vetas de hierro brillan a la luz de la antorcha. Al fondo, algo chilla y se aleja aleteando.
          en: The iron veins gleam in the torchlight. Deep inside, something squeaks and flutters away.
    done:
      state: completed
      journal:
        es: Tessa besó la mena (literalmente) y Vale te pagó. Ahora toca algo más oscuro.
        en: Tessa kissed the ore (literally) and Vale paid you. Now for something darker.

tut_bats:
  order: 7
  tutorial: true
  giver: vale
  after: tut_mine
  legacy_done: [night_wings]
  name: {es: Alas al anochecer, en: Wings at Dusk}
  summary:
    es: Cada anochecer, una bandada de murciélagos sale de la Mina del Paso Viejo y ataca al ganado del prado. Vale quiere cortarla de raíz, en su nido.
    en: Every dusk, a swarm of bats pours out of Old Pass Mine and attacks the meadow's livestock. Vale wants it stopped at the root, in its nest.
  hint:
    es: Ve a la Mina del Paso Viejo y pulsa «🏹 Cazar». En las galerías hay murciélagos a cualquier hora (y alguna rata).
    en: Go to Old Pass Mine and press "🏹 Hunt". There are bats in the tunnels at any hour (and the odd rat).
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: kill, target: cave_bat, count: 3}
  rewards:
    - xp: 75
  stages:
    locked:
      state: locked
      journal: {es: Algo sale de la mina cuando oscurece., en: Something comes out of the mine after dark.}
    active:
      journal:
        es: Acaba con tres murciélagos en su nido de la Mina del Paso Viejo.
        en: Kill three bats in their nest in Old Pass Mine.
    done:
      state: completed
      journal:
        es: Las noches del prado vuelven a ser tranquilas. En la taberna ya se habla de ti.
        en: The meadow nights are quiet again. The tavern is already talking about you.

tut_chapel:
  order: 8
  tutorial: true
  giver: vale
  after: tut_bats
  legacy_done: [night_wings]
  name: {es: Heridas de guerra, en: Battle Scars}
  summary:
    es: «Nadie vuelve entero de ahí fuera», dice Vale. Antes de darte por listo, quiere que conozcas a la hermana Ysolde.
    en: "\"Nobody comes back whole from out there,\" says Vale. Before she calls you ready, she wants you to meet Sister Ysolde."
  hint:
    es: Ve a la Capilla del Alba y habla con la hermana Ysolde («🙏 Curar heridas», gratis durante la beta). Para todo lo demás, descanso largo en la posada. Después, vuelve con Vale.
    en: Go to the Chapel of the Dawn and talk to Sister Ysolde ("🙏 Heal wounds", free during the beta). For everything else, a long rest at the inn. Then report back to Vale.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: ysolde}
    - {kind: talk, target: vale}
  rewards:
    - xp: 40
    - give_item: {healing_potion: 1}
  stages:
    locked:
      state: locked
      journal: {es: Falta una última lección., en: One last lesson remains.}
    active:
      journal:
        es: Habla con la hermana Ysolde en la Capilla del Alba y vuelve a informar a Vale.
        en: Talk to Sister Ysolde at the Chapel of the Dawn and report back to Vale.
    done:
      state: completed
      journal:
        es: «Ya no eres un recluta», dijo Vale. «Dicen que en el Bosque de los Susurros desaparecen patrullas. Echa un vistazo y, si encuentras algo, llévaselo al sargento Holt».
        en: "\"You're no recruit any more,\" Vale said. \"Word is patrols keep vanishing in the Whispering Woods. Take a look and, if you find anything, bring it to Sergeant Holt.\""

crypt_bones:
  order: 10
  giver: holt
  unlock_flag: crypt_unlocked
  name: {es: Huesos inquietos, en: Restless Bones}
  summary:
    es: Los soldados de Ser Aldren siguen montando guardia en la Cripta Hundida. Hay que dejarlos descansar.
    en: Ser Aldren's soldiers still stand guard in the Sunken Crypt. They must be laid to rest.
  hint:
    es: La entrada está en el Bosque de los Susurros. En el osario puedes descansar gratis antes del santuario.
    en: The entrance is in the Whispering Woods. You can rest for free in the ossuary before the sanctum.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: kill, target: crypt_skeleton, count: 3}
  rewards:
    - xp: 300
    - give_item: {healing_potion: 2}
  stages:
    locked:
      state: locked
      journal: {es: Bajo el bosque hay una cripta sellada., en: A sealed crypt lies beneath the woods.}
    active:
      journal:
        es: Destruye a los esqueletos de la Cripta Hundida.
        en: Destroy the skeletons of the Sunken Crypt.
    done:
      state: completed
      journal:
        es: Los guardias de huesos han caído. Solo queda su señor, en el santuario.
        en: The bone guards have fallen. Only their lord remains, in the sanctum.

old_tusk:
  order: 11
  giver: bram
  unlock_flag: old_tusk_hunt
  name: {es: El Viejo Colmillo, en: Old Tusk}
  summary:
    es: Con la cripta en paz, Bram te cuenta la leyenda del jabalí que ningún cazador ha logrado abatir.
    en: With the crypt at peace, Bram tells you the legend of the boar no hunter has ever brought down.
  hint:
    es: Ve al Prado de los Colmillos. El Viejo Colmillo te estará esperando.
    en: Go to Tusk Meadow. Old Tusk will be waiting for you.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: kill, target: old_tusk}
  rewards:
    - xp: 300
    - gold: 80
  stages:
    locked:
      state: locked
      journal: {es: Una leyenda del prado espera a alguien digno., en: A meadow legend awaits someone worthy.}
    active:
      journal:
        es: Abate al Viejo Colmillo en el Prado de los Colmillos.
        en: Bring down Old Tusk in Tusk Meadow.
      location_text:
        tusk_meadow:
          es: La tierra tiembla. Unas huellas enormes cruzan el prado, más profundas que las de cualquier jabalí.
          en: The ground trembles. Huge tracks cross the meadow, deeper than any boar's.
    done:
      state: completed
      journal:
        es: El Viejo Colmillo ha caído. Su cabeza ya cuelga sobre la barra de La Corona Rota.
        en: Old Tusk has fallen. Its head now hangs above the bar of the Broken Crown.

sealed_box:
  name: {es: El relicario sellado, en: The Sealed Reliquary}
  summary:
    es: Un mensajero de la Guardia de Plata desapareció en el Bosque de los Susurros con una caja que muchos quieren.
    en: A Silver Guard courier vanished in the Whispering Woods carrying a box many people want.
  order: 9
  giver: holt
  after: tut_chapel
  start_stage: locked
  unlock_stage: not_started
  hint:
    es: Busca en el Bosque de los Susurros (por el Camino del Viejo Rey) y habla con el sargento Holt en la plaza.
    en: Search the Whispering Woods (via the Old King's Road) and talk to Sergeant Holt in the plaza.

  stages:
    locked:
      state: locked
      journal:
        es: Dicen que en el bosque pasan cosas raras. Primero, termina la instrucción de la sargenta Vale.
        en: Word is strange things happen in the woods. First, finish Sergeant Vale's training.
    not_started:
      state: available
      journal:
        es: Dicen en la taberna que las patrullas desaparecen cerca del Bosque de los Susurros.
        en: Tavern talk says patrols keep vanishing near the Whispering Woods.
      location_text:
        whispering_woods:
          es: >-
            A tu derecha oyes una respiración agitada. Una soldado herida, con los colores de la Guardia de Plata,
            intenta esconder una pequeña caja bajo su capa. «Por favor... no dejes que la encuentren».
          en: >-
            To your right you hear ragged breathing. A wounded soldier in Silver Guard colors tries to hide a small
            box under her cloak. "Please... don't let them find it."
    has_box:
      journal:
        es: >-
          Tienes el relicario sellado del soldado Edda. El sargento Holt lo busca; Mira, la encapuchada, pagaría
          bien por él. También podrías abrirlo tú mismo.
        en: >-
          You carry Private Edda's sealed reliquary. Sergeant Holt is looking for it; Mira, the hooded woman, would
          pay well for it. You could also open it yourself.
    returned_covenant:
      journal:
        es: Holt abrió el relicario y te entregó la llave de la Cripta Hundida. Debes dar descanso a su guardián.
        en: Holt opened the reliquary and gave you the key to the Sunken Crypt. You must lay its warden to rest.
    sold_syndicate:
      journal:
        es: Vendiste el relicario a Mira. Sus hombres ya bajan a la cripta... y no les gusta compartir.
        en: You sold the reliquary to Mira. Her crew is already heading into the crypt... and they don't like sharing.
    opened_box:
      journal:
        es: Dentro del relicario había una llave de bronce. Nadie sabe que la tienes. La cripta te espera.
        en: Inside the reliquary was a bronze key. No one knows you have it. The crypt awaits.
    completed_covenant:
      state: completed
      journal:
        es: Ser Aldren descansa al fin. El Pacto de Plata cantará tu nombre.
        en: Ser Aldren rests at last. The Silver Covenant will sing your name.
    completed_syndicate:
      state: completed
      journal:
        es: El guardián ha caído y el Sindicato saquea la cripta. Tú te llevaste tu parte.
        en: The warden has fallen and the Syndicate is looting the crypt. You took your share.
    completed_alone:
      state: completed
      journal:
        es: Derrotaste al guardián sin rendir cuentas a nadie. Lo que había en la cripta es tuyo.
        en: You defeated the warden without answering to anyone. What lay in the crypt is yours.

  actions:
    approach_guard:
      label: {es: 🩸 Acercarte al guardia herido, en: 🩸 Approach the wounded guard}
      location: whispering_woods
      stages: [not_started]
      text:
        es: Te arrodillas junto a la soldado. Se llama Edda y sangra demasiado. Te pone la caja en las manos.
        en: You kneel by the soldier. Her name is Edda and she is bleeding too much. She presses the box into your hands.
      check:
        skill: medicine
        tier: medium
        success_text:
          es: Detienes la hemorragia. Edda vivirá, y promete contarle a Holt lo que hiciste.
          en: You stop the bleeding. Edda will live, and she promises to tell Holt what you did.
        failure_text:
          es: Haces lo que puedes, pero sus ojos se apagan mientras susurra «Holt... dáselo a Holt».
          en: You do what you can, but her eyes go dim as she whispers "Holt... give it to Holt."
        success_effects:
          - set_flag: edda_saved
          - reputation: {silver_covenant: 5}
          - npc_memory: {npc: holt, importance: 4, text: "{name} saved Private Edda's life in the Whispering Woods."}
        failure_effects:
          - npc_memory: {npc: holt, importance: 3, text: "Private Edda died in the woods; {name} was with her at the end."}
      effects:
        - give_item: {sealed_reliquary: 1}
        - xp: 50
      to_stage: has_box

    give_box_holt:
      label: {es: 🛡️ Entregar el relicario a Holt, en: 🛡️ Hand the reliquary to Holt}
      npc: holt
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: >-
          Holt rompe el sello con reverencia y saca una llave de bronce. «La Cripta Hundida. Alguien debe bajar
          y terminar lo que Ser Aldren empezó. Toma esto: lo necesitarás».
        en: >-
          Holt breaks the seal with reverence and takes out a bronze key. "The Sunken Crypt. Someone must go down
          and finish what Ser Aldren began. Take these: you will need them."
      effects:
        - take_item: {sealed_reliquary: 1}
        - give_item: {healing_potion: 2}
        - gold: 40
        - xp: 100
        - reputation: {silver_covenant: 15, crimson_syndicate: -5}
        - set_flag: crypt_unlocked
        - npc_memory: {npc: holt, importance: 5, text: "{name} returned the sealed reliquary to the Silver Guard. Trustworthy."}
        - trust: {npc: holt, delta: 2}
      to_stage: returned_covenant

    sell_box_mira:
      label: {es: 🗝️ Vender el relicario a Mira, en: 🗝️ Sell the reliquary to Mira}
      npc: mira
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: >-
          Mira cuenta ciento veinte monedas sin mirarte. «Mis chicos bajarán esta noche. Si quieres tu parte del
          botín, ya sabes dónde está la cripta... bajo la hiedra del bosque».
        en: >-
          Mira counts out a hundred and twenty coins without looking at you. "My crew goes down tonight. If you
          want a share of the loot, you know where the crypt is... under the ivy in the woods."
      effects:
        - take_item: {sealed_reliquary: 1}
        - gold: 120
        - xp: 100
        - reputation: {crimson_syndicate: 15, silver_covenant: -10}
        - set_flag: crypt_unlocked
        - set_flag: syndicate_in_crypt
        - npc_memory: {npc: mira, importance: 5, text: "{name} sold me the Silver Guard reliquary. Useful, and not squeamish."}
        - trust: {npc: mira, delta: 2}
      to_stage: sold_syndicate

    open_box:
      label: {es: 🔓 Abrir el relicario tú mismo, en: 🔓 Open the reliquary yourself}
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: Examinas el cierre de plata. El sello está encantado, pero quizá un dedo hábil pueda sortearlo.
        en: You study the silver clasp. The seal is enchanted, but perhaps a deft finger can get around it.
      check:
        skill: sleight_of_hand
        tier: hard
        success_text:
          es: El cierre cede sin un sonido. Dentro hay una llave de bronce con el emblema de un caballero.
          en: The clasp gives way without a sound. Inside lies a bronze key bearing a knight's emblem.
        failure_text:
          es: El sello estalla en una llamarada fría que te muerde los dedos. La caja se abre igualmente.
          en: The seal bursts in a cold flare that bites your fingers. The box opens anyway.
        failure_effects:
          - damage: 1d6
      effects:
        - take_item: {sealed_reliquary: 1}
        - xp: 50
        - set_flag: crypt_unlocked
      to_stage: opened_box

  triggers:
    - event: defeat
      target: crypt_warden
      stages: [returned_covenant]
      to_stage: completed_covenant
      text:
        es: Ser Aldren baja la espada. «Una mano honesta...», susurra, y su armadura se derrumba vacía.
        en: Ser Aldren lowers his sword. "An honest hand...", he whispers, and his armor collapses, empty.
      effects:
        - gold: 100
        - xp: 300
        - set_flag: old_tusk_hunt
        - reputation: {silver_covenant: 20}
        - npc_memory: {npc: holt, importance: 5, text: "{name} laid the Crypt Warden to rest. A true friend of the Covenant."}
        - world_rumor: {es: "Dicen que {name} entró en la Cripta Hundida con la bendición del Pacto y dio descanso a Ser Aldren.", en: "They say {name} entered the Sunken Crypt with the Covenant's blessing and laid Ser Aldren to rest."}
    - event: defeat
      target: crypt_warden
      stages: [sold_syndicate]
      to_stage: completed_syndicate
      text:
        es: El guardián cae. Detrás de ti, los hombres de Mira ya están llenando sacos.
        en: The warden falls. Behind you, Mira's crew is already filling sacks.
      effects:
        - gold: 150
        - xp: 300
        - set_flag: old_tusk_hunt
        - reputation: {crimson_syndicate: 10}
        - npc_memory: {npc: mira, importance: 4, text: "{name} cleared the crypt for us. Worth keeping close."}
        - world_rumor: {es: "Corre la voz de que {name} abrió la Cripta Hundida para el Sindicato Carmesí.", en: "Word is that {name} cracked the Sunken Crypt open for the Crimson Syndicate."}
    - event: defeat
      target: crypt_warden
      stages: [locked, not_started, has_box, opened_box]
      to_stage: completed_alone
      text:
        es: El guardián se desploma. Nadie te vio bajar y nadie te verá salir con el tesoro.
        en: The warden crumbles. No one saw you go down and no one will see you leave with the treasure.
      effects:
        - gold: 80
        - xp: 300
        - set_flag: old_tusk_hunt
        - world_rumor: {es: "Alguien vio a {name} salir del bosque cubierto de polvo de tumba. Nadie sabe qué encontró.", en: "Someone saw {name} leave the woods covered in grave dust. No one knows what they found."}
