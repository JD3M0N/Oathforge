# Misiones. Las que tienen `objectives` se completan solas al cumplirlos (muertes, charlas, lugares, objetos
# recogidos, desollados o fabricados, descansos, curaciones) y dan `rewards`; la siguiente se desbloquea con
# `after` (misión completada) o `unlock_flag`. El diario las ordena por `order`.
# 1-10: el tutorial (Vale, Bram): hablar, ciudad, tiendas, cazar, desollar, recolectar, cocinar, minar, curarse y
# descansar, y un jefe en el prado. Sin mazmorras. 11-12 (relicario y cripta) son la primera aventura después.
# `tutorial`: misión del tutorial (cuenta en `oath tutorial-stats`). Sus actividades llevan su tiempo real.
# `legacy_done`: quien completó alguna de esas misiones antiguas empieza con esta completada (sin recompensa).

tut_muster:
  order: 1
  tutorial: true
  giver: vale
  legacy_done: [night_wings]
  name: {es: Alistamiento, en: Mustering In}
  summary:
    es: La sargenta Vale alista a los recién llegados en el Gremio de Aventureros, junto a la plaza. Dice que la ciudad necesita manos… y que las tuyas parecen servir.
    en: Sergeant Vale signs newcomers up at the Adventurers' Guild, just off the plaza. She says the city needs hands… and yours look useful.
  hint:
    es: Ve al Gremio de Aventureros (desde la plaza, con «🧭 Viajar»). Pulsa «💬 Hablar» y elige a la sargenta Vale. Luego abre el /rulebook y lee «🧺 Actividades».
    en: Go to the Adventurers' Guild (from the plaza, with "🧭 Travel"). Press "💬 Talk" and pick Sergeant Vale. Then open the /rulebook and read "🧺 Activities".
  start_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: vale}
    - {kind: read, target: activities}
  rewards:
    - xp: 25
    - give_item: {skinning_knife: 1}
  stages:
    active:
      journal:
        es: "Preséntate a la sargenta Vale en el Gremio de Aventureros. «Antes de salir, lee el reglamento», te dice: el /rulebook explica cómo funciona todo, y «🧺 Actividades», qué es minar, talar, recolectar o desollar."
        en: "Report to Sergeant Vale at the Adventurers' Guild. \"Read the rulebook before you head out,\" she tells you: the /rulebook explains how everything works, and \"🧺 Activities\" what mining, woodcutting, gathering or skinning are."
      location_text:
        crownreach_plaza:
          es: "Al este de la plaza, sobre una puerta de piedra, cuelga el escudo del Gremio de Aventureros. Allí dentro alistan a los recién llegados: 🧭 ve al gremio y habla con la sargenta Vale."
          en: "East of the plaza, above a stone door, hangs the crest of the Adventurers' Guild. That is where newcomers are signed up: 🧭 go to the guild and talk to Sergeant Vale."
        adventurers_guild:
          es: "Una sargenta de la Guardia de Plata, con la voz de quien ha gritado a mil reclutas, llama a los recién llegados desde el tablón: «¡Eh, cara nueva! Ven aquí». 🗨️ Habla con ella para empezar."
          en: "A Silver Guard sergeant, with the voice of someone who has shouted at a thousand recruits, calls to the newcomers from the notice board: \"Hey, new face! Over here.\" 🗨️ Talk to her to begin."
    done:
      state: completed
      journal:
        es: Vale te apuntó en su lista y te dio un cuchillo de desollar. «Primero, conoce la ciudad».
        en: Vale put you on her list and handed you a skinning knife. "First, learn the city."

tut_town:
  order: 2
  tutorial: true
  giver: vale
  after: tut_muster
  legacy_done: [night_wings]
  name: {es: Calles de Crownreach, en: Streets of Crownreach}
  summary:
    es: «Un recluta que se pierde en su propia ciudad no me sirve», dice Vale. Quiere que conozcas la taberna y el Barrio de Oficios, donde cada oficio tiene su puesto.
    en: "\"A recruit who gets lost in their own city is no use to me,\" says Vale. She wants you to know the tavern and Craftsmen's Row, where every trade has its own stall."
  hint:
    es: Abre /map (o «🧭 Viajar»). En la ciudad vas directo a cualquier lugar. Ve al Barrio de Oficios (de él salen los puestos de cada oficio) y luego a la taberna La Corona Rota, y habla allí con Bram.
    en: Open /map (or "🧭 Travel"). In the city you go straight anywhere. Visit Craftsmen's Row (the stalls of each trade hang off it), then the Broken Crown Tavern, and talk to Bram there.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: visit, target: crownreach_workshops}
    - {kind: visit, target: broken_crown_tavern}
    - {kind: talk, target: bram}
  rewards:
    - xp: 25
    - gold: 5
  stages:
    locked:
      state: locked
      journal: {es: La sargenta Vale tiene algo que enseñarte., en: Sergeant Vale has something to show you.}
    active:
      journal:
        es: Visita el Barrio de Oficios (un puesto por oficio) y la taberna La Corona Rota, y habla allí con Bram, el tabernero.
        en: Visit Craftsmen's Row (one stall per trade) and the Broken Crown Tavern, and talk to Bram, the tavern keeper, there.
      location_text:
        crownreach_workshops:
          es: "Yunques, alambiques y tinteros, cada cosa en su puesto: la forja de Tessa, la botica, el carpintero, la curtiduría, el joyero, el escriba y el ingeniero. Cada maestro enseña su oficio (🛠️ Oficios)."
          en: "Anvils, stills and inkwells, each in its own stall: Tessa's forge, the alchemist's shop, the carpenter, the tannery, the jeweler, the scribe and the engineer. Each master teaches their trade (🛠️ Professions)."
    done:
      state: completed
      journal:
        es: Ya sabes moverte por Crownreach. Bram te invitó a una cerveza «para la próxima».
        en: You know your way around Crownreach now. Bram offered you a beer "for next time".

tut_market:
  order: 3
  tutorial: true
  giver: vale
  after: tut_town
  legacy_done: [tut_boars, night_wings]
  name: {es: El mercado, en: The Market}
  summary:
    es: «Nadie sale de la ciudad sin pociones», dice Vale. Quiere que conozcas a quienes las venden.
    en: "\"Nobody leaves the city without potions,\" says Vale. She wants you to meet the people who sell them."
  hint:
    es: Habla con Mira en el Mercado de Crownreach y con Tessa en su forja, el primer puesto del Barrio de Oficios («💬 Hablar»). Con «🛒 Comerciar» ves sus tiendas.
    en: Talk to Mira at Crownreach Market and to Tessa at her forge, the first stall on Craftsmen's Row ("💬 Talk"). "🛒 Trade" opens their shops.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: mira}
    - {kind: talk, target: tessa}
  rewards:
    - xp: 25
    - gold: 5
    - give_item: {healing_potion: 1}
  stages:
    locked:
      state: locked
      journal: {es: Vale habla de pociones., en: Vale is talking about potions.}
    active:
      journal:
        es: Habla con Mira, en el Mercado de Crownreach, y con Tessa, en su forja del Barrio de Oficios. De día están en sus puestos; de noche, en la taberna.
        en: Talk to Mira, at Crownreach Market, and to Tessa, at her forge on Craftsmen's Row. By day they are at their stalls; at night, in the tavern.
    done:
      state: completed
      journal:
        es: Mira te guiñó un ojo y Tessa te miró las manos («blandas»). Vale te regaló una poción «para el prado».
        en: Mira winked at you and Tessa looked at your hands ("soft"). Vale gave you a potion "for the meadow".

tut_boars:
  order: 4
  tutorial: true
  giver: vale
  after: tut_market
  legacy_done: [night_wings]
  name: {es: Colmillos en el prado, en: Tusks in the Meadow}
  summary:
    es: Los jabalíes destrozan los campos al sur de la ciudad. Vale quiere ver cómo peleas… y cómo aprovechas lo que cazas.
    en: Boars are wrecking the fields south of the city. Vale wants to see how you fight… and how you use what you hunt.
  hint:
    es: El Prado de los Colmillos sale directo de la plaza. Ve con la vida llena y una poción a mano y en «⚒ Actividades» pulsa «🏹 Cazar» (cuenta cualquier presa, de día o de noche). Al ganar, «🔪 Desollar» (también en Actividades) o /skin saca la carne.
    en: Tusk Meadow leaves straight from the plaza. Go with full health and a potion at hand and in "⚒ Activities" press "🏹 Hunt" (any prey counts, day or night). When you win, "🔪 Skin" (also in Activities) or /skin takes the meat.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: hunt, target: tusk_meadow, count: 2}
    - {kind: skin, target: raw_meat, count: 2}
  rewards:
    - xp: 100
    - give_item: {sickle: 1}
  stages:
    locked:
      state: locked
      journal: {es: Algo hoza en los campos del sur., en: Something is rooting in the southern fields.}
    active:
      journal:
        es: Caza dos veces en el Prado de los Colmillos y consigue 2 de carne desollando. Te hará falta para el guiso.
        en: Hunt twice in Tusk Meadow and get 2 raw meat by skinning. You'll need it for the stew.
      location_text:
        tusk_meadow:
          es: "La hierba está removida a hozadas. Un recluta de la Guardia te grita desde la valla: «¡Cuidado con los colmillos, que no perdonan!»."
          en: The grass is torn up by snouts. A Guard recruit shouts from the fence, "Mind the tusks, they don't forgive!"
    done:
      state: completed
      journal:
        es: El prado respira. Vale asintió al ver la carne («no está mal; guárdala») y te dio una hoz.
        en: The meadow breathes again. Vale nodded at the meat ("not bad; keep it") and gave you a sickle.

tut_herbs:
  order: 5
  tutorial: true
  giver: vale
  after: tut_boars
  legacy_done: [night_wings]
  name: {es: Raíz de sangre, en: Bloodroot}
  summary:
    es: La capilla se queda sin raíz de sangre y la Guardia sin pociones. Vale te manda al bosque con la hoz.
    en: The chapel is running out of bloodroot and the Guard out of potions. Vale sends you to the woods with the sickle.
  hint:
    es: Sal por la plaza al Camino del Viejo Rey y sigue hasta el Bosque de los Susurros (o el Claro de la Raíz Roja). En «⚒ Actividades», pulsa «🌿 Recolectar hierbas» (en el tutorial termina al momento). Los caminos con ⚠️ pueden traer emboscadas.
    en: Leave through the plaza to the Old King's Road and on to the Whispering Woods (or Redroot Clearing). In "⚒ Activities", press "🌿 Gather herbs" (in the tutorial it is done at once). Roads marked ⚠️ may bring ambushes.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: gather, target: bloodroot, count: 3}
  rewards:
    - xp: 50
    - gold: 5
  stages:
    locked:
      state: locked
      journal: {es: A la capilla le falta algo., en: The chapel is short of something.}
    active:
      journal:
        es: Recoge 3 raíces de sangre en el Bosque de los Susurros o el Claro de la Raíz Roja.
        en: Gather 3 bloodroot in the Whispering Woods or Redroot Clearing.
      location_text:
        whispering_woods:
          es: Entre los helechos asoman tallos rojizos. Raíz de sangre, como dijo Vale.
          en: Reddish stalks peek out between the ferns. Bloodroot, just as Vale said.
        redroot_clearing:
          es: El claro entero huele a raíz de sangre. Aquí no te costará llenar el morral.
          en: The whole clearing smells of bloodroot. Filling your pack won't be hard here.
    done:
      state: completed
      journal:
        es: "Volviste con raíz de sangre y sin un rasguño (o con pocos). Guarda alguna: te hará falta para cocinar."
        en: "You came back with bloodroot and few scratches. Keep some: you'll need it for cooking."

tut_stew:
  order: 6
  tutorial: true
  giver: vale
  after: tut_herbs
  legacy_done: [night_wings]
  name: {es: Guiso del cazador, en: Hunter's Stew}
  summary:
    es: «Un soldado con hambre es un soldado muerto». Vale quiere que aprendas a cocinar lo que cazas.
    en: "\"A hungry soldier is a dead soldier.\" Vale wants you to learn to cook what you hunt."
  hint:
    es: "En la taberna La Corona Rota está el fogón. En «⚒ Actividades», pulsa «🔨 Fabricar» y prepara un estofado del cazador (2 de carne cruda + 1 raíz de sangre). La Cocina es una afición: no ocupa plaza de oficio."
    en: "The hearth is at the Broken Crown Tavern. In \"⚒ Activities\", press \"🔨 Craft\" and make a Hunter's stew (2 raw meat + 1 bloodroot). Cooking is a hobby: it takes no profession slot."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: craft, target: hunter_stew}
  rewards:
    - xp: 50
    - give_item: {pickaxe: 1}
  stages:
    locked:
      state: locked
      journal: {es: Se acerca la hora de comer., en: Mealtime is coming.}
    active:
      journal:
        es: Cocina un estofado del cazador en el fogón de La Corona Rota.
        en: Cook a Hunter's stew at the hearth of The Broken Crown.
      location_text:
        broken_crown_tavern:
          es: "El fogón crepita al fondo. Bram te señala la olla con el trapo: «Es toda tuya, mientras no la quemes»."
          en: The hearth crackles at the back. Bram points his rag at the pot, "All yours, as long as you don't burn it."
    done:
      state: completed
      journal:
        es: El guiso olía tan bien que medio salón te pidió la receta. Vale te dio un pico y otro encargo.
        en: The stew smelled so good half the room asked for the recipe. Vale gave you a pickaxe and another job.

tut_mine:
  order: 7
  tutorial: true
  giver: vale
  after: tut_stew
  legacy_done: [night_wings]
  name: {es: Hierro para la Guardia, en: Iron for the Guard}
  summary:
    es: Los caminos del norte están cortados y la herrera Tessa no tiene hierro. Vale te manda a la mina con el pico.
    en: The northern roads are cut off and Tessa the smith has no iron. Vale sends you to the mine with the pickaxe.
  hint:
    es: Por el Camino del Viejo Rey llegas a la Mina del Paso Viejo. En «⚒ Actividades», pulsa «⛏️ Minar» (en el tutorial termina al momento). Fuera del tutorial, la «🏕️ Expedición larga» saca más, pero puede haber emboscada.
    en: The Old King's Road takes you to the Old Pass Mine. In "⚒ Activities", press "⛏️ Mine" (in the tutorial it is done at once). Outside the tutorial, a "🏕️ Long expedition" yields more, but you may be ambushed.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: gather, target: iron_ore, count: 3}
  rewards:
    - xp: 60
    - give_item: {woodaxe: 1}
  stages:
    locked:
      state: locked
      journal: {es: La herrería de Tessa está demasiado tranquila., en: Tessa's forge is too quiet.}
    active:
      journal:
        es: Saca 3 menas de hierro en la Mina del Paso Viejo.
        en: Dig out 3 iron ore at the Old Pass Mine.
      location_text:
        ironvein_mine:
          es: Las vetas de hierro brillan a la luz de la antorcha. Al fondo, algo chilla y se aleja aleteando.
          en: The iron veins gleam in the torchlight. Deep inside, something squeaks and flutters away.
    done:
      state: completed
      journal:
        es: "Tessa besó la mena (literalmente). Vale te dio un hacha: «Te has ganado un cuarto; ahora amuéblalo»."
        en: "Tessa kissed the ore (literally). Vale handed you an axe: \"You have earned a room; now furnish it.\""

tut_room:
  order: 8
  tutorial: true
  giver: vale
  after: tut_mine
  legacy_done: [night_wings]
  name: {es: Un cuarto propio, en: A Room of Your Own}
  summary:
    es: «Los socios duermen aquí, no en el suelo de la taberna», dice Vale. Te asigna un cuarto vacío en el Gremio; lo que lleve dentro, lo pones tú.
    en: "\"Members sleep here, not on the tavern floor,\" says Vale. She gives you an empty room at the guild; whatever goes in it, you put there."
  hint:
    es: Tala robles en la Arboleda Antigua con el hacha (⚒ Actividades → 🪓 Talar) y asierra los troncos en el puesto de aserrado del Gremio de Aventureros. Con 4 tablones montas el cofre; luego pide la tela a Vale y, con 2 tablones más, la cama. Dormir en ella no cuesta oro.
    en: Fell oaks at the Elderwood Grove with the axe (⚒ Activities → 🪓 Chop) and saw the logs at the Adventurers' Guild sawing station. Four planks build the chest; then ask Vale for the cloth and, with two more planks, the bed. Sleeping in it costs no gold.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: craft, target: "furniture:chest"}
    - {kind: craft, target: "furniture:bed"}
  rewards:
    - xp: 60
  actions:
    cloth:
      label: {es: 🧻 Pedir la tela de la cama, en: 🧻 Ask for the bed's cloth}
      npc: vale
      location: adventurers_guild
      stages: [active]
      to_stage: active
      unless_item: guild_cloth      # ya la llevas
      unless_furniture: bed         # o ya la cosiste
      text:
        es: "Vale saca un fardo de tela del armario del gremio. «Para el colchón. Y no me la vendas, que la cuentan.»"
        en: "Vale pulls a bundle of cloth from the guild's cupboard. \"For the mattress. And do not sell it on me, they count these.\""
      effects:
        - give_item: {guild_cloth: 1}
  stages:
    locked:
      state: locked
      journal: {es: Vale habla de un cuarto libre en el piso de arriba., en: Vale mentions a free room upstairs.}
    active:
      journal:
        es: "Tu cuarto en el Gremio de Aventureros está vacío. Consigue madera (🪓 Talar en la Arboleda Antigua), asiérrala en el gremio y monta el cofre y la cama; la tela te la da Vale."
        en: "Your room at the Adventurers' Guild is empty. Get wood (🪓 Chop at the Elderwood Grove), saw it at the guild and build the chest and the bed; Vale gives you the cloth."
      location_text:
        adventurers_guild:
          es: "Arriba te espera un cuarto con una ventana y nada más. El puesto de aserrado está junto a ella."
          en: "Upstairs a room waits for you, with a window and nothing else. The sawing station is right by it."
        elderwood_grove:
          es: "Robles rectos, de los que dan buen tablón. Justo lo que tu cuarto necesita."
          en: "Straight oaks, the kind that give a good plank. Exactly what your room needs."
    done:
      state: completed
      journal:
        es: Tienes cama y cofre. Dormir en el gremio no te cuesta una moneda, y lo que no llevas encima te espera allí.
        en: You have a bed and a chest. Sleeping at the guild costs you nothing, and what you do not carry waits for you there.

tut_bats:
  order: 9
  tutorial: true
  giver: vale
  after: tut_room
  legacy_done: [night_wings]
  name: {es: Alas al anochecer, en: Wings at Dusk}
  summary:
    es: Cada anochecer, una bandada de murciélagos sale de la Mina del Paso Viejo y ataca al ganado del prado. Vale quiere cortarla de raíz, en su nido.
    en: Every dusk, a swarm of bats pours out of Old Pass Mine and attacks the meadow's livestock. Vale wants it stopped at the root, in its nest.
  hint:
    es: Ve a la Mina del Paso Viejo y en «⚒ Actividades» pulsa «🏹 Cazar» tres veces. Cuenta cualquier presa de las galerías (murciélagos o ratas), de día o de noche.
    en: Go to Old Pass Mine and in "⚒ Activities" press "🏹 Hunt" three times. Any prey in the tunnels counts (bats or rats), day or night.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: hunt, target: ironvein_mine, count: 3}
  rewards:
    - xp: 75
  stages:
    locked:
      state: locked
      journal: {es: Algo sale de la mina cuando oscurece., en: Something comes out of the mine after dark.}
    active:
      journal:
        es: "Limpia el nido: caza tres veces en la Mina del Paso Viejo."
        en: "Clear the nest: hunt three times in Old Pass Mine."
    done:
      state: completed
      journal:
        es: Las noches del prado vuelven a ser tranquilas. En la taberna ya se habla de ti.
        en: The meadow nights are quiet again. The tavern is already talking about you.

tut_chapel:
  order: 10
  tutorial: true
  giver: vale
  after: tut_bats
  legacy_done: [night_wings]
  name: {es: Heridas de guerra, en: Battle Scars}
  summary:
    es: «Nadie vuelve entero de ahí fuera», dice Vale. Antes de darte por listo, quiere que conozcas a la hermana Ysolde.
    en: "\"Nobody comes back whole from out there,\" says Vale. Before she calls you ready, she wants you to meet Sister Ysolde."
  hint:
    es: Ve a la Capilla del Alba y habla con la hermana Ysolde («⚒ Actividades» → «🙏 Curar heridas»; si no llevas con qué pagar, te atienden igual). Luego haz un «🛏️ Descanso largo» en las Actividades de la taberna, que devuelve la vida y los usos de tus habilidades. Después, vuelve con Vale.
    en: Go to the Chapel of the Dawn and talk to Sister Ysolde ("⚒ Activities" → "🙏 Cure wounds"; if you can't pay, they treat you anyway). Then take a "🛏️ Long rest" from the tavern's Activities, which restores your health and your abilities' uses. Then report back to Vale.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: ysolde}
    - {kind: rest, target: any}
    - {kind: talk, target: vale}
  rewards:
    - xp: 40
    - give_item: {healing_potion: 1}
    - set_flag: old_tusk_hunt
  stages:
    locked:
      state: locked
      journal: {es: Falta una última lección., en: One last lesson remains.}
    active:
      journal:
        es: Habla con la hermana Ysolde en la Capilla del Alba, descansa en la taberna y vuelve a informar a Vale.
        en: Talk to Sister Ysolde at the Chapel of the Dawn, rest at the tavern and report back to Vale.
    done:
      state: completed
      journal:
        es: "«Casi estás listo», dijo Vale. «Una última prueba: Bram, en la taberna, lleva años hablando de un jabalí que nadie ha podido abatir»."
        en: "\"You're almost ready,\" Vale said. \"One last test: Bram, at the tavern, has been talking for years about a boar nobody could bring down.\""

crypt_bones:
  order: 12
  giver: holt
  unlock_flag: crypt_unlocked
  name: {es: Huesos inquietos, en: Restless Bones}
  summary:
    es: Los soldados de Ser Aldren siguen montando guardia en la Cripta Hundida. Hay que dejarlos descansar.
    en: Ser Aldren's soldiers still stand guard in the Sunken Crypt. They must be laid to rest.
  hint:
    es: La entrada está en el Bosque de los Susurros. En el osario puedes descansar gratis antes del santuario.
    en: The entrance is in the Whispering Woods. You can rest for free in the ossuary before the sanctum.
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: kill, target: crypt_skeleton, count: 3}
  rewards:
    - xp: 300
    - give_item: {healing_potion: 2}
  stages:
    locked:
      state: locked
      journal: {es: Bajo el bosque hay una cripta sellada., en: A sealed crypt lies beneath the woods.}
    active:
      journal:
        es: Destruye a los esqueletos de la Cripta Hundida.
        en: Destroy the skeletons of the Sunken Crypt.
    done:
      state: completed
      journal:
        es: Los guardias de huesos han caído. Solo queda su señor, en el santuario.
        en: The bone guards have fallen. Only their lord remains, in the sanctum.

old_tusk:
  order: 10
  tutorial: true
  giver: bram
  after: tut_chapel
  name: {es: El Viejo Colmillo, en: Old Tusk}
  summary:
    es: Bram te cuenta la leyenda del jabalí que ningún cazador ha logrado abatir. Es la última prueba de Vale.
    en: Bram tells you the legend of the boar no hunter has ever brought down. It is Vale's last test.
  hint:
    es: "Descansa antes (vida y habilidades llenas) y ve al Prado de los Colmillos. En «⚒ Actividades», pulsa «🏹 Cazar»: el Viejo Colmillo te estará esperando. Lleva pociones."
    en: 'Rest first (full health and abilities) and go to Tusk Meadow. In "⚒ Activities", press "🏹 Hunt": Old Tusk will be waiting for you. Bring potions.'
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  turn_in_stage: told          # abatirlo no paga: hay que volver a contárselo a Bram
  complete_stage: done
  objectives:
    - {kind: kill, target: old_tusk}
  rewards:
    - xp: 300
  stages:
    locked:
      state: locked
      journal: {es: Una leyenda del prado espera a alguien digno., en: A meadow legend awaits someone worthy.}
    active:
      journal:
        es: Abate al Viejo Colmillo en el Prado de los Colmillos.
        en: Bring down Old Tusk in Tusk Meadow.
      location_text:
        tusk_meadow:
          es: La tierra tiembla. Unas huellas enormes cruzan el prado, más profundas que las de cualquier jabalí.
          en: The ground trembles. Huge tracks cross the meadow, deeper than any boar's.
    told:
      state: ready
      journal:
        es: "El Viejo Colmillo ha caído. Vuelve a La Corona Rota y cuéntaselo a Bram: te debe una recompensa."
        en: "Old Tusk is down. Go back to the Broken Crown and tell Bram: he owes you a reward."
    done:
      state: completed
      journal:
        es: "El Viejo Colmillo ha caído y su cabeza ya cuelga sobre la barra de La Corona Rota. Vale te da por formado. Bram baja la voz: «Dicen que en el Bosque de los Susurros desaparecen patrullas. Si encuentras algo, llévaselo al sargento Holt»."
        en: "Old Tusk has fallen and its head now hangs above the bar of the Broken Crown. Vale calls you trained. Bram lowers his voice: \"Word is patrols keep vanishing in the Whispering Woods. If you find anything, bring it to Sergeant Holt.\""

sealed_box:
  name: {es: El relicario sellado, en: The Sealed Reliquary}
  summary:
    es: Un mensajero de la Guardia de Plata desapareció en el Bosque de los Susurros con una caja que muchos quieren.
    en: A Silver Guard courier vanished in the Whispering Woods carrying a box many people want.
  order: 11
  giver: holt
  after: old_tusk
  start_stage: locked
  unlock_stage: not_started
  hint:
    es: Busca en el Bosque de los Susurros (por el Camino del Viejo Rey) y habla con el sargento Holt en la plaza.
    en: Search the Whispering Woods (via the Old King's Road) and talk to Sergeant Holt in the plaza.

  stages:
    locked:
      state: locked
      journal:
        es: Dicen que en el bosque pasan cosas raras. Primero, termina la instrucción de la sargenta Vale.
        en: Word is strange things happen in the woods. First, finish Sergeant Vale's training.
    not_started:
      state: available
      journal:
        es: Dicen en la taberna que las patrullas desaparecen cerca del Bosque de los Susurros.
        en: Tavern talk says patrols keep vanishing near the Whispering Woods.
      location_text:
        whispering_woods:
          es: >-
            A tu derecha oyes una respiración agitada. Una soldado herida, con los colores de la Guardia de Plata,
            intenta esconder una pequeña caja bajo su capa. «Por favor... no dejes que la encuentren».
          en: >-
            To your right you hear ragged breathing. A wounded soldier in Silver Guard colors tries to hide a small
            box under her cloak. "Please... don't let them find it."
    has_box:
      journal:
        es: >-
          Tienes el relicario sellado del soldado Edda. El sargento Holt lo busca; Mira, la encapuchada, pagaría
          bien por él. También podrías abrirlo tú mismo.
        en: >-
          You carry Private Edda's sealed reliquary. Sergeant Holt is looking for it; Mira, the hooded woman, would
          pay well for it. You could also open it yourself.
    returned_covenant:
      journal:
        es: Holt abrió el relicario y te entregó la llave de la Cripta Hundida. Debes dar descanso a su guardián.
        en: Holt opened the reliquary and gave you the key to the Sunken Crypt. You must lay its warden to rest.
    sold_syndicate:
      journal:
        es: Vendiste el relicario a Mira. Sus hombres ya bajan a la cripta... y no les gusta compartir.
        en: You sold the reliquary to Mira. Her crew is already heading into the crypt... and they don't like sharing.
    opened_box:
      journal:
        es: Dentro del relicario había una llave de bronce. Nadie sabe que la tienes. La cripta te espera.
        en: Inside the reliquary was a bronze key. No one knows you have it. The crypt awaits.
    completed_covenant:
      state: completed
      journal:
        es: Ser Aldren descansa al fin. El Pacto de Plata cantará tu nombre.
        en: Ser Aldren rests at last. The Silver Covenant will sing your name.
    completed_syndicate:
      state: completed
      journal:
        es: El guardián ha caído y el Sindicato saquea la cripta. Tú te llevaste tu parte.
        en: The warden has fallen and the Syndicate is looting the crypt. You took your share.
    completed_alone:
      state: completed
      journal:
        es: Derrotaste al guardián sin rendir cuentas a nadie. Lo que había en la cripta es tuyo.
        en: You defeated the warden without answering to anyone. What lay in the crypt is yours.

  actions:
    approach_guard:
      label: {es: 🩸 Acercarte al guardia herido, en: 🩸 Approach the wounded guard}
      location: whispering_woods
      stages: [not_started]
      text:
        es: Te arrodillas junto a la soldado. Se llama Edda y sangra demasiado. Te pone la caja en las manos.
        en: You kneel by the soldier. Her name is Edda and she is bleeding too much. She presses the box into your hands.
      check:
        skill: medicine
        tier: medium
        success_text:
          es: Detienes la hemorragia. Edda vivirá, y promete contarle a Holt lo que hiciste.
          en: You stop the bleeding. Edda will live, and she promises to tell Holt what you did.
        failure_text:
          es: Haces lo que puedes, pero sus ojos se apagan mientras susurra «Holt... dáselo a Holt».
          en: You do what you can, but her eyes go dim as she whispers "Holt... give it to Holt."
        success_effects:
          - set_flag: edda_saved
          - reputation: {silver_covenant: 5}
          - npc_memory: {npc: holt, importance: 4, text: "{name} saved Private Edda's life in the Whispering Woods."}
        failure_effects:
          - npc_memory: {npc: holt, importance: 3, text: "Private Edda died in the woods; {name} was with her at the end."}
      effects:
        - give_item: {sealed_reliquary: 1}
        - xp: 50
      to_stage: has_box

    give_box_holt:
      label: {es: 🛡️ Entregar el relicario a Holt, en: 🛡️ Hand the reliquary to Holt}
      npc: holt
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: >-
          Holt rompe el sello con reverencia y saca una llave de bronce. «La Cripta Hundida. Alguien debe bajar
          y terminar lo que Ser Aldren empezó. Toma esto: lo necesitarás».
        en: >-
          Holt breaks the seal with reverence and takes out a bronze key. "The Sunken Crypt. Someone must go down
          and finish what Ser Aldren began. Take these: you will need them."
      effects:
        - take_item: {sealed_reliquary: 1}
        - give_item: {healing_potion: 2}
        - gold: 40
        - xp: 100
        - reputation: {silver_covenant: 15, crimson_syndicate: -5}
        - set_flag: crypt_unlocked
        - npc_memory: {npc: holt, importance: 5, text: "{name} returned the sealed reliquary to the Silver Guard. Trustworthy."}
        - trust: {npc: holt, delta: 2}
      to_stage: returned_covenant

    sell_box_mira:
      label: {es: 🗝️ Vender el relicario a Mira, en: 🗝️ Sell the reliquary to Mira}
      npc: mira
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: >-
          Mira cuenta ciento veinte monedas sin mirarte. «Mis chicos bajarán esta noche. Si quieres tu parte del
          botín, ya sabes dónde está la cripta... bajo la hiedra del bosque».
        en: >-
          Mira counts out a hundred and twenty coins without looking at you. "My crew goes down tonight. If you
          want a share of the loot, you know where the crypt is... under the ivy in the woods."
      effects:
        - take_item: {sealed_reliquary: 1}
        - gold: 120
        - xp: 100
        - reputation: {crimson_syndicate: 15, silver_covenant: -10}
        - set_flag: crypt_unlocked
        - set_flag: syndicate_in_crypt
        - npc_memory: {npc: mira, importance: 5, text: "{name} sold me the Silver Guard reliquary. Useful, and not squeamish."}
        - trust: {npc: mira, delta: 2}
      to_stage: sold_syndicate

    open_box:
      label: {es: 🔓 Abrir el relicario tú mismo, en: 🔓 Open the reliquary yourself}
      stages: [has_box]
      requires_item: sealed_reliquary
      text:
        es: Examinas el cierre de plata. El sello está encantado, pero quizá un dedo hábil pueda sortearlo.
        en: You study the silver clasp. The seal is enchanted, but perhaps a deft finger can get around it.
      check:
        skill: sleight_of_hand
        tier: hard
        success_text:
          es: El cierre cede sin un sonido. Dentro hay una llave de bronce con el emblema de un caballero.
          en: The clasp gives way without a sound. Inside lies a bronze key bearing a knight's emblem.
        failure_text:
          es: El sello estalla en una llamarada fría que te muerde los dedos. La caja se abre igualmente.
          en: The seal bursts in a cold flare that bites your fingers. The box opens anyway.
        failure_effects:
          - damage: 1d6
      effects:
        - take_item: {sealed_reliquary: 1}
        - xp: 50
        - set_flag: crypt_unlocked
      to_stage: opened_box

  triggers:
    - event: defeat
      target: crypt_warden
      stages: [returned_covenant]
      to_stage: completed_covenant
      text:
        es: Ser Aldren baja la espada. «Una mano honesta...», susurra, y su armadura se derrumba vacía.
        en: Ser Aldren lowers his sword. "An honest hand...", he whispers, and his armor collapses, empty.
      effects:
        - gold: 100
        - xp: 300
        - set_flag: old_tusk_hunt
        - reputation: {silver_covenant: 20}
        - npc_memory: {npc: holt, importance: 5, text: "{name} laid the Crypt Warden to rest. A true friend of the Covenant."}
        - world_rumor: {es: "Dicen que {name} entró en la Cripta Hundida con la bendición del Pacto y dio descanso a Ser Aldren.", en: "They say {name} entered the Sunken Crypt with the Covenant's blessing and laid Ser Aldren to rest."}
    - event: defeat
      target: crypt_warden
      stages: [sold_syndicate]
      to_stage: completed_syndicate
      text:
        es: El guardián cae. Detrás de ti, los hombres de Mira ya están llenando sacos.
        en: The warden falls. Behind you, Mira's crew is already filling sacks.
      effects:
        - gold: 150
        - xp: 300
        - set_flag: old_tusk_hunt
        - reputation: {crimson_syndicate: 10}
        - npc_memory: {npc: mira, importance: 4, text: "{name} cleared the crypt for us. Worth keeping close."}
        - world_rumor: {es: "Corre la voz de que {name} abrió la Cripta Hundida para el Sindicato Carmesí.", en: "Word is that {name} cracked the Sunken Crypt open for the Crimson Syndicate."}
    - event: defeat
      target: crypt_warden
      stages: [locked, not_started, has_box, opened_box]
      to_stage: completed_alone
      text:
        es: El guardián se desploma. Nadie te vio bajar y nadie te verá salir con el tesoro.
        en: The warden crumbles. No one saw you go down and no one will see you leave with the treasure.
      effects:
        - gold: 80
        - xp: 300
        - set_flag: old_tusk_hunt
        - world_rumor: {es: "Alguien vio a {name} salir del bosque cubierto de polvo de tumba. Nadie sabe qué encontró.", en: "Someone saw {name} leave the woods covered in grave dust. No one knows what they found."}

camp_order:
  order: 20
  giver: vale
  after: tut_chapel
  name: {es: "Una entrega sospechosa", en: "A Suspicious Delivery"}
  summary:
    es: "Vale te enseña una orden del gremio que no cuadra con su libro. Hay una exploradora que quiere hablar con alguien nuevo."
    en: "Vale shows you a guild order that does not match her ledger. A scout wants to talk to someone new."
  hint:
    es: "Habla con Tamsin Harrow en el Gremio de Aventureros (de noche, en la taberna). Luego sal al Camino del Viejo Rey y derrota a dos bandidos: «🏹 Cazar» o lo que salga al viajar."
    en: "Talk to Tamsin Harrow at the Adventurers' Guild (at night, in the tavern). Then go out on the Old King's Road and beat two bandits: \"🏹 Hunt\" or whatever turns up on the way."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: talk, target: tamsin}
    - {kind: kill, target: bandit, count: 2}
  rewards:
    - {xp: 100}
    - {give_item: {leather_armor: 1}}
  stages:
    locked:
      state: locked
      journal:
        es: "Vale tiene algo que enseñarte."
        en: "Vale has something to show you."
    active:
      journal:
        es: "Vale te enseña una orden con el sello del gremio que no está en su libro. «Habla con Tamsin Harrow, la Linterna. Lleva dos años buscando justo esto.» Después, demuestra que sabes defenderte en el Camino del Viejo Rey."
        en: "Vale shows you an order stamped with the guild's seal that is not in her ledger. \"Talk to Tamsin Harrow, the Lantern. She has spent two years looking for exactly this.\" Then prove you can look after yourself on the Old King's Road."
      location_text:
        adventurers_guild:
          es: "Una mujer de pelo gris, con un farol de latón colgado del cinto aunque sea de día, estudia un mapa. Es Tamsin. 🗨️ Habla con ella."
          en: "A grey-haired woman with a brass lantern hanging from her belt even in daylight studies a map. That is Tamsin. 🗨️ Talk to her."
    done:
      state: completed
      journal:
        es: "Tamsin te escuchó sin interrumpir. «Un recluta que no ha sido señalado aún… justo lo que necesitaba», dijo, y te dio una armadura de cuero que había guardado. Tendrás que aprender a llevarla."
        en: "Tamsin heard you out without interrupting. \"A recruit who has not been marked yet… exactly what I needed,\" she said, and handed you a leather armor she had put aside. You will have to learn to wear it."

camp_gear:
  order: 21
  giver: tamsin
  after: camp_order
  name: {es: "Lo que se lleva puesto", en: "What You Wear"}
  summary:
    es: "Tamsin quiere ver que sabes vestir lo que cargas y que no sales sin pociones."
    en: "Tamsin wants to see that you can wear what you carry, and that you never leave without potions."
  hint:
    es: "Abre tu inventario (🎒) y equípate una pieza. Compra una poción de curación a Mira, en el mercado."
    en: "Open your inventory (🎒) and equip a piece of gear. Buy a healing potion from Mira at the market."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: equip, target: any}
    - {kind: buy, target: healing_potion}
  rewards:
    - {xp: 70}
    - {give_item: {smoke_bomb: 1}}
  stages:
    locked:
      state: locked
      journal:
        es: "Tamsin tiene otra lección."
        en: "Tamsin has another lesson."
    active:
      journal:
        es: "Equípate una pieza de equipo y compra una poción de curación en el mercado. «El camino no perdona a quien lleva el equipo en la mochila», dice Tamsin."
        en: "Equip a piece of gear and buy a healing potion at the market. \"The road does not forgive anyone who carries their gear in the pack,\" says Tamsin."
    done:
      state: completed
      journal:
        es: "Tamsin asiente al verte la armadura puesta y te da una bomba de humo: «Para el día que no puedas ganar. Sal siempre con una»."
        en: "Tamsin nods at the armor you now wear and hands you a smoke bomb: \"For the day you cannot win. Never leave without one.\""

camp_roof:
  order: 22
  giver: tamsin
  after: camp_gear
  name: {es: "Lo que se guarda", en: "What You Keep"}
  summary:
    es: "Un recluta que lo lleva todo encima tropieza. Tamsin te enseña a guardar y a recobrar el aliento."
    en: "A recruit who carries everything trips. Tamsin shows you how to stash things and catch your breath."
  hint:
    es: "En tu cuarto del Gremio, guarda un objeto en el cofre y vuelve a sacar algo (🗄️). Después toma un «💤 Descanso corto» en ⚒ Actividades."
    en: "In your room at the Guild, stash an item in the chest and take something out again (🗄️). Then take a \"💤 Short rest\" from ⚒ Activities."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: stash, target: any}
    - {kind: take, target: any}
    - {kind: short_rest, target: any}
  rewards:
    - {xp: 80}
    - {gold: 5}
  stages:
    locked:
      state: locked
      journal:
        es: "Tamsin quiere verte organizado."
        en: "Tamsin wants to see you organised."
    active:
      journal:
        es: "Guarda algo en el cofre de tu cuarto, vuelve a sacarlo y haz un descanso corto. «Un respiro a tiempo vale más que una poción», dice Tamsin."
        en: "Stash something in your room's chest, take it out again and take a short rest. \"A breather at the right time is worth more than a potion,\" says Tamsin."
      location_text:
        adventurers_guild:
          es: "Arriba está tu cuarto con el cofre. Los descansos cortos no cuestan nada: solo dos entre dos descansos largos."
          en: "Upstairs is your room with the chest. Short rests cost nothing: only two between long rests."
    done:
      state: completed
      journal:
        es: "Tu cuarto ya parece un cuarto. Tamsin te dice que lo de los descansos cortos se aprende a base de equivocarse… y de contar hasta dos."
        en: "Your room finally looks like a room. Tamsin says short rests are learned by getting them wrong… and by counting to two."

camp_trade_pick:
  order: 23
  giver: tamsin
  after: camp_roof
  name: {es: "Elige tu mano", en: "Choose Your Hand"}
  summary:
    es: "Toda orden falsa necesita manos que fabriquen lo que se mueve. Tamsin te pide que aprendas un oficio, el que quieras."
    en: "Every forged order needs hands that make what gets moved. Tamsin asks you to learn a trade, any trade."
  hint:
    es: "Ve al Barrio de Oficios y aprende uno de los oficios con su maestro (🛠️ Oficios). No importa cuál: tu clase no te obliga a ninguno."
    en: "Go to Craftsmen's Row and learn one of the trades from its master (🛠️ Professions). It does not matter which: your class forces none on you."
  start_stage: locked
  unlock_stage: active
  objective_stage: active
  complete_stage: done
  objectives:
    - {kind: learn_profession, target: any}
  rewards:
    - {xp: 100}
  stages:
    locked:
      state: locked
      journal:
        es: "Tamsin quiere saber qué sabes hacer con las manos."
        en: "Tamsin wants to know what you can do with your hands."
    active:
      journal:
        es: "Aprende un oficio con su maestro, en el Barrio de Oficios. Herrería, alquimia, carpintería, peletería, joyería, escribanía, ingeniería o sastrería: cualquiera sirve."
        en: "Learn a trade from its master on Craftsmen's Row. Blacksmithing, alchemy, carpentry, leatherworking, jewelcrafting, scribing, engineering or tailoring: any will do."
      location_text:
        crownreach_workshops:
          es: "Cada puesto es de un maestro. Entra en el que te llame y habla con él: 🛠️ Oficios."
          en: "Each stall belongs to a master. Step into the one that calls to you and talk to them: 🛠️ Professions."
    done:
      state: completed
      journal:
        es: "Ya tienes un oficio. Tamsin sonríe: «Ahora habrá que ganárselo»."
        en: "You have a trade now. Tamsin smiles: \"Now you will have to earn it.\""

camp_trade_alchemy:
  order: 24
  giver: ilva
  after: camp_trade_pick
  unlock_profession: alchemy
  name: {es: "Primeros encargos de alquimia", en: "First alchemy jobs"}
  summary:
    es: "Tu maestro te encarga tres tareas para ver si vales: fabricar dos pociones de curación, usarlo o venderlo."
    en: "Your master gives you three tasks to see if you are worth it: make two healing potions, then use or sell it."
  hint:
    es: "Ve al puesto de tu maestro en el Barrio de Oficios y pide las primeras lecciones. Fabrica dos pociones de curación y vende algo."
    en: "Go to your master's stall on Craftsmen's Row and ask for the first lessons. Make two healing potions and sell something."
  start_stage: locked
  unlock_stage: active
  objective_stage: working
  complete_stage: done
  objectives:
    - {kind: craft, target: healing_potion, count: 2}
    - {kind: sell, target: any}
  rewards:
    - {xp: 120}
    - {gold: 10}
  actions:
    start:
      label: {es: "🎓 Primeras lecciones de alquimia", en: "🎓 First lessons in alchemy"}
      npc: ilva
      location: alchemist_stall
      stages: [active]
      to_stage: working
      text:
        es: "Tu maestro te pone delante el material y un primer encargo: dos pociones de curación. «Hazlo despacio y bien; lo rápido ya vendrá.»"
        en: "Your master sets the material in front of you and a first job: two healing potions. \"Slow and right; fast comes later.\""
      effects:
        - {give_item: {bloodroot: 4, water_flask: 2}}
  stages:
    locked:
      state: locked
      journal:
        es: "Aún no practicas este oficio."
        en: "You do not practise this trade yet."
    active:
      journal:
        es: "Habla con tu maestro en su puesto y pide las primeras lecciones de alquimia."
        en: "Talk to your master at their stall and ask for the first alchemy lessons."
    working:
      journal:
        es: "Fabrica dos pociones de curación en la estación del puesto y vende algo a un mercader."
        en: "Make two healing potions at the stall's station and sell something to a merchant."
    done:
      state: completed
      journal:
        es: "Tu maestro examina tu trabajo y gruñe satisfecho. «Para ser el primero, no está mal»."
        en: "Your master looks over your work and grunts, satisfied. \"For a first, that is not bad.\""

camp_trade_blacksmithing:
  order: 25
  giver: tessa
  after: camp_trade_pick
  unlock_profession: blacksmithing
  name: {es: "Primeros encargos de herrería", en: "First blacksmithing jobs"}
  summary:
    es: "Tu maestro te encarga tres tareas para ver si vales: fabricar una espada de hierro, usarlo o venderlo."
    en: "Your master gives you three tasks to see if you are worth it: make an iron sword, then use or sell it."
  hint:
    es: "Ve al puesto de tu maestro en el Barrio de Oficios y pide las primeras lecciones. Fabrica una espada de hierro y equípatelo."
    en: "Go to your master's stall on Craftsmen's Row and ask for the first lessons. Make an iron sword and equip it."
  start_stage: locked
  unlock_stage: active
  objective_stage: working
  complete_stage: done
  objectives:
    - {kind: craft, target: iron_sword}
    - {kind: equip, target: any}
  rewards:
    - {xp: 120}
    - {gold: 10}
  actions:
    start:
