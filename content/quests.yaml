  rewards:
    - {xp: 130}
  stages:
    locked:
      state: locked
      journal:
        es: "Tamsin sospecha de los caminos."
        en: "Tamsin distrusts the roads."
    active:
      journal:
        es: "Caza o rastrea dos veces fuera de la ciudad y fíjate en las huellas."
        en: "Hunt or track twice outside the city and pay attention to the tracks."
    done:
      state: completed
      journal:
        es: "«Cuatro ruedas, carga pesada y nada de mulas», resume Tamsin. «No es un carro de granja»."
        en: "\"Four wheels, a heavy load and no mules,\" Tamsin sums up. \"That is no farm cart.\""

