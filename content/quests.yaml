  summary:
    es: "Hay huellas de carros donde no debería haber carros. Tamsin quiere que aprendas a leerlas."
    en: "There are cart tracks where no carts should be. Tamsin wants you to learn to read them."
  hint:
    es: "Caza o rastrea dos veces en el Camino del Viejo Rey o en el Prado de los Colmillos («🏹 Cazar», «🐾 Rastrear»)."
    en: "Hunt or track twice on the Old King's Road or in Tusk Meadow (\"🏹 Hunt\", \"🐾 Track\")."
