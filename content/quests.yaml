  order: 41
  giver: tamsin
  after: camp_tracks
  name: {es: "Hierbas para el camino", en: "Herbs for the Road"}
  summary:
    es: "Antes de seguir los carros hacen falta provisiones. Tamsin te manda a por raíz de sangre y a por agua."
    en: "Before following the carts you need supplies. Tamsin sends you for bloodroot and water."
  hint:
    es: "Recoge raíz de sangre (⚒ Actividades en el Bosque de los Susurros o el Claro de Raíz Roja) y compra dos cantimploras a Mira."
    en: "Gather bloodroot (⚒ Activities in the Whispering Woods or Redroot Clearing) and buy two water flasks from Mira."
