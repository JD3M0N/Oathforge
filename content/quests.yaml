      state: locked
      journal:
        es: "Falta preparar el viaje."
        en: "The trip still needs preparing."
    active:
      journal:
        es: "Reúne seis raíces de sangre y dos cantimploras para las pociones del camino."
        en: "Collect six bloodroots and two water flasks for the road's potions."
    done:
      state: completed
      journal:
        es: "Tamsin guarda las hierbas como si fueran oro. «Con esto sobrevivimos a un par de emboscadas»."
        en: "Tamsin stores the herbs as if they were gold. \"This gets us through a couple of ambushes.\""

