# Formas que puede tomar el héroe (Cambiaformas). Sustituyen los ataques y dan una reserva ACOTADA de PV temporales
# la primera vez que se toman en un combate: alternar no cura. Cifras semilla (B12).

bear:
  name: {es: Forma de oso, en: Bear form}
  description: {es: "Aguantas y golpeas fuerte: zarpazos pesados y una piel que encaja los golpes.", en: "You endure and hit hard: heavy claws and a hide that soaks up blows."}
  icon: "🐻"
  ac_bonus: 1
  temp_hp: 6
  temp_hp_per_level: 3
  attacks:
    - {name: {es: Zarpazo, en: Claws}, damage: 1d8, damage_type: slashing, ability: str}

panther:
  name: {es: Forma de pantera, en: Panther form}
  description: {es: "Rápida y letal: dos mordiscos veloces, a costa de aguantar menos.", en: "Fast and deadly: quick bites, at the cost of enduring less."}
  icon: "🐆"
  ac_bonus: 0
  temp_hp: 3
  temp_hp_per_level: 1
  attacks:
    - {name: {es: Mordisco, en: Bite}, damage: 1d10, damage_type: piercing, ability: dex}

treant:
  name: {es: Forma de ent, en: Treant form}
  description: {es: "Un tronco vivo: golpeas despacio, pero casi nada te mueve.", en: "A living trunk: you hit slowly, but almost nothing moves you."}
  icon: "🌳"
  ac_bonus: 3
  temp_hp: 8
  temp_hp_per_level: 4
  attacks:
    - {name: {es: Porrazo, en: Slam}, damage: 1d10, damage_type: bludgeoning, ability: str}

primal_beast:
  name: {es: Forma de bestia primigenia, en: Primal beast form}
  description: {es: "El animal que dio origen a todos: garra, colmillo y una piel que no se rinde.", en: "The animal that begat all others: claw, fang and a hide that never yields."}
  icon: "🦁"
  ac_bonus: 2
  temp_hp: 10
  temp_hp_per_level: 5
  attacks:
    - {name: {es: Garra primigenia, en: Primal claw}, damage: 2d8, damage_type: slashing, ability: str}
