paladin:
  name: {es: Paladín, en: Paladin}
  description:
    es: Combatiente de primera línea con armadura pesada, juramentos y magia sagrada.
    en: Front-line fighter in heavy armor, bound by oaths and holy magic.
  hit_die: 10
  primary: str
  array: {str: 15, con: 14, cha: 13, wis: 12, dex: 10, int: 8}
  skills: [athletics, persuasion]
  items: {longsword: 1, chain_mail: 1, shield: 1, healing_potion: 1}
  equip: [longsword, chain_mail, shield]
  signature: [consecrated_strike]
  abilities:
    consecrated_strike:
      name: {es: Golpe Consagrado, en: Consecrated Strike}
      description: {es: Un ataque con arma que añade 1d8 de daño radiante., en: A weapon attack that adds 1d8 radiant damage.}
      level: 1
      kind: strike
      uses: 2
      extra_damage: 1d8
      damage_type: radiant
      details:
        es: Invocas tu juramento al golpear y el arma arde con luz sagrada. Es tu ataque normal con el arma, pero si acierta suma 1d8 de daño radiante, que hace el doble a los no muertos que temen la luz. Guárdalo para el enemigo que importa.
        en: You call on your oath as you strike and the weapon burns with holy light. It is your normal weapon attack, but on a hit it adds 1d8 radiant damage, which hits twice as hard on undead that fear the light. Save it for the enemy that matters.
    lay_on_hands:
      name: {es: Imposición de Manos, en: Lay on Hands}
      description: {es: "Acción adicional: recuperas 5 PV por nivel.", en: "Bonus action: recover 5 HP per level."}
      level: 2
      kind: heal
      action: bonus
      uses: 1
      heal_per_level: 5
      details:
        es: Posas las manos sobre tus heridas y el juramento las cierra. Como es una acción adicional, puedes curarte y atacar en el mismo turno. A nivel 2 recuperas 10 PV; a nivel 5, 25. Se recarga con un descanso.
        en: You lay your hands on your wounds and your oath closes them. As a bonus action, you can heal and attack in the same turn. At level 2 you recover 10 HP; at level 5, 25. It recharges with a rest.
    aura_of_resolve:
      name: {es: Aura de Resolución, en: Aura of Resolve}
      description: {es: "+1 a la CA e inmunidad al miedo.", en: "+1 AC and immunity to fear."}
      level: 3
      kind: passive
      action: none
      ac_bonus: 1
      immune: [frightened]
      details:
        es: Tu fe es una muralla. Siempre activa, sin gastar acciones, te da +1 a la CA y hace que el miedo no te afecte, ni el de los gritos de un espectro ni el de un conjuro.
        en: Your faith is a wall. Always on, with no action needed, it gives you +1 AC and makes you immune to fear, whether from a spectre's wail or a spell.
    extra_attack:
      name: {es: Ataque Extra, en: Extra Attack}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: "Años de juramento y entrenamiento hacen que tu brazo no descanse. Cuando atacas con el arma, golpeas dos veces en la misma acción, cada golpe con su tirada. Combínalo con Golpe Consagrado: el daño radiante se suma al golpe que acierte."
        en: "Years of oath and training keep your arm from resting. When you attack with your weapon, you strike twice in the same action, each with its own roll. Pair it with Consecrated Strike: the radiant damage joins the blow that lands."
      level: 5
      kind: passive
      action: none
      extra_attack: true
  specializations:
    vengeance: {es: Juramento de Venganza, en: Oath of Vengeance}
    protection: {es: Guardián Sagrado, en: Sacred Guardian}
    redemption: {es: Redentor, en: Redeemer}
    inquisition: {es: Inquisidor, en: Inquisitor}

rogue:
  name: {es: Pícaro, en: Rogue}
  description:
    es: Ágil y astuto, golpea donde más duele y desaparece antes de la respuesta.
    en: Quick and cunning, strikes where it hurts and is gone before the answer.
  hit_die: 8
  primary: dex
  array: {dex: 15, con: 14, wis: 13, cha: 12, int: 10, str: 8}
  skills: [sleight_of_hand, perception]
  items: {dagger: 1, shortbow: 1, leather_armor: 1, healing_potion: 1}
  equip: [dagger, shortbow, leather_armor]
  signature: [cunning_hide]
  abilities:
    sneak_attack:
      name: {es: Ataque Furtivo, en: Sneak Attack}
      description:
        es: Una vez por turno, daño extra con armas sutiles o a distancia si tienes ventaja o el objetivo sufre un estado.
        en: Once per turn, extra damage with finesse or ranged weapons when you have advantage or the target has a condition.
      details:
        es: "Sabes dónde duele. Una vez por turno, si atacas con un arma sutil (daga, estoque) o a distancia y tienes ventaja, o el objetivo está aturdido, envenenado, dormido o con otro estado, sumas dados de daño extra. Esconderte antes es la forma más fiable de conseguirlo."
        en: "You know where it hurts. Once per turn, if you attack with a finesse weapon (dagger, rapier) or a ranged one and you have advantage, or the target is stunned, poisoned, asleep or under another condition, you add extra damage dice. Hiding first is the surest way to get it."
      level: 1
      kind: passive
      action: none
      sneak_dice: {1: 1, 3: 2, 5: 3}
    cunning_hide:
      name: {es: Esconderse, en: Hide}
      description: {es: "Acción adicional: tirada de Sigilo; si tienes éxito, tu próximo ataque tiene ventaja.", en: "Bonus action: Stealth roll; on success your next attack has advantage."}
      details:
        es: "Te fundes con las sombras sin perder el ritmo. Como acción adicional haces una tirada de Sigilo; si la superas, tu próximo ataque tiene ventaja, y con ventaja llega el Ataque Furtivo. No tiene usos: puedes hacerlo cada turno."
        en: "You melt into the shadows without losing your stride. As a bonus action you make a Stealth roll; if it succeeds, your next attack has advantage, and with advantage comes Sneak Attack. It has no uses: you can do it every turn."
      level: 1
      kind: hide
      action: bonus
    uncanny_dodge:
      name: {es: Esquiva Asombrosa, en: Uncanny Dodge}
      description: {es: El primer golpe que recibes cada ronda hace la mitad de daño., en: The first hit you take each round deals half damage.}
      details:
        es: "Ves venir el golpe y te apartas lo justo. El primer ataque que te acierta en cada ronda te hace solo la mitad de daño. Es automático: no gasta acciones."
        en: "You see the blow coming and step aside just enough. The first attack that hits you each round deals only half damage. It is automatic: it costs no action."
      level: 3
      kind: passive
      action: none
      halve_first_hit: true
  specializations:
    assassin: {es: Asesino, en: Assassin}
    spy: {es: Espía, en: Spy}
    duelist: {es: Duelista, en: Duelist}
    trapper: {es: Trampero, en: Trapper}

warrior:
  name: {es: Guerrero, en: Warrior}
  description:
    es: Maestro de las armas y la armadura; aguanta en primera línea y remata cuando cuenta.
    en: Master of arms and armor; holds the front line and finishes the fight when it counts.
  hit_die: 10
  primary: str
  array: {str: 15, con: 14, dex: 13, wis: 12, cha: 10, int: 8}
  skills: [athletics, intimidation]
  items: {warhammer: 1, handaxe: 1, chain_mail: 1, shield: 1, healing_potion: 1}
  equip: [warhammer, handaxe, chain_mail, shield]
  signature: [action_surge, second_wind]
  abilities:
    second_wind:
      name: {es: Segundo Aliento, en: Second Wind}
      description: {es: "Acción adicional: recuperas 1d10 + tu nivel en PV.", en: "Bonus action: recover 1d10 + your level in HP."}
      details:
        es: "Respiras hondo y te obligas a seguir. Como acción adicional recuperas 1d10 + tu nivel en PV, así que puedes curarte y atacar en el mismo turno. Un uso por descanso: guárdalo para cuando la pelea se tuerza."
        en: "You take a deep breath and force yourself on. As a bonus action you recover 1d10 + your level in HP, so you can heal and attack in the same turn. One use per rest: keep it for when the fight turns."
      level: 1
      kind: heal
      action: bonus
      uses: 1
      heal_dice: 1d10
      heal_add: level
    defense_style:
      name: {es: "Estilo de combate: Defensa", en: "Fighting Style: Defense"}
      description: {es: "+1 a la CA.", en: "+1 AC."}
      details:
        es: "Te entrenaron para no dejar huecos en la guardia. Siempre tienes +1 a la CA, sin hacer nada."
        en: "You were trained to leave no gaps in your guard. You always have +1 AC, with no action needed."
      level: 1
      kind: passive
      action: none
      ac_bonus: 1
    action_surge:
      name: {es: Oleada de Acción, en: Action Surge}
      description: {es: "Acción adicional, tras usar tu acción: recuperas la acción y puedes actuar otra vez.", en: "Bonus action, after using your action: you get your action back and can act again."}
      details:
        es: "Cuando la batalla lo exige, sacas fuerzas de donde no hay. Después de usar tu acción, gastas tu acción adicional en recuperarla y vuelves a actuar: dos ataques, o atacar y beber una poción. Un uso por descanso."
        en: "When the battle demands it, you find strength from nowhere. After using your action, you spend your bonus action to get it back and act again: two attacks, or attack and drink a potion. One use per rest."
      level: 2
      kind: surge
      action: bonus
      uses: 1
    improved_critical:
      name: {es: Crítico Mejorado, en: Improved Critical}
      description: {es: Tus ataques son críticos con 19 o 20., en: Your attacks score a critical hit on a 19 or 20.}
      details:
        es: "Conoces los puntos débiles de cualquier armadura. Tus ataques son críticos con un 19 o un 20 natural, y un crítico dobla los dados de daño."
        en: "You know the weak points of any armor. Your attacks are critical hits on a natural 19 or 20, and a critical doubles the damage dice."
      level: 3
      kind: passive
      action: none
      crit_range: 19
    extra_attack:
      name: {es: Ataque Extra, en: Extra Attack}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: "La disciplina de mil combates hace que tu arma no se detenga. Cuando atacas, golpeas dos veces en la misma acción, cada golpe con su tirada."
        en: "The discipline of a thousand fights keeps your weapon moving. When you attack, you strike twice in the same action, each with its own roll."
      level: 5
      kind: passive
      action: none
      extra_attack: true
  specializations:
    champion: {es: Campeón, en: Champion}
    battle_master: {es: Maestro de Batalla, en: Battle Master}
    guardian: {es: Guardián, en: Guardian}
    berserker: {es: Berserker, en: Berserker}

priest:
  name: {es: Sacerdote, en: Priest}
  description:
    es: Canaliza la luz de su fe para sanar a los suyos y abrasar a los no-muertos.
    en: Channels the light of their faith to heal allies and sear the undead.
  hit_die: 8
  primary: wis
  casting: wis
  array: {wis: 15, con: 14, str: 13, dex: 12, cha: 10, int: 8}
  skills: [medicine, religion]
  items: {mace: 1, scale_mail: 1, shield: 1, healing_potion: 1}
  equip: [mace, scale_mail, shield]
  signature: [sacred_flame]
  abilities:
    sacred_flame:
      name: {es: Llama Sagrada, en: Sacred Flame}
      description: {es: "Ataque de conjuro a distancia (SAB): 1d8 de daño radiante. Ilimitado.", en: "Ranged spell attack (WIS): 1d8 radiant damage. Unlimited."}
      details:
        es: "Una llama de luz cae sobre el enemigo desde lo alto. Es un ataque de conjuro a distancia con tu SAB que hace 1d8 de daño radiante, el doble contra no muertos. No tiene usos: es tu ataque de siempre."
        en: "A flame of light falls on the enemy from above. It is a ranged spell attack with your WIS that deals 1d8 radiant damage, double against undead. It has no uses: it is your everyday attack."
      level: 1
      kind: spell
      damage: 1d8
      damage_type: radiant
    healing_word:
      name: {es: Palabra Sanadora, en: Healing Word}
      description: {es: "Acción adicional: recuperas 2d4 + SAB PV.", en: "Bonus action: recover 2d4 + WIS HP."}
      details:
        es: "Una palabra de tu fe basta para cerrar heridas. Como acción adicional recuperas 2d4 + SAB PV, y te queda la acción para atacar. Dos usos por descanso."
        en: "A word of your faith is enough to close wounds. As a bonus action you recover 2d4 + WIS HP, and you keep your action to attack. Two uses per rest."
      level: 1
      kind: heal
      action: bonus
      uses: 2
      heal_dice: 2d4
      heal_add: casting
    turn_undead:
      name: {es: Expulsar No-muertos, en: Turn Undead}
      description: {es: "Todos los no-muertos enemigos sufren 2d6 de daño radiante y quedan aturdidos un turno.", en: "Every undead enemy takes 2d6 radiant damage and is stunned for a turn."}
      details:
        es: "Alzas tu símbolo sagrado y los muertos recuerdan que deberían estar quietos. Todos los no muertos enemigos reciben 2d6 de daño radiante y quedan aturdidos un turno. Contra cualquier otra criatura no hace nada: úsalo en la cripta."
        en: "You raise your holy symbol and the dead remember they should lie still. Every undead enemy takes 2d6 radiant damage and is stunned for a turn. Against any other creature it does nothing: use it in the crypt."
      level: 2
      kind: turn
      uses: 1
      damage: 2d6
      damage_type: radiant
      status: stunned
      status_turns: 1
      targets_type: undead
    bless:
      name: {es: Bendición, en: Bless}
      description: {es: "+2 a tus tiradas de ataque durante 3 turnos.", en: "+2 to your attack rolls for 3 turns."}
      details:
        es: "Tu dios guía tu mano. Durante 3 turnos sumas +2 a tus tiradas de ataque. Úsalo al principio de una pelea larga para sacarle todo el partido."
        en: "Your god guides your hand. For 3 turns you add +2 to your attack rolls. Use it at the start of a long fight to get the most out of it."
      level: 3
      kind: buff
      uses: 1
      status: blessed
      status_turns: 3
    divine_strike:
      name: {es: Golpe Divino, en: Divine Strike}
      description: {es: "Una vez por turno, tus golpes con arma cuerpo a cuerpo añaden 1d8 de daño radiante.", en: "Once per turn, your melee weapon hits add 1d8 radiant damage."}
      details:
        es: "Tu arma lleva la marca de tu dios. Una vez por turno, cuando aciertas con un arma cuerpo a cuerpo, sumas 1d8 de daño radiante. Es automático."
        en: "Your weapon bears your god's mark. Once per turn, when you hit with a melee weapon, you add 1d8 radiant damage. It is automatic."
      level: 5
      kind: passive
      action: none
      bonus_damage: 1d8
      bonus_damage_type: radiant
  specializations:
    life: {es: Dominio de la Vida, en: Life Domain}
    light: {es: Dominio de la Luz, en: Light Domain}
    war: {es: Dominio de la Guerra, en: War Domain}
    grave: {es: Dominio de la Tumba, en: Grave Domain}

mage:
  name: {es: Mago, en: Mage}
  description:
    es: Erudito de lo arcano; frágil de cerca, devastador a distancia con fuego y hechizos de control.
    en: A scholar of the arcane; frail up close, devastating from afar with fire and control spells.
  hit_die: 6
  primary: int
  casting: int
  array: {int: 15, con: 14, dex: 13, wis: 12, cha: 10, str: 8}
  skills: [arcana, history]
  items: {quarterstaff: 1, dagger: 1, healing_potion: 1}
  equip: [quarterstaff]
  signature: [fire_bolt]
  abilities:
    fire_bolt:
      name: {es: Rayo de Fuego, en: Fire Bolt}
      description: {es: "Ataque de conjuro a distancia (INT): 1d10 de daño de fuego. Ilimitado.", en: "Ranged spell attack (INT): 1d10 fire damage. Unlimited."}
      details:
        es: "Una chispa en la punta de los dedos que estalla en llamas. Es un ataque de conjuro a distancia con tu INT que hace 1d10 de daño de fuego. No tiene usos: es tu ataque de siempre, también desde la retaguardia."
        en: "A spark at your fingertips that bursts into flame. It is a ranged spell attack with your INT that deals 1d10 fire damage. It has no uses: it is your everyday attack, from the back row too."
      level: 1
      kind: spell
      damage: 1d10
      damage_type: fire
    mage_armor:
      name: {es: Armadura de Mago, en: Mage Armor}
      description: {es: "+3 a la CA si no llevas armadura.", en: "+3 AC while you wear no armor."}
      details:
        es: "Una fuerza invisible te envuelve como una coraza. Si no llevas armadura, tienes +3 a la CA siempre, sin gastar acciones."
        en: "An invisible force wraps you like a breastplate. If you wear no armor, you always have +3 AC, with no action needed."
      level: 1
      kind: passive
      action: none
      ac_bonus_unarmored: 3
    sleep:
      name: {es: Dormir, en: Sleep}
      description: {es: "Un enemigo hace una salvación de SAB; si falla, se duerme 2 turnos (ventaja contra él; despierta al recibir daño).", en: "One enemy makes a WIS save; on a failure it falls asleep for 2 turns (advantage against it; it wakes when damaged)."}
      details:
        es: "Un susurro y los párpados del enemigo pesan como el plomo. Hace una salvación de SAB; si falla, se duerme 2 turnos: no actúa y tus ataques tienen ventaja, pero despierta si recibe daño. Dos usos por descanso."
        en: "A whisper and the enemy's eyelids weigh like lead. It makes a WIS save; on a failure it falls asleep for 2 turns: it does not act and your attacks have advantage, but it wakes up if it takes damage. Two uses per rest."
      level: 2
      kind: save
      uses: 2
      save: wis
      status: asleep
      status_turns: 2
    fireball:
      name: {es: Bola de Fuego, en: Fireball}
      description: {es: "Toda la fila del objetivo hace una salvación de DES: 3d6 de fuego, la mitad si la supera.", en: "The target's whole row makes a DEX save: 3d6 fire, half on a success."}
      details:
        es: "Una perla de fuego que vuela hasta el enemigo y revienta. Toda su fila hace una salvación de DES: 3d6 de daño de fuego, la mitad si la supera. Ideal contra grupos en primera línea. Un uso por descanso."
        en: "A bead of fire that flies to the enemy and bursts. Its whole row makes a DEX save: 3d6 fire damage, half on a success. Ideal against groups in the front line. One use per rest."
      level: 3
      kind: save
      uses: 1
      area: row
      save: dex
      damage: 3d6
      damage_type: fire
      half_on_save: true
    magic_missile:
      name: {es: Proyectil Mágico, en: Magic Missile}
      description: {es: "Tres dardos que nunca fallan: 3d4+3 de daño de fuerza.", en: "Three darts that never miss: 3d4+3 force damage."}
      details:
        es: "Tres dardos de luz que buscan su blanco solos. No hay tirada: siempre aciertan y hacen 3d4+3 de daño de fuerza. Perfecto para rematar a un enemigo con CA alta. Dos usos por descanso."
        en: "Three darts of light that find their mark on their own. There is no roll: they always hit and deal 3d4+3 force damage. Perfect to finish off an enemy with high AC. Two uses per rest."
      level: 5
      kind: spell
      uses: 2
      auto_hit: true
      damage: 3d4+3
      damage_type: force
  specializations:
    pyromancer: {es: Piromante, en: Pyromancer}
    cryomancer: {es: Criomante, en: Cryomancer}
    arcanist: {es: Arcanista, en: Arcanist}
    chronomancer: {es: Cronomante, en: Chronomancer}

druid:
  name: {es: Druida, en: Druid}
  description:
    es: Guardián de lo salvaje; enreda a sus enemigos, cura con la savia del bosque y adopta forma de bestia.
    en: Keeper of the wild; entangles foes, heals with the forest's sap and takes the shape of a beast.
  hit_die: 8
  primary: wis
  casting: wis
  array: {wis: 15, con: 14, dex: 13, int: 12, cha: 10, str: 8}
  skills: [survival, medicine]
  items: {quarterstaff: 1, leather_armor: 1, shield: 1, healing_potion: 1}
  equip: [quarterstaff, leather_armor, shield]
  signature: [thorn_whip]
  abilities:
    thorn_whip:
      name: {es: Látigo de Espinas, en: Thorn Whip}
      description: {es: "Ataque de conjuro a distancia (SAB): 1d6 de daño perforante. Ilimitado.", en: "Ranged spell attack (WIS): 1d6 piercing damage. Unlimited."}
      details:
        es: "Un látigo de enredaderas con espinas brota de tu mano. Es un ataque de conjuro a distancia con tu SAB que hace 1d6 de daño perforante. No tiene usos."
        en: "A whip of thorny vines springs from your hand. It is a ranged spell attack with your WIS that deals 1d6 piercing damage. It has no uses."
      level: 1
      kind: spell
      damage: 1d6
      damage_type: piercing
    cure_wounds:
      name: {es: Curar Heridas, en: Cure Wounds}
      description: {es: "Recuperas 1d8 + SAB PV.", en: "Recover 1d8 + WIS HP."}
      details:
        es: "La savia de la tierra cierra tus heridas. Usas tu acción para recuperar 1d8 + SAB PV. Dos usos por descanso."
        en: "The sap of the earth closes your wounds. You use your action to recover 1d8 + WIS HP. Two uses per rest."
      level: 1
      kind: heal
      uses: 2
      heal_dice: 1d8
      heal_add: casting
    entangle:
      name: {es: Enredar, en: Entangle}
      description: {es: "Toda la fila del objetivo hace una salvación de DES; quien falla queda enredado 2 turnos (ventaja contra él, desventaja en sus ataques).", en: "The target's whole row makes a DEX save; those who fail are entangled for 2 turns (advantage against them, disadvantage on their attacks)."}
      details:
        es: "Las raíces brotan del suelo y atrapan a todo lo que pisa. Toda la fila del objetivo hace una salvación de DES; quien falla queda enredado 2 turnos: tus ataques tienen ventaja contra él y él ataca con desventaja. Un uso por descanso."
        en: "Roots burst from the ground and seize everything on it. The target's whole row makes a DEX save; whoever fails is restrained for 2 turns: your attacks have advantage against it and it attacks with disadvantage. One use per rest."
      level: 2
      kind: save
      uses: 1
      area: row
      save: dex
      status: restrained
      status_turns: 2
    wild_shape:
      name: {es: Forma Salvaje, en: Wild Shape}
      description: {es: "Acción adicional: adoptas forma de oso y ganas 2d8 + tu nivel en PV temporales.", en: "Bonus action: you take the shape of a bear and gain 2d8 + your level in temporary HP."}
      details:
        es: "Tu cuerpo crece y se cubre de pelo: eres un oso. Como acción adicional ganas 2d8 + tu nivel en PV temporales, que se pierden antes que los tuyos. Un uso por descanso."
        en: "Your body grows and is covered in fur: you are a bear. As a bonus action you gain 2d8 + your level in temporary HP, lost before your own. One use per rest."
      level: 3
      kind: buff
      action: bonus
      uses: 1
      temp_hp: 2d8
      heal_add: level
      status: wild_shape
      status_turns: 3
    elemental_fury:
      name: {es: Furia Elemental, en: Elemental Fury}
      description: {es: Sumas tu SAB al daño de tus conjuros., en: You add your WIS to the damage of your spells.}
      details:
        es: "La naturaleza responde con rabia a tu llamada. Sumas tu SAB al daño de tus conjuros de ataque. Es automático."
        en: "Nature answers your call with fury. You add your WIS to the damage of your attack spells. It is automatic."
      level: 5
      kind: passive
      action: none
      spell_damage_bonus: true
  specializations:
    shapeshifter: {es: Cambiaformas, en: Shapeshifter}
    warden: {es: Guardián, en: Warden}
    summoner: {es: Invocador, en: Summoner}
    spores: {es: Esporas, en: Spores}

bard:
  name: {es: Bardo, en: Bard}
  description:
    es: Su voz es un arma; inspira, cura y desarma al enemigo con una burla o una melodía hipnótica.
    en: Their voice is a weapon; they inspire, heal and undo foes with a jest or a hypnotic melody.
  hit_die: 8
  primary: cha
  casting: cha
  array: {cha: 15, dex: 14, con: 13, wis: 12, int: 10, str: 8}
  skills: [persuasion, deception]
  items: {rapier: 1, dagger: 1, leather_armor: 1, healing_potion: 1}
  equip: [rapier, leather_armor]
  signature: [vicious_mockery]
  abilities:
    vicious_mockery:
      name: {es: Burla Cruel, en: Vicious Mockery}
      description: {es: "Un enemigo hace una salvación de SAB: si falla, 1d4 de daño psíquico y miedo 1 turno. Ilimitado.", en: "One enemy makes a WIS save: on a failure, 1d4 psychic damage and fear for 1 turn. Unlimited."}
      details:
        es: "Una burla tan cruel que duele de verdad. El enemigo hace una salvación de SAB; si falla, recibe 1d4 de daño psíquico y queda con miedo un turno (ataca con desventaja). No tiene usos."
        en: "A taunt so cruel it really hurts. The enemy makes a WIS save; on a failure it takes 1d4 psychic damage and is frightened for a turn (it attacks with disadvantage). It has no uses."
      level: 1
      kind: save
      save: wis
      damage: 1d4
      damage_type: psychic
      status: frightened
      status_turns: 1
    bardic_inspiration:
      name: {es: Inspiración Bárdica, en: Bardic Inspiration}
      description: {es: "Acción adicional: tu próxima tirada de ataque suma 1d6.", en: "Bonus action: your next attack roll adds 1d6."}
      details:
        es: "Una nota que te recuerda por qué luchas. Como acción adicional, tu próxima tirada de ataque suma 1d6. Dos usos por descanso."
        en: "A note that reminds you why you fight. As a bonus action, your next attack roll adds 1d6. Two uses per rest."
      level: 1
      kind: buff
      action: bonus
      uses: 2
      status: inspired
      status_turns: 3
    song_of_healing:
      name: {es: Canción Sanadora, en: Song of Healing}
      description: {es: "Acción adicional: recuperas 1d4 + CAR PV.", en: "Bonus action: recover 1d4 + CHA HP."}
      details:
        es: "Una canción suave que calma el dolor. Como acción adicional recuperas 1d4 + CAR PV, y te queda la acción. Dos usos por descanso."
        en: "A soft song that eases the pain. As a bonus action you recover 1d4 + CHA HP, and you keep your action. Two uses per rest."
      level: 2
      kind: heal
      action: bonus
      uses: 2
      heal_dice: 1d4
      heal_add: casting
    hypnotic_pattern:
      name: {es: Patrón Hipnótico, en: Hypnotic Pattern}
      description: {es: "Toda la fila del objetivo hace una salvación de SAB; quien falla queda aturdido 1 turno.", en: "The target's whole row makes a WIS save; those who fail are stunned for 1 turn."}
      details:
        es: "Luces de colores giran en el aire y nadie puede apartar la mirada. Toda la fila del objetivo hace una salvación de SAB; quien falla queda aturdido un turno. Un uso por descanso."
        en: "Colored lights whirl in the air and no one can look away. The target's whole row makes a WIS save; whoever fails is stunned for a turn. One use per rest."
      level: 3
      kind: save
      uses: 1
      area: row
      save: wis
      status: stunned
      status_turns: 1
    cutting_words:
      name: {es: Palabras Cortantes, en: Cutting Words}
      description: {es: El primer golpe que recibes cada ronda hace la mitad de daño., en: The first hit you take each round deals half damage.}
      details:
        es: "Una palabra a tiempo hace que el golpe del enemigo pierda fuerza. El primer ataque que te acierta en cada ronda te hace la mitad de daño. Es automático."
        en: "A well-timed word makes the enemy's blow lose its strength. The first attack that hits you each round deals half damage. It is automatic."
      level: 5
      kind: passive
      action: none
      halve_first_hit: true
  specializations:
    illusionist: {es: Ilusionista, en: Illusionist}
    diplomat: {es: Diplomático, en: Diplomat}
    war_chanter: {es: Cantor de Guerra, en: War Chanter}
    trickster: {es: Embaucador, en: Trickster}

warlock:
  name: {es: Brujo, en: Warlock}
  description:
    es: Selló un pacto con un poder oscuro; maldice a sus enemigos y los quiebra con energía sobrenatural.
    en: Bound by a pact with a dark power; curses foes and breaks them with eldritch energy.
  hit_die: 8
  primary: cha
  casting: cha
  array: {cha: 15, con: 14, dex: 13, wis: 12, int: 10, str: 8}
  skills: [arcana, intimidation]
  items: {quarterstaff: 1, dagger: 1, leather_armor: 1, healing_potion: 1}
  equip: [quarterstaff, leather_armor]
  signature: [eldritch_blast]
  abilities:
    eldritch_blast:
      name: {es: Estallido Sobrenatural, en: Eldritch Blast}
      description: {es: "Ataque de conjuro a distancia (CAR): 1d10 de daño de fuerza. Ilimitado.", en: "Ranged spell attack (CHA): 1d10 force damage. Unlimited."}
      details:
        es: "Un rayo de energía crepitante, regalo de tu patrón. Es un ataque de conjuro a distancia con tu CAR que hace 1d10 de daño de fuerza. No tiene usos: es tu ataque de siempre."
        en: "A beam of crackling energy, a gift from your patron. It is a ranged spell attack with your CHA that deals 1d10 force damage. It has no uses: it is your everyday attack."
      level: 1
      kind: spell
      damage: 1d10
      damage_type: force
    hex:
      name: {es: Maleficio, en: Hex}
      description: {es: "Acción adicional: maldices a un enemigo 3 turnos, sin salvación; cada golpe que le das suma 1d6 de daño necrótico.", en: "Bonus action: you curse one enemy for 3 turns, no save; each hit you land on it adds 1d6 necrotic damage."}
      details:
        es: "Señalas al enemigo y tu patrón lo marca. Como acción adicional lo maldices 3 turnos, sin salvación: cada golpe que le das suma 1d6 de daño necrótico. Úsalo primero y ataca después. Dos usos por descanso."
        en: "You point at the enemy and your patron marks it. As a bonus action you curse it for 3 turns, with no save: every hit you land adds 1d6 necrotic damage. Cast it first, then attack. Two uses per rest."
      level: 1
      kind: curse
      action: bonus
      uses: 2
      status: hexed
      status_turns: 3
    shadow_armor:
      name: {es: Armadura de Sombras, en: Shadow Armor}
      description: {es: "Acción adicional: las sombras te envuelven y ganas 2d4 + CAR PV temporales.", en: "Bonus action: shadows wrap around you and you gain 2d4 + CHA temporary HP."}
      details:
        es: "Las sombras se te pegan como una segunda piel. Como acción adicional ganas 2d4 + CAR PV temporales, que se pierden antes que los tuyos. Un uso por descanso."
        en: "The shadows cling to you like a second skin. As a bonus action you gain 2d4 + CHA temporary HP, lost before your own. One use per rest."
      level: 2
      kind: buff
      action: bonus
      uses: 1
      temp_hp: 2d4
      heal_add: casting
    void_whispers:
      name: {es: Susurros del Vacío, en: Void Whispers}
      description: {es: "Toda la fila del objetivo hace una salvación de SAB: 2d6 de daño psíquico, la mitad si la supera; quien falla queda con miedo 1 turno.", en: "The target's whole row makes a WIS save: 2d6 psychic damage, half on a success; those who fail are frightened for 1 turn."}
      details:
        es: "Voces del vacío llenan la cabeza de tus enemigos. Toda la fila del objetivo hace una salvación de SAB: 2d6 de daño psíquico, la mitad si la supera, y quien falla queda con miedo un turno. Un uso por descanso."
        en: "Voices from the void fill your enemies' heads. The target's whole row makes a WIS save: 2d6 psychic damage, half on a success, and whoever fails is frightened for a turn. One use per rest."
      level: 3
      kind: save
      uses: 1
      area: row
      save: wis
      damage: 2d6
      damage_type: psychic
      half_on_save: true
      status: frightened
      status_turns: 1
    agonizing_blast:
      name: {es: Estallido Agónico, en: Agonizing Blast}
      description: {es: Sumas tu CAR al daño de tus conjuros., en: You add your CHA to the damage of your spells.}
      details:
        es: "Tu patrón afila tu poder. Sumas tu CAR al daño de tus conjuros de ataque, también al Estallido Sobrenatural. Es automático."
        en: "Your patron sharpens your power. You add your CHA to the damage of your attack spells, Eldritch Blast included. It is automatic."
      level: 5
      kind: passive
      action: none
      spell_damage_bonus: true
  specializations:
    fiend: {es: Pactista Infernal, en: Fiend Pact}
    necromancer: {es: Nigromante, en: Necromancer}
    hexblade: {es: Filo Maldito, en: Hexblade}
    void: {es: Vacío, en: Void}
