# Las catorce clases (roadmap_balance §6). Cada una tiene su propia barra de recurso (content/progression.yaml)
# y habilidades de nivel 1 a 9; la rama de clase llega al 10 (content/class_specializations.yaml).
# Costes y cifras son SEMILLAS para medir (B12). El ataque básico nunca cuesta nada.

warrior:
  name: {es: Guerrero, en: Warrior}
  description:
    es: Maestro de las armas y la armadura; aguanta en primera línea y remata cuando cuenta.
    en: Master of arms and armor; holds the front line and finishes the fight when it counts.
  hit_die: 10
  primary: str
  array: {str: 15, con: 14, dex: 13, wis: 12, cha: 10, int: 8}
  skills: [athletics, intimidation]
  items: {warhammer: 1, handaxe: 1, chain_mail: 1, shield: 1, healing_potion: 1}
  equip: [warhammer, handaxe, chain_mail, shield]
  signature: [power_strike, action_surge, second_wind]
  resource: focus
  resource_on_attack: 1
  abilities:
    second_wind:
      name: {es: Segundo Aliento, en: Second Wind}
      description:
        es: 'Acción adicional: recuperas 1d10 + tu nivel en PV. Cuesta 4 de Foco.'
        en: 'Bonus action: recover 1d10 + your level in HP. Costs 4 Focus.'
      details:
        es: 'Respiras hondo y te obligas a seguir. Como acción adicional recuperas 1d10 + tu nivel en PV, así que puedes curarte y atacar en el mismo turno. Gasta Foco y tarda un par de turnos en volver a estar lista: guárdala para cuando la pelea se tuerza.'
        en: 'You take a deep breath and force yourself on. As a bonus action you recover 1d10 + your level in HP, so you can heal and attack in the same turn. It spends Focus and takes a couple of turns to be ready again: keep it for when the fight turns.'
      level: 1
      kind: heal
      action: bonus
      cost: 4
      cooldown: 2
      heal_dice: 1d10
      heal_add: level
    power_strike:
      name: {es: Golpe Poderoso, en: Power Strike}
      description:
        es: Un ataque con arma que añade 1d8 de daño contundente. Cuesta 4 de Foco.
        en: A weapon attack that adds 1d8 bludgeoning damage. Costs 4 Focus.
      details:
        es: Descargas todo tu peso en un solo golpe. Es tu ataque normal con el arma, pero si acierta suma 1d8 de daño extra. Atacar te devuelve Foco; esto lo gasta.
        en: You put all your weight into a single blow. It is your normal weapon attack, but on a hit it adds 1d8 extra damage. Attacking gives Focus back; this spends it.
      level: 1
      kind: strike
      cost: 4
      extra_damage: 1d8
      damage_type: bludgeoning
    defense_style:
      name: {es: 'Estilo de combate: Defensa', en: 'Fighting Style: Defense'}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Te entrenaron para no dejar huecos en la guardia. Siempre tienes +1 a la CA, sin hacer nada.
        en: You were trained to leave no gaps in your guard. You always have +1 AC, with no action needed.
      level: 1
      kind: passive
      action: none
      ac_bonus: 1
    action_surge:
      name: {es: Oleada de Acción, en: Action Surge}
      description:
        es: 'Acción adicional, tras usar tu acción: recuperas la acción y puedes actuar otra vez. Cuesta 5 de Foco.'
        en: 'Bonus action, after using your action: you get your action back and can act again. Costs 5 Focus.'
      details:
        es: 'Cuando la batalla lo exige, sacas fuerzas de donde no hay. Después de usar tu acción, gastas tu acción adicional en recuperarla y vuelves a actuar: dos ataques, o atacar y beber una poción. Gasta mucho Foco y necesita unos turnos para repetirse.'
        en: 'When the battle demands it, you find strength from nowhere. After using your action, you spend your bonus action to get it back and act again: two attacks, or attack and drink a potion. It spends a lot of Focus and needs a few turns before it can be done again.'
      level: 2
      kind: surge
      action: bonus
      cost: 5
      cooldown: 3
    improved_critical:
      name: {es: Crítico Mejorado, en: Improved Critical}
      description: {es: Tus ataques son críticos con 19 o 20., en: Your attacks score a critical hit on a 19 or 20.}
      details:
        es: Conoces los puntos débiles de cualquier armadura. Tus ataques son críticos con un 19 o un 20 natural, y un crítico dobla los dados de daño.
        en: You know the weak points of any armor. Your attacks are critical hits on a natural 19 or 20, and a critical doubles the damage dice.
      level: 3
      kind: passive
      action: none
      crit_range: 19
    shield_bash:
      name: {es: Embestida de Escudo, en: Shield Bash}
      description:
        es: 'El objetivo tira DES: si falla, recibe 1d6 y queda aturdido un turno. Cuesta 4 de Foco.'
        en: 'The target rolls a DEX save: on a fail it takes 1d6 and is stunned for a turn. Costs 4 Focus.'
      details:
        es: 'Cargas con el escudo para romperle el ritmo al rival. No es un golpe fuerte, es un golpe que desequilibra: un turno sin actuar vale más que daño.'
        en: 'You charge with the shield to break the foe''s rhythm. It is not a strong blow but one that unbalances: a turn without acting is worth more than damage.'
      level: 4
      kind: save
      cost: 4
      cooldown: 3
      damage: 1d6
      damage_type: bludgeoning
      save: dex
      status: stunned
    extra_attack:
      name: {es: Ataque Extra, en: Extra Attack}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: La disciplina de mil combates hace que tu arma no se detenga. Cuando atacas, golpeas dos veces en la misma acción, cada golpe con su tirada.
        en: The discipline of a thousand fights keeps your weapon moving. When you attack, you strike twice in the same action, each with its own roll.
      level: 5
      kind: passive
      action: none
      extra_attack: true
    veteran_guard:
      name: {es: Guardia de Veterano, en: Veteran's Guard}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Años de combate te enseñaron dónde va el siguiente golpe. Siempre tienes +1 a la CA, sin hacer nada.
        en: Years of fighting taught you where the next blow lands. You always have +1 AC, with no action needed.
      level: 7
      kind: passive
      action: none
      ac_bonus: 1
    finishing_blow:
      name: {es: Golpe de Gracia, en: Finishing Blow}
      description:
        es: Un ataque con arma que añade 3d6 de daño contundente. Cuesta 7 de Foco.
        en: A weapon attack that adds 3d6 bludgeoning damage. Costs 7 Focus.
      details:
        es: Todo lo aprendido en cada pelea, en un solo golpe. Es tu mejor remate, y por eso necesita varios turnos de preparación para repetirse.
        en: Everything you learned in every fight, in one blow. It is your best finisher, so it needs several turns of preparation before it can be repeated.
      level: 9
      kind: strike
      cost: 7
      cooldown: 3
      extra_damage: 3d6
      damage_type: bludgeoning

barbarian:
  name: {es: Bárbaro, en: Barbarian}
  description:
    es: 'Furia y presión: golpea sin pausa y se hace más peligroso cuanto más pelea. Sin armadura, pero con una vitalidad enorme.'
    en: 'Fury and pressure: strikes without pause and grows more dangerous the longer the fight goes. No armor, but a huge pool of life.'
  hit_die: 12
  primary: str
  array: {str: 15, con: 14, dex: 13, wis: 12, cha: 10, int: 8}
  skills: [athletics, survival]
  items: {warhammer: 1, handaxe: 1, healing_potion: 1}
  equip: [warhammer, handaxe]
  signature: [reckless_strike, rage]
  resource: fury
  resource_on_attack: 2
  abilities:
    unarmored_defense:
      name: {es: Defensa sin Armadura, en: Unarmored Defense}
      description: {es: +2 a la CA mientras no lleves armadura., en: +2 AC while you wear no armor.}
      details:
        es: 'No necesitas una coraza: tu cuerpo es la coraza. Si no llevas armadura, tienes +2 a la CA siempre, sin gastar acciones.'
        en: 'You need no cuirass: your body is the cuirass. If you wear no armor, you always have +2 AC, with no action needed.'
      level: 1
      kind: passive
      action: none
      ac_bonus_unarmored: 2
    reckless_strike:
      name: {es: Golpe Temerario, en: Reckless Strike}
      description:
        es: Un ataque con arma que añade 1d10 de daño contundente. Cuesta 3 de Furia.
        en: A weapon attack that adds 1d10 bludgeoning damage. Costs 3 Fury.
      details:
        es: 'Te lanzas sin guardia sobre el rival. Es tu ataque con el arma, pero si acierta suma 1d10 de daño. La Furia se enciende atacando: sin golpes no hay Furia que gastar.'
        en: 'You throw yourself at the foe with no guard. It is your weapon attack, but on a hit it adds 1d10 damage. Fury kindles by attacking: no blows, no Fury to spend.'
      level: 1
      kind: strike
      cost: 3
      extra_damage: 1d10
      damage_type: bludgeoning
    rage:
      name: {es: Furia, en: Rage}
      description:
        es: 'Acción adicional: ganas bendición 3 turnos y 1d6 + tu nivel de PV temporales. Cuesta 2 de Furia.'
        en: 'Bonus action: you gain a blessing for 3 turns and 1d6 + your level in temporary HP. Costs 2 Fury.'
      details:
        es: La rabia te endurece y te vuelve certero. Como acción adicional ganas +2 a atacar durante 3 turnos y una reserva de PV temporales, y puedes seguir golpeando en el mismo turno.
        en: Rage hardens you and sharpens your aim. As a bonus action you gain +2 to attack for 3 turns and a reserve of temporary HP, and you can keep striking the same turn.
      level: 2
      kind: buff
      action: bonus
      cost: 2
      cooldown: 4
      status: blessed
      status_turns: 3
      temp_hp: 1d6
      heal_add: level
    sweeping_blow:
      name: {es: Golpe de Barrido, en: Sweeping Blow}
      description:
        es: 'Toda la fila del objetivo tira DES: recibe 1d8 (la mitad si la supera). Cuesta 5 de Furia.'
        en: 'The target''s whole row rolls a DEX save: it takes 1d8 (half on a success). Costs 5 Fury.'
      details:
        es: Un tajo ancho que alcanza a varios a la vez. No es el golpe más fuerte, pero ninguno de los de la fila se libra del todo.
        en: A wide sweep that reaches several at once. It is not your hardest blow, but nobody in the row gets off entirely.
      level: 3
      kind: save
      cost: 5
      cooldown: 2
      damage: 1d8
      damage_type: bludgeoning
      save: dex
      area: row
      half_on_save: true
    relentless_assault:
      name: {es: Asalto Implacable, en: Relentless Assault}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: 'Cuando te enciendes no sueltas el arma: golpeas dos veces en la misma acción, cada golpe con su tirada.'
        en: 'Once you are lit you do not let go of the weapon: you strike twice in the same action, each blow with its own roll.'
      level: 5
      kind: passive
      action: none
      extra_attack: true
    brutal_instinct:
      name: {es: Instinto Brutal, en: Brutal Instinct}
      description: {es: Haces crítico con un 19 o un 20., en: You score a critical hit on a 19 or 20.}
      details:
        es: Sabes dónde duele. Tus golpes son críticos también con un 19 natural.
        en: You know where it hurts. Your blows are critical on a natural 19 too.
      level: 6
      kind: passive
      action: none
      crit_range: 19
    savage_blow:
      name: {es: Golpe Salvaje, en: Savage Blow}
      description:
        es: Un ataque con arma que añade 3d6 de daño contundente. Cuesta 8 de Furia.
        en: A weapon attack that adds 3d6 bludgeoning damage. Costs 8 Fury.
      details:
        es: Descargas toda la Furia acumulada en un solo golpe devastador. Cuanto más has peleado, más a mano lo tienes.
        en: You pour all the Fury you built into one devastating blow. The longer you have fought, the closer it is to hand.
      level: 7
      kind: strike
      cost: 8
      cooldown: 2
      extra_damage: 3d6
      damage_type: bludgeoning
    thunder_stomp:
      name: {es: Pisotón Atronador, en: Thunder Stomp}
      description:
        es: 'Toda la fila tira DES: recibe 2d8 y queda aturdida un turno si falla. Cuesta 12 de Furia.'
        en: 'The whole row rolls a DEX save: it takes 2d8 and is stunned for a turn on a fail. Costs 12 Fury.'
      details:
        es: Golpeas el suelo y la tierra responde. Es la mayor descarga de Furia que puedes hacer, y deja a la fila sin saber dónde está.
        en: You strike the ground and the earth answers. It is the biggest outpouring of Fury you can make, and it leaves the row not knowing which way is up.
      level: 9
      kind: save
      cost: 12
      cooldown: 3
      damage: 2d8
      damage_type: bludgeoning
      save: dex
      area: row
      status: stunned

paladin:
  name: {es: Paladín, en: Paladin}
  description:
    es: Combatiente de primera línea con armadura pesada, juramentos y magia sagrada.
    en: Front-line fighter in heavy armor, bound by oaths and holy magic.
  hit_die: 10
  primary: str
  array: {str: 15, con: 14, cha: 13, wis: 12, dex: 10, int: 8}
  skills: [athletics, persuasion]
  items: {longsword: 1, chain_mail: 1, shield: 1, healing_potion: 1}
  equip: [longsword, chain_mail, shield]
  signature: [consecrated_strike]
  abilities:
    consecrated_strike:
      name: {es: Castigo Divino, en: Divine Smite}
      description:
        es: Un ataque con arma que añade 1d8 de daño radiante. Cuesta 3 de Convicción.
        en: A weapon attack that adds 1d8 radiant damage. Costs 3 Conviction.
      level: 1
      kind: strike
      extra_damage: 1d8
      damage_type: radiant
      details:
        es: 'Invocas tu juramento al golpear y el arma arde con luz sagrada. Es tu ataque normal con el arma, pero si acierta suma 1d8 de daño radiante, que hace el doble a los no muertos que temen la luz. La Convicción crece cumpliendo tu juramento en combate: golpea para ganarla y gástala donde importa.'
        en: 'You call on your oath as you strike and the weapon burns with holy light. It is your normal weapon attack, but on a hit it adds 1d8 radiant damage, which hits twice as hard on undead that fear the light. Conviction grows as you keep your oath in battle: strike to earn it and spend it where it matters.'
      cost: 3
    lay_on_hands:
      name: {es: Imposición de Manos, en: Lay on Hands}
      description:
        es: 'Acción adicional: recuperas 5 PV por nivel. Cuesta 4 de Convicción.'
        en: 'Bonus action: recover 5 HP per level. Costs 4 Conviction.'
      level: 2
      kind: heal
      action: bonus
      heal_per_level: 5
      details:
        es: Posas las manos sobre tus heridas y el juramento las cierra. Como es una acción adicional, puedes curarte y atacar en el mismo turno. A nivel 2 recuperas 10 PV; a nivel 5, 25. Gasta Convicción y tarda unos turnos en volver a estar lista.
        en: You lay your hands on your wounds and your oath closes them. As a bonus action, you can heal and attack in the same turn. At level 2 you recover 10 HP; at level 5, 25. It spends Conviction and takes a few turns to be ready again.
      cost: 4
      cooldown: 3
    aura_of_resolve:
      name: {es: Aura de Resolución, en: Aura of Resolve}
      description: {es: +1 a la CA e inmunidad al miedo., en: +1 AC and immunity to fear.}
      level: 3
      kind: passive
      action: none
      ac_bonus: 1
      immune: [frightened]
      details:
        es: Tu fe es una muralla. Siempre activa, sin gastar acciones, te da +1 a la CA y hace que el miedo no te afecte, ni el de los gritos de un espectro ni el de un conjuro.
        en: Your faith is a wall. Always on, with no action needed, it gives you +1 AC and makes you immune to fear, whether from a spectre's wail or a spell.
    divine_favor:
      name: {es: Favor Divino, en: Divine Favor}
      description:
        es: 'Acción adicional: ganas bendición 3 turnos. Cuesta 3 de Convicción.'
        en: 'Bonus action: you gain a blessing for 3 turns. Costs 3 Conviction.'
      details:
        es: Pides a tu fe un empujón y te lo da. Como acción adicional ganas +2 a atacar durante 3 turnos, y puedes seguir golpeando en el mismo turno.
        en: You ask your faith for a push and it gives it. As a bonus action you gain +2 to attack for 3 turns, and you can keep striking the same turn.
      level: 4
      kind: buff
      action: bonus
      cost: 3
      cooldown: 3
      status: blessed
      status_turns: 3
    extra_attack:
      name: {es: Ataque Extra, en: Extra Attack}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: 'Años de juramento y entrenamiento hacen que tu brazo no descanse. Cuando atacas con el arma, golpeas dos veces en la misma acción, cada golpe con su tirada. Combínalo con Golpe Consagrado: el daño radiante se suma al golpe que acierte.'
        en: 'Years of oath and training keep your arm from resting. When you attack with your weapon, you strike twice in the same action, each with its own roll. Pair it with Consecrated Strike: the radiant damage joins the blow that lands.'
      level: 5
      kind: passive
      action: none
      extra_attack: true
    holy_wrath:
      name: {es: Cólera Sagrada, en: Holy Wrath}
      description:
        es: Un ataque con arma que añade 2d8 de daño radiante. Cuesta 6 de Convicción.
        en: A weapon attack that adds 2d8 radiant damage. Costs 6 Conviction.
      details:
        es: Tu castigo, llevado al límite. Sirve para cuando el rival ya no es un estorbo sino la razón de la pelea.
        en: Your smite, pushed to the limit. It is for when the foe is no longer a nuisance but the reason for the fight.
      level: 6
      kind: strike
      cost: 6
      cooldown: 2
      extra_damage: 2d8
      damage_type: radiant
    cleansing_light:
      name: {es: Luz Purificadora, en: Cleansing Light}
      description:
        es: Los no muertos reciben 2d8 radiante y quedan aturdidos 1 turno. Cuesta 6 de Convicción.
        en: Undead take 2d8 radiant and are stunned for 1 turn. Costs 6 Conviction.
      details:
        es: Alzas tu símbolo y la luz quema lo que no debería caminar. Solo afecta a los no muertos, pero a todos a la vez.
        en: You raise your symbol and the light burns what should not walk. It only affects the undead, but all of them at once.
      level: 8
      kind: turn
      cost: 6
      cooldown: 3
      damage: 2d8
      damage_type: radiant
      status: stunned
      targets_type: undead
    sacred_vow:
      name: {es: Voto Sagrado, en: Sacred Vow}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Un juramento cumplido te protege más que una armadura. Siempre tienes +1 a la CA, sin hacer nada.
        en: A kept oath protects you better than armor. You always have +1 AC, with no action needed.
      level: 9
      kind: passive
      action: none
      ac_bonus: 1
  resource: conviction
  resource_on_attack: 1

rogue:
  name: {es: Pícaro, en: Rogue}
  description:
    es: Ágil y astuto, golpea donde más duele y desaparece antes de la respuesta.
    en: Quick and cunning, strikes where it hurts and is gone before the answer.
  hit_die: 8
  primary: dex
  array: {dex: 15, con: 14, wis: 13, cha: 12, int: 10, str: 8}
  skills: [sleight_of_hand, perception]
  items: {dagger: 1, shortbow: 1, leather_armor: 1, healing_potion: 1}
  equip: [dagger, shortbow, leather_armor]
  signature: [cheap_shot, cunning_hide]
  abilities:
    sneak_attack:
      name: {es: Ataque Furtivo, en: Sneak Attack}
      description:
        es: Una vez por turno, daño extra con armas sutiles o a distancia si tienes ventaja o el objetivo sufre un estado.
        en: Once per turn, extra damage with finesse or ranged weapons when you have advantage or the target has a condition.
      details:
        es: Sabes dónde duele. Una vez por turno, si atacas con un arma sutil (daga, estoque) o a distancia y tienes ventaja, o el objetivo está aturdido, envenenado, dormido o con otro estado, sumas dados de daño extra. Esconderte antes es la forma más fiable de conseguirlo.
        en: You know where it hurts. Once per turn, if you attack with a finesse weapon (dagger, rapier) or a ranged one and you have advantage, or the target is stunned, poisoned, asleep or under another condition, you add extra damage dice. Hiding first is the surest way to get it.
      level: 1
      kind: passive
      action: none
      sneak_dice: {1: 1, 3: 2, 5: 3}
    cunning_hide:
      name: {es: Esconderse, en: Hide}
      description:
        es: 'Acción adicional: Sigilo contra su percepción; si sale, tu próximo ataque tiene ventaja. Cuesta 2 de Energía.'
        en: 'Bonus action: a Stealth check against their perception; if it works, your next attack has advantage. Costs 2 Energy.'
      details:
        es: 'Te fundes con las sombras sin perder el ritmo. Como acción adicional haces una tirada de Sigilo; si la superas, tu próximo ataque tiene ventaja, y con ventaja llega el Ataque Furtivo. Cuesta un poco de Energía, que vuelve cada turno: puedes hacerlo casi siempre.'
        en: 'You melt into the shadows without losing your stride. As a bonus action you make a Stealth roll; if it succeeds, your next attack has advantage, and with advantage comes Sneak Attack. It costs a little Energy, which comes back every turn: you can do it almost always.'
      level: 1
      kind: hide
      action: bonus
      cost: 2
    cheap_shot:
      name: {es: Golpe Bajo, en: Cheap Shot}
      description:
        es: Un ataque con arma que añade 1d6 de daño perforante. Cuesta 4 de Energía.
        en: A weapon attack that adds 1d6 piercing damage. Costs 4 Energy.
      details:
        es: Donde no mira nadie y donde más duele. Es tu ataque con la daga, pero si acierta suma 1d6, y se combina con tu Ataque Furtivo.
        en: Where nobody is looking and where it hurts most. It is your dagger attack, but on a hit it adds 1d6, and it stacks with your Sneak Attack.
      level: 1
      kind: strike
      cost: 4
      extra_damage: 1d6
      damage_type: piercing
    trip_up:
      name: {es: Zancadilla, en: Trip Up}
      description:
        es: 'El objetivo tira DES: si falla, queda enredado un turno. Cuesta 4 de Energía.'
        en: 'The target rolls a DEX save: on a fail it is restrained for a turn. Costs 4 Energy.'
      details:
        es: Un pie en el sitio justo y el rival se va al suelo. No hace daño, pero un enemigo trabado es un enemigo al que le acierta cualquiera.
        en: A foot in just the right place and the foe goes down. It does no damage, but a hobbled enemy is one anyone can hit.
      level: 2
      kind: save
      cost: 4
      cooldown: 3
      save: dex
      status: restrained
    uncanny_dodge:
      name: {es: Esquiva Asombrosa, en: Uncanny Dodge}
      description:
        es: El primer golpe que recibes cada ronda hace la mitad de daño.
        en: The first hit you take each round deals half damage.
      details:
        es: 'Ves venir el golpe y te apartas lo justo. El primer ataque que te acierta en cada ronda te hace solo la mitad de daño. Es automático: no gasta acciones.'
        en: 'You see the blow coming and step aside just enough. The first attack that hits you each round deals only half damage. It is automatic: it costs no action.'
      level: 3
      kind: passive
      action: none
      halve_first_hit: true
    nimble_feet:
      name: {es: Pies Ligeros, en: Nimble Feet}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: No te quedas quieto el tiempo suficiente para que te den. Siempre tienes +1 a la CA, sin hacer nada.
        en: You never stand still long enough to be hit. You always have +1 AC, with no action needed.
      level: 4
      kind: passive
      action: none
      ac_bonus: 1
    cunning_action:
      name: {es: Acción Astuta, en: Cunning Action}
      description:
        es: 'Acción adicional, tras usar tu acción: recuperas la acción y puedes actuar otra vez. Cuesta 5 de Energía.'
        en: 'Bonus action, after using your action: you get your action back and can act again. Costs 5 Energy.'
      details:
        es: 'Eres rápido y lo sabes usar: tras tu acción, gastas la acción adicional en volver a actuar. Cuesta mucha Energía, así que elige bien el momento.'
        en: 'You are fast and know how to use it: after your action, you spend your bonus action to act again. It costs a lot of Energy, so choose the moment well.'
      level: 5
      kind: surge
      action: bonus
      cost: 5
      cooldown: 3
    deadly_edge:
      name: {es: Filo Mortal, en: Deadly Edge}
      description:
        es: Un ataque con arma que añade 2d6 de daño perforante. Cuesta 6 de Energía.
        en: A weapon attack that adds 2d6 piercing damage. Costs 6 Energy.
      details:
        es: Tu mejor estocada, preparada con calma. Si la pelea te ha dado una ventaja, aquí es donde se cobra.
        en: Your best thrust, set up calmly. If the fight has given you an advantage, this is where it is cashed in.
      level: 6
      kind: strike
      cost: 6
      cooldown: 2
      extra_damage: 2d6
      damage_type: piercing
    killer_instinct:
      name: {es: Instinto Asesino, en: Killer Instinct}
      description: {es: Haces crítico con un 19 o un 20., en: You score a critical hit on a 19 or 20.}
      details:
        es: Ves el punto débil antes de que el rival sepa que lo tiene. Tus golpes son críticos también con un 19 natural.
        en: You see the weak spot before the foe knows it has one. Your blows are critical on a natural 19 too.
      level: 8
      kind: passive
      action: none
      crit_range: 19
  resource: energy

monk:
  name: {es: Monje, en: Monk}
  description:
    es: 'Técnicas del cuerpo: golpes cortos y precisos, y una disciplina que sustituye a la armadura.'
    en: 'Techniques of the body: short, precise blows and a discipline that stands in for armor.'
  hit_die: 8
  primary: dex
  casting: wis
  array: {dex: 15, wis: 14, con: 13, str: 12, cha: 10, int: 8}
  skills: [acrobatics, insight]
  items: {hand_wraps: 1, healing_potion: 1}
  equip: [hand_wraps]
  signature: [flurry, stunning_blow]
  resource: focus
  resource_on_attack: 1
  abilities:
    unarmored_defense:
      name: {es: Defensa sin Armadura, en: Unarmored Defense}
      description: {es: +3 a la CA mientras no lleves armadura., en: +3 AC while you wear no armor.}
      details:
        es: Tu disciplina es tu armadura. Si no llevas armadura, tienes +3 a la CA siempre, sin gastar acciones.
        en: Your discipline is your armor. If you wear no armor, you always have +3 AC, with no action needed.
      level: 1
      kind: passive
      action: none
      ac_bonus_unarmored: 3
    flurry:
      name: {es: Ráfaga de Golpes, en: Flurry of Blows}
      description:
        es: Un ataque con las vendas que añade 1d6 de daño contundente. Cuesta 4 de Foco.
        en: An attack with your wraps that adds 1d6 bludgeoning damage. Costs 4 Focus.
      details:
        es: 'Tres golpes donde otros dan uno. Es tu ataque normal, pero si acierta suma 1d6. El Foco vuelve con cada ataque y cada turno: no te quedes sin él en el peor momento.'
        en: 'Three blows where others land one. It is your normal attack, but on a hit it adds 1d6. Focus comes back with every attack and every turn: do not run out at the worst moment.'
      level: 1
      kind: strike
      cost: 4
      extra_damage: 1d6
      damage_type: bludgeoning
    stunning_blow:
      name: {es: Golpe Aturdidor, en: Stunning Blow}
      description:
        es: 'El objetivo tira SAB: si falla, recibe 1d6 y queda aturdido un turno. Cuesta 5 de Foco.'
        en: 'The target rolls a WIS save: on a fail it takes 1d6 and is stunned for a turn. Costs 5 Focus.'
      details:
        es: Un golpe a un punto exacto que corta el hilo entre el rival y su voluntad. Un turno sin actuar vale más que cualquier daño.
        en: A blow to an exact point that cuts the thread between the foe and its will. A turn without acting is worth more than any damage.
      level: 2
      kind: save
      cost: 5
      cooldown: 3
      damage: 1d6
      damage_type: bludgeoning
      save: wis
      status: stunned
    deflect_blows:
      name: {es: Desviar Golpes, en: Deflect Blows}
      description:
        es: El primer golpe que recibes en cada ronda hace la mitad de daño.
        en: The first blow you take each round does half damage.
      details:
        es: Ves llegar el golpe y lo empujas a un lado. El primer impacto que recibes cada ronda hace la mitad de daño.
        en: You see the blow coming and push it aside. The first hit you take each round does half damage.
      level: 3
      kind: passive
      action: none
      halve_first_hit: true
    centering_breath:
      name: {es: Respiración Serena, en: Centering Breath}
      description:
        es: 'Acción adicional: recuperas 1d8 + tu nivel en PV. Cuesta 4 de Foco.'
        en: 'Bonus action: recover 1d8 + your level in HP. Costs 4 Focus.'
      details:
        es: Un respiro hondo y el cuerpo se ordena. Como es una acción adicional, puedes curarte y atacar en el mismo turno.
        en: One deep breath and the body falls into order. As a bonus action, you can heal and attack in the same turn.
      level: 4
      kind: heal
      action: bonus
      cost: 4
      cooldown: 3
      heal_dice: 1d8
      heal_add: level
    flurry_of_blows:
      name: {es: Mil Puños, en: A Thousand Fists}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: 'Tus manos no se detienen: golpeas dos veces en la misma acción, cada golpe con su tirada.'
        en: 'Your hands do not stop: you strike twice in the same action, each blow with its own roll.'
      level: 5
      kind: passive
      action: none
      extra_attack: true
    iron_body:
      name: {es: Cuerpo de Hierro, en: Iron Body}
      description: {es: +1 a la CA mientras no lleves armadura., en: +1 AC while you wear no armor.}
      details:
        es: Años de disciplina endurecen la carne. Si no llevas armadura, tienes +1 a la CA más, sin gastar acciones.
        en: Years of discipline harden the flesh. If you wear no armor, you have a further +1 AC, with no action needed.
      level: 6
      kind: passive
      action: none
      ac_bonus_unarmored: 1
    crashing_wave:
      name: {es: Ola Arrolladora, en: Crashing Wave}
      description:
        es: Un ataque con las vendas que añade 2d6 de daño contundente. Cuesta 6 de Foco.
        en: An attack with your wraps that adds 2d6 bludgeoning damage. Costs 6 Focus.
      details:
        es: Tu fuerza interior, soltada de golpe. Es tu mejor remate y pide unos turnos de calma antes de repetirse.
        en: Your inner strength, released at once. It is your best finisher and asks a few calm turns before it can be repeated.
      level: 7
      kind: strike
      cost: 6
      cooldown: 2
      extra_damage: 2d6
      damage_type: bludgeoning
    perfect_focus:
      name: {es: Foco Perfecto, en: Perfect Focus}
      description: {es: Haces crítico con un 19 o un 20., en: You score a critical hit on a 19 or 20.}
      details:
        es: 'Tu atención no falla: tus golpes son críticos también con un 19 natural.'
        en: 'Your attention never wavers: your blows are critical on a natural 19 too.'
      level: 9
      kind: passive
      action: none
      crit_range: 19

cleric:
  name: {es: Clérigo, en: Cleric}
  description:
    es: Canaliza la luz de su fe para sanar a los suyos y abrasar a los no-muertos.
    en: Channels the light of their faith to heal allies and sear the undead.
  hit_die: 8
  primary: wis
  casting: wis
  array: {wis: 15, con: 14, str: 13, dex: 12, cha: 10, int: 8}
  skills: [medicine, religion]
  items: {mace: 1, scale_mail: 1, shield: 1, healing_potion: 1}
  equip: [mace, scale_mail, shield]
  signature: [sacred_flame]
  abilities:
    sacred_flame:
      name: {es: Llama Sagrada, en: Sacred Flame}
      description: {es: 'Ataque de conjuro a distancia (SAB): 1d8 de daño radiante.', en: 'Ranged spell attack (WIS): 1d8 radiant damage.'}
      details:
        es: 'Una llama de luz cae sobre el enemigo desde lo alto. Es un ataque de conjuro a distancia con tu SAB que hace 1d8 de daño radiante, el doble contra no muertos. No cuesta nada: es tu ataque de siempre.'
        en: 'A flame of light falls on the enemy from above. It is a ranged spell attack with your WIS that deals 1d8 radiant damage, double against undead. It costs nothing: it is your everyday attack.'
      level: 1
      kind: spell
      damage: 1d8
      damage_type: radiant
      damage_tiers: {5: 2d8, 11: 3d8, 17: 4d8}
    healing_word:
      name: {es: Palabra Sanadora, en: Healing Word}
      description: {es: 'Acción adicional: recuperas 2d4 + SAB PV.', en: 'Bonus action: recover 2d4 + WIS HP.'}
      details:
        es: Una palabra de tu fe basta para cerrar heridas. Como acción adicional recuperas 2d4 + SAB PV, y te queda la acción para atacar. Gasta Maná.
        en: A word of your faith is enough to close wounds. As a bonus action you recover 2d4 + WIS HP, and you keep your action to attack. It spends Mana.
      level: 1
      kind: heal
      action: bonus
      heal_dice: 2d4
      heal_add: casting
      cost: 3
    turn_undead:
      name: {es: Expulsar No-muertos, en: Turn Undead}
      description:
        es: Todos los no-muertos enemigos sufren 2d6 de daño radiante y quedan aturdidos un turno.
        en: Every undead enemy takes 2d6 radiant damage and is stunned for a turn.
      details:
        es: 'Alzas tu símbolo sagrado y los muertos recuerdan que deberían estar quietos. Todos los no muertos enemigos reciben 2d6 de daño radiante y quedan aturdidos un turno. Contra cualquier otra criatura no hace nada: úsalo contra los muertos que caminan.'
        en: 'You raise your holy symbol and the dead remember they should lie still. Every undead enemy takes 2d6 radiant damage and is stunned for a turn. Against any other creature it does nothing: use it against the walking dead.'
      level: 2
      kind: turn
      damage: 2d6
      damage_type: radiant
      status: stunned
      status_turns: 1
      targets_type: undead
      cost: 5
      cooldown: 2
    bless:
      name: {es: Bendición, en: Bless}
      description: {es: +2 a tus tiradas de ataque durante 3 turnos., en: +2 to your attack rolls for 3 turns.}
      details:
        es: Tu dios guía tu mano. Durante 3 turnos sumas +2 a tus tiradas de ataque. Úsalo al principio de una pelea larga para sacarle todo el partido.
        en: Your god guides your hand. For 3 turns you add +2 to your attack rolls. Use it at the start of a long fight to get the most out of it.
      level: 3
      kind: buff
      status: blessed
      status_turns: 3
      cost: 4
      cooldown: 3
    divine_strike:
      name: {es: Golpe Divino, en: Divine Strike}
      description:
        es: Una vez por turno, tus golpes con arma cuerpo a cuerpo añaden 1d8 de daño radiante.
        en: Once per turn, your melee weapon hits add 1d8 radiant damage.
      details:
        es: Tu arma lleva la marca de tu dios. Una vez por turno, cuando aciertas con un arma cuerpo a cuerpo, sumas 1d8 de daño radiante. Es automático.
        en: Your weapon bears your god's mark. Once per turn, when you hit with a melee weapon, you add 1d8 radiant damage. It is automatic.
      level: 5
      kind: passive
      action: none
      bonus_damage: 1d8
      bonus_damage_type: radiant
    mending_prayer:
      name: {es: Plegaria Sanadora, en: Mending Prayer}
      description:
        es: Recuperas 2d8 + tu modificador de conjuro en PV. Cuesta 5 de Maná.
        en: You recover 2d8 + your spellcasting modifier in HP. Costs 5 Mana.
      details:
        es: Una oración larga, de las que cierran heridas de verdad. Usa tu acción entera, así que cúrate cuando el combate te lo permita.
        en: A long prayer, the kind that really closes wounds. It uses your whole action, so heal when the fight lets you.
      level: 4
      kind: heal
      cost: 5
      heal_dice: 2d8
      heal_add: casting
    guiding_bolt:
      name: {es: Rayo Guía, en: Guiding Bolt}
      description:
        es: 'Ataque de conjuro a distancia: 4d6 de daño radiante. Cuesta 6 de Maná.'
        en: 'Ranged spell attack: 4d6 radiant damage. Costs 6 Mana.'
      details:
        es: Un rayo de luz que el cielo envía por tu mano. Hace el doble contra los no muertos y es tu golpe más fuerte a distancia.
        en: A bolt of light the sky sends through your hand. It hits twice as hard on undead and is your strongest ranged blow.
      level: 6
      kind: spell
      cost: 6
      cooldown: 2
      damage: 4d6
      damage_type: radiant
    sanctified_ward:
      name: {es: Resguardo Sagrado, en: Sanctified Ward}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Tu fe te rodea como una muralla delgada. Siempre tienes +1 a la CA, sin hacer nada.
        en: Your faith surrounds you like a thin wall. You always have +1 AC, with no action needed.
      level: 8
      kind: passive
      action: none
      ac_bonus: 1
    pillar_of_light:
      name: {es: Columna de Luz, en: Pillar of Light}
      description:
        es: 'Toda la fila tira DES: 4d6 de daño radiante, la mitad si la supera. Cuesta 12 de Maná.'
        en: 'The whole row rolls a DEX save: 4d6 radiant damage, half on a success. Costs 12 Mana.'
      details:
        es: Una columna de luz cae sobre la fila entera. Es el gasto más grande de tu reserva, y vale la pena cuando son varios.
        en: A pillar of light falls on the whole row. It is the biggest spend of your reserve, and it is worth it when there are several.
      level: 9
      kind: save
      cost: 12
      cooldown: 3
      damage: 4d6
      damage_type: radiant
      save: dex
      area: row
      half_on_save: true
  resource: mana

sorcerer:
  name: {es: Hechicero, en: Sorcerer}
  description:
    es: Moldea la magia a voluntad; frágil de cerca, devastador a distancia con fuego y hechizos de control.
    en: Shapes magic at will; frail up close, devastating from afar with fire and control spells.
  hit_die: 6
  primary: int
  casting: int
  array: {int: 15, con: 14, dex: 13, wis: 12, cha: 10, str: 8}
  skills: [arcana, history]
  items: {quarterstaff: 1, dagger: 1, healing_potion: 1}
  equip: [quarterstaff]
  signature: [fire_bolt]
  resource: mana
  abilities:
    fire_bolt:
      name: {es: Rayo de Fuego, en: Fire Bolt}
      description: {es: 'Ataque de conjuro a distancia (INT): 1d10 de daño de fuego.', en: 'Ranged spell attack (INT): 1d10 fire damage.'}
      details:
        es: 'Una chispa en la punta de los dedos que estalla en llamas. Es un ataque de conjuro a distancia con tu INT que hace 1d10 de daño de fuego. No cuesta nada: es tu ataque de siempre, también desde la retaguardia.'
        en: 'A spark at your fingertips that bursts into flame. It is a ranged spell attack with your INT that deals 1d10 fire damage. It costs nothing: it is your everyday attack, from the back row too.'
      level: 1
      kind: spell
      damage: 1d10
      damage_type: fire
      damage_tiers: {5: 2d10, 11: 3d10, 17: 4d10}
    mage_armor:
      name: {es: Armadura de Mago, en: Mage Armor}
      description: {es: +3 a la CA si no llevas armadura., en: +3 AC while you wear no armor.}
      details:
        es: Una fuerza invisible te envuelve como una coraza. Si no llevas armadura, tienes +3 a la CA siempre, sin gastar acciones.
        en: An invisible force wraps you like a breastplate. If you wear no armor, you always have +3 AC, with no action needed.
      level: 1
      kind: passive
      action: none
      ac_bonus_unarmored: 3
    sleep:
      name: {es: Dormir, en: Sleep}
      description:
        es: Un enemigo hace una salvación de SAB; si falla, se duerme 2 turnos (ventaja contra él; despierta al recibir daño).
        en: One enemy makes a WIS save; on a failure it falls asleep for 2 turns (advantage against it; it wakes when damaged).
      details:
        es: 'Un susurro y los párpados del enemigo pesan como el plomo. Hace una salvación de SAB; si falla, se duerme 2 turnos: no actúa y tus ataques tienen ventaja, pero despierta si recibe daño. Gasta Maná.'
        en: 'A whisper and the enemy''s eyelids weigh like lead. It makes a WIS save; on a failure it falls asleep for 2 turns: it does not act and your attacks have advantage, but it wakes up if it takes damage. It spends Mana.'
      level: 2
      kind: save
      cost: 3
      save: wis
      status: asleep
      status_turns: 2
    fireball:
      name: {es: Bola de Fuego, en: Fireball}
      description:
        es: 'Toda la fila del objetivo hace una salvación de DES: 3d6 de fuego, la mitad si la supera.'
        en: 'The target''s whole row makes a DEX save: 3d6 fire, half on a success.'
      details:
        es: 'Una perla de fuego que vuela hasta el enemigo y revienta. Toda su fila hace una salvación de DES: 3d6 de daño de fuego, la mitad si la supera. Ideal contra grupos en primera línea. Gasta Maná.'
        en: 'A bead of fire that flies to the enemy and bursts. Its whole row makes a DEX save: 3d6 fire damage, half on a success. Ideal against groups in the front line. It spends Mana.'
      level: 3
      kind: save
      cost: 6
      cooldown: 2
      area: row
      save: dex
      damage: 3d6
      damage_type: fire
      half_on_save: true
    magic_missile:
      name: {es: Proyectil Mágico, en: Magic Missile}
      description: {es: 'Tres dardos que nunca fallan: 3d4+3 de daño de fuerza.', en: 'Three darts that never miss: 3d4+3 force damage.'}
      details:
        es: 'Tres dardos de luz que buscan su blanco solos. No hay tirada: siempre aciertan y hacen 3d4+3 de daño de fuerza. Perfecto para rematar a un enemigo con CA alta. Gasta Maná.'
        en: 'Three darts of light that find their mark on their own. There is no roll: they always hit and deal 3d4+3 force damage. Perfect to finish off an enemy with high AC. It spends Mana.'
      level: 5
      kind: spell
      cost: 4
      auto_hit: true
      damage: 3d4+3
      damage_type: force
    ice_lance:
      name: {es: Lanza de Hielo, en: Ice Lance}
      description:
        es: 'Ataque de conjuro a distancia: 3d6 de daño de frío. Cuesta 4 de Maná.'
        en: 'Ranged spell attack: 3d6 cold damage. Costs 4 Mana.'
      details:
        es: Una lanza de hielo que atraviesa la guardia. Más cara que el rayo de fuego pero mucho más fuerte, para cuando un solo enemigo importa.
        en: A lance of ice that pierces the guard. Dearer than the fire bolt but much stronger, for when a single enemy matters.
      level: 4
      kind: spell
      cost: 4
      damage: 3d6
      damage_type: cold
    spell_mastery:
      name: {es: Maestría Arcana, en: Spell Mastery}
      description: {es: Tus conjuros suman tu modificador de conjuro al daño., en: Your spells add your spellcasting modifier to damage.}
      details:
        es: 'Ya no solo lanzas la magia: la moldeas. Tus conjuros suman tu modificador de conjuro al daño.'
        en: 'You no longer just cast magic: you shape it. Your spells add your spellcasting modifier to damage.'
      level: 6
      kind: passive
      action: none
      spell_damage_bonus: true
    frost_nova:
      name: {es: Nova Gélida, en: Frost Nova}
      description:
        es: 'Toda la fila tira DES: 3d6 de frío y queda enredada un turno si falla. Cuesta 8 de Maná.'
        en: 'The whole row rolls a DEX save: 3d6 cold and restrained for a turn on a fail. Costs 8 Mana.'
      details:
        es: Un anillo de frío estalla a tus pies y atrapa a todo lo que toca. Control y daño de área, a un precio alto.
        en: A ring of cold bursts at your feet and traps everything it touches. Control and area damage, at a high price.
      level: 7
      kind: save
      cost: 8
      cooldown: 3
      damage: 3d6
      damage_type: cold
      save: dex
      area: row
      status: restrained
    arcane_ward:
      name: {es: Resguardo Arcano, en: Arcane Ward}
      description:
        es: 'Acción adicional: ganas 3d6 + tu modificador de conjuro de PV temporales. Cuesta 6 de Maná.'
        en: 'Bonus action: you gain 3d6 + your spellcasting modifier in temporary HP. Costs 6 Mana.'
      details:
        es: 'Un escudo de magia pura que absorbe golpes antes que tu cuerpo. Es una acción adicional: lánzalo y sigue hechizando.'
        en: 'A shield of pure magic that soaks up blows before your body does. It is a bonus action: cast it and keep spelling.'
      level: 8
      kind: buff
      action: bonus
      cost: 6
      cooldown: 4
      temp_hp: 3d6
      heal_add: casting
    cone_of_cold:
      name: {es: Cono de Frío, en: Cone of Cold}
      description:
        es: 'Toda la fila tira DES: 8d6 de frío, la mitad si la supera. Cuesta 14 de Maná.'
        en: 'The whole row rolls a DEX save: 8d6 cold, half on a success. Costs 14 Mana.'
      details:
        es: 'Tu conjuro más destructivo: un cono de frío absoluto sobre la fila entera. Casi toda tu reserva, y casi siempre decide el combate.'
        en: 'Your most destructive spell: a cone of absolute cold over the whole row. Nearly all your reserve, and it almost always decides the fight.'
      level: 9
      kind: save
      cost: 14
      cooldown: 4
      damage: 8d6
      damage_type: cold
      save: dex
      area: row
      half_on_save: true

druid:
  name: {es: Druida, en: Druid}
  description:
    es: Guardián de lo salvaje; enreda a sus enemigos, cura con la savia del bosque y adopta forma de bestia.
    en: Keeper of the wild; entangles foes, heals with the forest's sap and takes the shape of a beast.
  hit_die: 8
  primary: wis
  casting: wis
  array: {wis: 15, con: 14, dex: 13, int: 12, cha: 10, str: 8}
  skills: [survival, medicine]
  items: {quarterstaff: 1, leather_armor: 1, shield: 1, healing_potion: 1}
  equip: [quarterstaff, leather_armor, shield]
  signature: [thorn_whip]
  abilities:
    thorn_whip:
      name: {es: Látigo de Espinas, en: Thorn Whip}
      description: {es: 'Ataque de conjuro a distancia (SAB): 1d6 de daño perforante.', en: 'Ranged spell attack (WIS): 1d6 piercing damage.'}
      details:
        es: Un látigo de enredaderas con espinas brota de tu mano. Es un ataque de conjuro a distancia con tu SAB que hace 1d6 de daño perforante. No cuesta nada.
        en: A whip of thorny vines springs from your hand. It is a ranged spell attack with your WIS that deals 1d6 piercing damage. It costs nothing.
      level: 1
      kind: spell
      damage: 1d6
      damage_type: piercing
      damage_tiers: {5: 2d6, 11: 3d6, 17: 4d6}
    cure_wounds:
      name: {es: Curar Heridas, en: Cure Wounds}
      description: {es: Recuperas 1d8 + SAB PV., en: Recover 1d8 + WIS HP.}
      details:
        es: La savia de la tierra cierra tus heridas. Usas tu acción para recuperar 1d8 + SAB PV. Gasta Maná.
        en: The sap of the earth closes your wounds. You use your action to recover 1d8 + WIS HP. It spends Mana.
      level: 1
      kind: heal
      heal_dice: 1d8
      heal_add: casting
      cost: 3
    entangle:
      name: {es: Enredar, en: Entangle}
      description:
        es: Toda la fila del objetivo hace una salvación de DES; quien falla queda enredado 2 turnos (ventaja contra él, desventaja en sus ataques).
        en: The target's whole row makes a DEX save; those who fail are entangled for 2 turns (advantage against them, disadvantage on their attacks).
      details:
        es: 'Las raíces brotan del suelo y atrapan a todo lo que pisa. Toda la fila del objetivo hace una salvación de DES; quien falla queda enredado 2 turnos: tus ataques tienen ventaja contra él y él ataca con desventaja. Gasta Maná.'
        en: 'Roots burst from the ground and seize everything on it. The target''s whole row makes a DEX save; whoever fails is restrained for 2 turns: your attacks have advantage against it and it attacks with disadvantage. It spends Mana.'
      level: 2
      kind: save
      area: row
      save: dex
      status: restrained
      status_turns: 2
      cost: 4
      cooldown: 2
    wild_shape:
      name: {es: Forma Salvaje, en: Wild Shape}
      description:
        es: 'Acción adicional: adoptas forma de oso y ganas 2d8 + tu nivel en PV temporales.'
        en: 'Bonus action: you take the shape of a bear and gain 2d8 + your level in temporary HP.'
      details:
        es: 'Tu cuerpo crece y se cubre de pelo: eres un oso. Como acción adicional ganas 2d8 + tu nivel en PV temporales, que se pierden antes que los tuyos. Gasta Maná.'
        en: 'Your body grows and is covered in fur: you are a bear. As a bonus action you gain 2d8 + your level in temporary HP, lost before your own. It spends Mana.'
      level: 3
      kind: buff
      action: bonus
      temp_hp: 2d8
      heal_add: level
      status: wild_shape
      status_turns: 3
      cost: 5
      cooldown: 4
    elemental_fury:
      name: {es: Furia Elemental, en: Elemental Fury}
      description: {es: Sumas tu SAB al daño de tus conjuros., en: You add your WIS to the damage of your spells.}
      details:
        es: La naturaleza responde con rabia a tu llamada. Sumas tu SAB al daño de tus conjuros de ataque. Es automático.
        en: Nature answers your call with fury. You add your WIS to the damage of your attack spells. It is automatic.
      level: 5
      kind: passive
      action: none
      spell_damage_bonus: true
    barkskin:
      name: {es: Piel de Corteza, en: Barkskin}
      description:
        es: 'Acción adicional: ganas 2d6 + tu modificador de conjuro de PV temporales. Cuesta 3 de Maná.'
        en: 'Bonus action: you gain 2d6 + your spellcasting modifier in temporary HP. Costs 3 Mana.'
      details:
        es: Tu piel se endurece como la madera vieja. Es una acción adicional barata para encajar el siguiente golpe.
        en: Your skin hardens like old wood. A cheap bonus action to soak up the next blow.
      level: 4
      kind: buff
      action: bonus
      cost: 3
      cooldown: 3
      temp_hp: 2d6
      heal_add: casting
    stinging_swarm:
      name: {es: Enjambre Punzante, en: Stinging Swarm}
      description:
        es: 'Toda la fila tira DES: 3d6 de veneno, la mitad si la supera. Cuesta 6 de Maná.'
        en: 'The whole row rolls a DEX save: 3d6 poison, half on a success. Costs 6 Mana.'
      details:
        es: Una nube de insectos cae sobre la fila entera. No mata de golpe, pero desgasta a todos a la vez.
        en: A cloud of insects falls on the whole row. It does not kill in one go, but it wears everyone down at once.
      level: 6
      kind: save
      cost: 6
      cooldown: 2
      damage: 3d6
      damage_type: poison
      save: dex
      area: row
      half_on_save: true
    regrowth:
      name: {es: Rebrote, en: Regrowth}
      description:
        es: Recuperas 4d8 + tu modificador de conjuro en PV. Cuesta 8 de Maná.
        en: You recover 4d8 + your spellcasting modifier in HP. Costs 8 Mana.
      details:
        es: 'La vida brota donde la llamas. Tu mejor curación: usa la acción entera y casi toda la reserva de un buen rato.'
        en: 'Life springs where you call it. Your best heal: it uses the whole action and most of a good stretch of your reserve.'
      level: 8
      kind: heal
      cost: 8
      cooldown: 3
      heal_dice: 4d8
      heal_add: casting
    thorn_storm:
      name: {es: Tormenta de Espinas, en: Thorn Storm}
      description:
        es: 'Toda la fila tira DES: 5d6 perforante, la mitad si la supera. Cuesta 12 de Maná.'
        en: 'The whole row rolls a DEX save: 5d6 piercing, half on a success. Costs 12 Mana.'
      details:
        es: 'El bosque entero se alza contra ellos: una tormenta de espinas sobre toda la fila.'
        en: 'The whole forest rises against them: a storm of thorns over the whole row.'
      level: 9
      kind: save
      cost: 12
      cooldown: 3
      damage: 5d6
      damage_type: piercing
      save: dex
      area: row
      half_on_save: true
  resource: mana

bard:
  name: {es: Bardo, en: Bard}
  description:
    es: Su voz es un arma; inspira, cura y desarma al enemigo con una burla o una melodía hipnótica.
    en: Their voice is a weapon; they inspire, heal and undo foes with a jest or a hypnotic melody.
  hit_die: 8
  primary: cha
  casting: cha
  array: {cha: 15, dex: 14, con: 13, wis: 12, int: 10, str: 8}
  skills: [persuasion, deception]
  items: {rapier: 1, dagger: 1, leather_armor: 1, healing_potion: 1}
  equip: [rapier, leather_armor]
  signature: [vicious_mockery]
  abilities:
    vicious_mockery:
      name: {es: Burla Cruel, en: Vicious Mockery}
      description:
        es: 'Un enemigo hace una salvación de SAB: si falla, 1d4 de daño psíquico y miedo 1 turno.'
        en: 'One enemy makes a WIS save: on a failure, 1d4 psychic damage and fear for 1 turn.'
      details:
        es: Una burla tan cruel que duele de verdad. El enemigo hace una salvación de SAB; si falla, recibe 1d4 de daño psíquico y queda con miedo un turno (ataca con desventaja). No cuesta nada.
        en: A taunt so cruel it really hurts. The enemy makes a WIS save; on a failure it takes 1d4 psychic damage and is frightened for a turn (it attacks with disadvantage). It costs nothing.
      level: 1
      kind: save
      save: wis
      damage: 1d4
      damage_type: psychic
      status: frightened
      status_turns: 1
      generates: 2
      damage_tiers: {5: 2d4, 11: 3d4, 17: 4d4}
    bardic_inspiration:
      name: {es: Inspiración Bárdica, en: Bardic Inspiration}
      description: {es: 'Acción adicional: tu próxima tirada de ataque suma 1d6.', en: 'Bonus action: your next attack roll adds 1d6.'}
      details:
        es: Una nota que te recuerda por qué luchas. Como acción adicional, tu próxima tirada de ataque suma 1d6. Gasta Resonancia.
        en: A note that reminds you why you fight. As a bonus action, your next attack roll adds 1d6. It spends Resonance.
      level: 1
      kind: buff
      action: bonus
      status: inspired
      status_turns: 3
      cost: 2
      cooldown: 2
    song_of_healing:
      name: {es: Canción Sanadora, en: Song of Healing}
      description: {es: 'Acción adicional: recuperas 1d4 + CAR PV.', en: 'Bonus action: recover 1d4 + CHA HP.'}
      details:
        es: Una canción suave que calma el dolor. Como acción adicional recuperas 1d4 + CAR PV, y te queda la acción. Gasta Resonancia.
        en: A soft song that eases the pain. As a bonus action you recover 1d4 + CHA HP, and you keep your action. It spends Resonance.
      level: 2
      kind: heal
      action: bonus
      heal_dice: 1d4
      heal_add: casting
      cost: 3
    hypnotic_pattern:
      name: {es: Patrón Hipnótico, en: Hypnotic Pattern}
      description:
        es: Toda la fila del objetivo hace una salvación de SAB; quien falla queda aturdido 1 turno.
        en: The target's whole row makes a WIS save; those who fail are stunned for 1 turn.
      details:
        es: Luces de colores giran en el aire y nadie puede apartar la mirada. Toda la fila del objetivo hace una salvación de SAB; quien falla queda aturdido un turno. Gasta Resonancia.
        en: Colored lights whirl in the air and no one can look away. The target's whole row makes a WIS save; whoever fails is stunned for a turn. It spends Resonance.
      level: 3
      kind: save
      area: row
      save: wis
      status: stunned
      status_turns: 1
      cost: 5
      cooldown: 3
    cutting_words:
      name: {es: Palabras Cortantes, en: Cutting Words}
      description:
        es: El primer golpe que recibes cada ronda hace la mitad de daño.
        en: The first hit you take each round deals half damage.
      details:
        es: Una palabra a tiempo hace que el golpe del enemigo pierda fuerza. El primer ataque que te acierta en cada ronda te hace la mitad de daño. Es automático.
        en: A well-timed word makes the enemy's blow lose its strength. The first attack that hits you each round deals half damage. It is automatic.
      level: 5
      kind: passive
      action: none
      halve_first_hit: true
    dissonant_whispers:
      name: {es: Susurros Disonantes, en: Dissonant Whispers}
      description:
        es: 'El objetivo tira SAB: si falla, recibe 3d6 psíquico y queda con miedo un turno. Cuesta 4 de Resonancia.'
        en: 'The target rolls a WIS save: on a fail it takes 3d6 psychic and is frightened for a turn. Costs 4 Resonance.'
      details:
        es: Una melodía que solo oye tu rival y que le roe la cabeza. Daño fuerte a un solo objetivo.
        en: A tune only your rival hears and that gnaws at its head. Strong damage to a single target.
      level: 4
      kind: save
      cost: 4
      cooldown: 2
      damage: 3d6
      damage_type: psychic
      save: wis
      status: frightened
    shatter_chord:
      name: {es: Acorde Estremecedor, en: Shattering Chord}
      description:
        es: 'Toda la fila tira DES: 3d8 de fuerza, la mitad si la supera. Cuesta 7 de Resonancia.'
        en: 'The whole row rolls a DEX save: 3d8 force, half on a success. Costs 7 Resonance.'
      details:
        es: 'Una nota tan aguda que rompe la piedra. Es tu estribillo: lo que has ido acumulando suena de golpe sobre toda la fila.'
        en: 'A note so sharp it cracks stone. It is your refrain: everything you built up rings out at once over the whole row.'
      level: 6
      kind: save
      cost: 7
      cooldown: 2
      damage: 3d8
      damage_type: force
      save: dex
      area: row
      half_on_save: true
    encore:
      name: {es: Bis, en: Encore}
      description:
        es: Recuperas 3d8 + tu modificador de conjuro en PV. Cuesta 8 de Resonancia.
        en: You recover 3d8 + your spellcasting modifier in HP. Costs 8 Resonance.
      details:
        es: 'El público pide otra y tú se la das: una canción que te devuelve a la pelea.'
        en: 'The audience asks for more and you give it: a song that puts you back in the fight.'
      level: 8
      kind: heal
      cost: 8
      cooldown: 3
      heal_dice: 3d8
      heal_add: casting
    virtuoso:
      name: {es: Virtuoso, en: Virtuoso}
      description: {es: Tus conjuros suman tu modificador de conjuro al daño., en: Your spells add your spellcasting modifier to damage.}
      details:
        es: 'Dominas tu arte: cada nota golpea un poco más fuerte. Tus conjuros suman tu modificador de conjuro al daño.'
        en: 'You have mastered your art: every note hits a little harder. Your spells add your spellcasting modifier to damage.'
      level: 9
      kind: passive
      action: none
      spell_damage_bonus: true
  resource: resonance
  resource_on_attack: 1

warlock:
  name: {es: Brujo, en: Warlock}
  description:
    es: Selló un pacto con un poder oscuro; maldice a sus enemigos y los quiebra con energía sobrenatural.
    en: Bound by a pact with a dark power; curses foes and breaks them with eldritch energy.
  hit_die: 8
  primary: cha
  casting: cha
  array: {cha: 15, con: 14, dex: 13, wis: 12, int: 10, str: 8}
  skills: [arcana, intimidation]
  items: {quarterstaff: 1, dagger: 1, leather_armor: 1, healing_potion: 1}
  equip: [quarterstaff, leather_armor]
  signature: [eldritch_blast]
  abilities:
    eldritch_blast:
      name: {es: Estallido Sobrenatural, en: Eldritch Blast}
      description: {es: 'Ataque de conjuro a distancia (CAR): 1d10 de daño de fuerza.', en: 'Ranged spell attack (CHA): 1d10 force damage.'}
      details:
        es: 'Un rayo de energía crepitante, regalo de tu patrón. Es un ataque de conjuro a distancia con tu CAR que hace 1d10 de daño de fuerza. No cuesta nada: es tu ataque de siempre.'
        en: 'A beam of crackling energy, a gift from your patron. It is a ranged spell attack with your CHA that deals 1d10 force damage. It costs nothing: it is your everyday attack.'
      level: 1
      kind: spell
      damage: 1d10
      damage_type: force
      damage_tiers: {5: 2d10, 11: 3d10, 17: 4d10}
    hex:
      name: {es: Maleficio, en: Hex}
      description:
        es: 'Acción adicional: maldices a un enemigo 3 turnos, sin salvación; cada golpe que le das suma 1d6 de daño necrótico.'
        en: 'Bonus action: you curse one enemy for 3 turns, no save; each hit you land on it adds 1d6 necrotic damage.'
      details:
        es: 'Señalas al enemigo y tu patrón lo marca. Como acción adicional lo maldices 3 turnos, sin salvación: cada golpe que le das suma 1d6 de daño necrótico. Úsalo primero y ataca después. Gasta Esencia.'
        en: 'You point at the enemy and your patron marks it. As a bonus action you curse it for 3 turns, with no save: every hit you land adds 1d6 necrotic damage. Cast it first, then attack. It spends Essence.'
      level: 1
      kind: curse
      action: bonus
      status: hexed
      status_turns: 3
      cost: 2
    shadow_armor:
      name: {es: Armadura de Sombras, en: Shadow Armor}
      description:
        es: 'Acción adicional: las sombras te envuelven y ganas 2d4 + CAR PV temporales.'
        en: 'Bonus action: shadows wrap around you and you gain 2d4 + CHA temporary HP.'
      details:
        es: Las sombras se te pegan como una segunda piel. Como acción adicional ganas 2d4 + CAR PV temporales, que se pierden antes que los tuyos. Gasta Esencia.
        en: The shadows cling to you like a second skin. As a bonus action you gain 2d4 + CHA temporary HP, lost before your own. It spends Essence.
      level: 2
      kind: buff
      action: bonus
      temp_hp: 2d4
      heal_add: casting
      cost: 3
      cooldown: 3
    void_whispers:
      name: {es: Susurros del Vacío, en: Void Whispers}
      description:
        es: 'Toda la fila del objetivo hace una salvación de SAB: 2d6 de daño psíquico, la mitad si la supera; quien falla queda con miedo 1 turno.'
        en: 'The target''s whole row makes a WIS save: 2d6 psychic damage, half on a success; those who fail are frightened for 1 turn.'
      details:
        es: 'Voces del vacío llenan la cabeza de tus enemigos. Toda la fila del objetivo hace una salvación de SAB: 2d6 de daño psíquico, la mitad si la supera, y quien falla queda con miedo un turno. Gasta Esencia.'
        en: 'Voices from the void fill your enemies'' heads. The target''s whole row makes a WIS save: 2d6 psychic damage, half on a success, and whoever fails is frightened for a turn. It spends Essence.'
      level: 3
      kind: save
      area: row
      save: wis
      damage: 2d6
      damage_type: psychic
      half_on_save: true
      status: frightened
      status_turns: 1
      cost: 5
      cooldown: 2
    agonizing_blast:
      name: {es: Estallido Agónico, en: Agonizing Blast}
      description: {es: Sumas tu CAR al daño de tus conjuros., en: You add your CHA to the damage of your spells.}
      details:
        es: Tu patrón afila tu poder. Sumas tu CAR al daño de tus conjuros de ataque, también al Estallido Sobrenatural. Es automático.
        en: Your patron sharpens your power. You add your CHA to the damage of your attack spells, Eldritch Blast included. It is automatic.
      level: 5
      kind: passive
      action: none
      spell_damage_bonus: true
    life_drain:
      name: {es: Drenar Vida, en: Life Drain}
      description:
        es: 'Ataque de conjuro a distancia: 3d6 de daño necrótico. Cuesta 4 de Esencia.'
        en: 'Ranged spell attack: 3d6 necrotic damage. Costs 4 Essence.'
      details:
        es: Tu patrón arranca la vida de tu rival y te la presta. Más caro que el rayo, pero con un buen empujón de daño.
        en: Your patron tears the life from your rival and lends it to you. Dearer than the blast, but with a good shove of damage.
      level: 4
      kind: spell
      cost: 4
      damage: 3d6
      damage_type: necrotic
    shadow_skin:
      name: {es: Piel de Sombra, en: Shadow Skin}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: 'Las sombras ya no te cubren por ratos: son tu piel. Siempre tienes +1 a la CA, sin hacer nada.'
        en: 'The shadows no longer cover you in turns: they are your skin. You always have +1 AC, with no action needed.'
      level: 6
      kind: passive
      action: none
      ac_bonus: 1
    hunger_of_the_void:
      name: {es: Hambre del Vacío, en: Hunger of the Void}
      description:
        es: 'Toda la fila tira DES: 4d6 de frío, la mitad si la supera. Cuesta 8 de Esencia.'
        en: 'The whole row rolls a DEX save: 4d6 cold, half on a success. Costs 8 Essence.'
      details:
        es: Un vacío helado se abre bajo la fila y se traga el calor de todos. Daño de área a cambio de una buena parte de tu pacto.
        en: A freezing void opens beneath the row and swallows everyone's warmth. Area damage in exchange for a good part of your pact.
      level: 7
      kind: save
      cost: 8
      cooldown: 3
      damage: 4d6
      damage_type: cold
      save: dex
      area: row
      half_on_save: true
    soul_rend:
      name: {es: Desgarro de Alma, en: Soul Rend}
      description:
        es: 'Ataque de conjuro a distancia: 6d6 de daño necrótico. Cuesta 9 de Esencia.'
        en: 'Ranged spell attack: 6d6 necrotic damage. Costs 9 Essence.'
      details:
        es: Lo que tu patrón te dio, devuelto de golpe. Tu mayor castigo a un solo objetivo.
        en: What your patron gave you, returned at once. Your greatest punishment on a single target.
      level: 9
      kind: spell
      cost: 9
      cooldown: 3
      damage: 6d6
      damage_type: necrotic
  resource: essence

ranger:
  name: {es: Explorador, en: Ranger}
  description:
    es: 'Cazador paciente: observa, marca a su presa y la derriba con flechas certeras desde lejos.'
    en: 'A patient hunter: observes, marks the quarry and brings it down with true arrows from afar.'
  hit_die: 10
  primary: dex
  casting: wis
  array: {dex: 15, wis: 14, con: 13, str: 12, int: 10, cha: 8}
  skills: [stealth, survival]
  items: {shortbow: 1, dagger: 1, leather_armor: 1, healing_potion: 1}
  equip: [shortbow, dagger, leather_armor]
  signature: [aimed_shot, prey_mark]
  resource: focus
  resource_on_attack: 1
  abilities:
    aimed_shot:
      name: {es: Disparo Certero, en: Aimed Shot}
      description:
        es: Un disparo con el arco que añade 1d8 de daño perforante. Cuesta 4 de Foco.
        en: A shot with the bow that adds 1d8 piercing damage. Costs 4 Focus.
      details:
        es: Respiras, apuntas y sueltas. Es tu disparo normal, pero si acierta suma 1d8 de daño. Atacar te devuelve Foco; este disparo lo gasta.
        en: You breathe, aim and loose. It is your normal shot, but on a hit it adds 1d8 damage. Attacking gives Focus back; this shot spends it.
      level: 1
      kind: strike
      cost: 4
      ranged: true
      extra_damage: 1d8
      damage_type: piercing
    prey_mark:
      name: {es: Marca de Presa, en: Prey Mark}
      description:
        es: 'Acción adicional: marcas a un enemigo 3 turnos, sin salvación; cada golpe tuyo le suma 1d6 perforante. Cuesta 2 de Foco.'
        en: 'Bonus action: you mark an enemy for 3 turns, no save; every hit of yours adds 1d6 piercing to it. Costs 2 Focus.'
      details:
        es: 'Lees su rastro y ya sabes dónde duele. Marca primero y dispara después: cada impacto sobre la presa marcada pega un poco más fuerte.'
        en: 'You read its tracks and already know where it hurts. Mark first, shoot after: every hit on the marked quarry lands a little harder.'
      level: 1
      kind: curse
      action: bonus
      cost: 2
      status: marked
      status_turns: 3
    woodland_step:
      name: {es: Paso del Bosque, en: Woodland Step}
      description:
        es: 'Acción adicional: Sigilo contra su percepción; si sale, tu próximo ataque tiene ventaja. Cuesta 2 de Foco.'
        en: 'Bonus action: a Stealth check against their perception; if it works, your next attack has advantage. Costs 2 Focus.'
      details:
        es: Te mueves sin ruido entre la maleza. Si te pierden de vista, tu siguiente disparo llega con ventaja.
        en: You move without a sound through the undergrowth. If they lose sight of you, your next shot comes with advantage.
      level: 2
      kind: hide
      action: bonus
      cost: 2
    volley:
      name: {es: Lluvia de Flechas, en: Volley}
      description:
        es: 'Toda la fila tira DES: 2d6 perforante, la mitad si la supera. Cuesta 5 de Foco.'
        en: 'The whole row rolls a DEX save: 2d6 piercing, half on a success. Costs 5 Focus.'
      details:
        es: Sueltas varias flechas a la vez sobre la fila entera. Ninguna pega fuerte, pero no se libra nadie del todo.
        en: You loose several arrows at once over the whole row. None hits hard, but nobody gets off entirely.
      level: 3
      kind: save
      cost: 5
      cooldown: 2
      damage: 2d6
      damage_type: piercing
      save: dex
      area: row
      half_on_save: true
    natures_balm:
      name: {es: Bálsamo del Bosque, en: Nature's Balm}
      description:
        es: 'Acción adicional: recuperas 1d8 + tu modificador de conjuro en PV. Cuesta 3 de Foco.'
        en: 'Bonus action: recover 1d8 + your spellcasting modifier in HP. Costs 3 Focus.'
      details:
        es: Hierbas que conoces de memoria, mascadas y aplicadas en un segundo. Como es una acción adicional, curas y sigues disparando.
        en: Herbs you know by heart, chewed and applied in a second. As a bonus action, you heal and keep shooting.
      level: 4
      kind: heal
      action: bonus
      cost: 3
      cooldown: 3
      heal_dice: 1d8
      heal_add: casting
    twin_shots:
      name: {es: Disparo Doble, en: Twin Shots}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: 'Cuando ya has leído la presa, no necesitas más de un respiro: disparas dos veces en la misma acción, cada disparo con su tirada.'
        en: 'Once you have read the quarry you need no more than a breath: you shoot twice in the same action, each shot with its own roll.'
      level: 5
      kind: passive
      action: none
      extra_attack: true
    poison_arrow:
      name: {es: Flecha Envenenada, en: Poison Arrow}
      description:
        es: Un disparo con el arco que añade 2d6 de daño de veneno. Cuesta 5 de Foco.
        en: A shot with the bow that adds 2d6 poison damage. Costs 5 Focus.
      details:
        es: Una punta untada con algo que ya conoces bien. Cuesta más que el disparo certero, pero muerde de verdad.
        en: A tip smeared with something you know well. It costs more than the aimed shot, but it really bites.
      level: 6
      kind: strike
      cost: 5
      cooldown: 2
      ranged: true
      extra_damage: 2d6
      damage_type: poison
    hawk_eye:
      name: {es: Ojo de Halcón, en: Hawk's Eye}
      description: {es: Haces crítico con un 19 o un 20., en: You score a critical hit on a 19 or 20.}
      details:
        es: Ves el punto débil desde lejos. Tus disparos son críticos también con un 19 natural.
        en: You see the weak spot from afar. Your shots are critical on a natural 19 too.
      level: 8
      kind: passive
      action: none
      crit_range: 19
    storm_of_arrows:
      name: {es: Tormenta de Flechas, en: Storm of Arrows}
      description:
        es: 'Toda la fila tira DES: 4d6 perforante, la mitad si la supera. Cuesta 10 de Foco.'
        en: 'The whole row rolls a DEX save: 4d6 piercing, half on a success. Costs 10 Focus.'
      details:
        es: El cielo se oscurece con tus flechas. Es lo más grande que puedes hacer con el arco, y pide varios turnos para repetirse.
        en: The sky darkens with your arrows. It is the biggest thing you can do with the bow, and it takes several turns to repeat.
      level: 9
      kind: save
      cost: 10
      cooldown: 3
      damage: 4d6
      damage_type: piercing
      save: dex
      area: row
      half_on_save: true

artificer:
  name: {es: Artífice, en: Artificer}
  description:
    es: 'Inventor de campo: un aparato que carga y descarga, con reactivos para curar, proteger o corroer.'
    en: 'A field inventor: a device that charges and discharges, with reagents to mend, shield or corrode.'
  hit_die: 8
  primary: int
  casting: int
  array: {int: 15, con: 14, dex: 13, wis: 12, str: 10, cha: 8}
  skills: [arcana, investigation]
  items: {mace: 1, scale_mail: 1, healing_potion: 1}
  equip: [mace, scale_mail]
  signature: [arc_bolt]
  resource: charge
  abilities:
    arc_bolt:
      name: {es: Descarga del Aparato, en: Device Bolt}
      description: {es: 'Ataque de conjuro a distancia (INT): 1d10 de daño de fuerza.', en: 'Ranged spell attack (INT): 1d10 force damage.'}
      details:
        es: Un pulso seco de energía sale de tu aparato. Es tu ataque de siempre y no cuesta Carga, también desde la retaguardia.
        en: A dry pulse of energy leaves your device. It is your everyday attack and costs no Charge, from the back row too.
      level: 1
      kind: spell
      damage: 1d10
      damage_type: force
      damage_tiers: {5: 2d10, 11: 3d10, 17: 4d10}
    repair_pulse:
      name: {es: Pulso Restaurador, en: Restoring Pulse}
      description:
        es: 'Acción adicional: recuperas 1d8 + tu modificador de conjuro en PV. Cuesta 3 de Carga.'
        en: 'Bonus action: recover 1d8 + your spellcasting modifier in HP. Costs 3 Charge.'
      details:
        es: 'Tu aparato libera un pulso que cierra heridas. Gasta Carga, no pociones: no entra ni sale nada de tu mochila.'
        en: 'Your device releases a pulse that closes wounds. It spends Charge, not potions: nothing enters or leaves your backpack.'
      level: 1
      kind: heal
      action: bonus
      cost: 3
      cooldown: 2
      heal_dice: 1d8
      heal_add: casting
    corrosive_flask:
      name: {es: Reactivo Corrosivo, en: Corrosive Reagent}
      description:
        es: 'El objetivo tira DES: 2d6 de veneno, la mitad si la supera. Cuesta 4 de Carga.'
        en: 'The target rolls a DEX save: 2d6 poison, half on a success. Costs 4 Charge.'
      details:
        es: 'Tu aparato rocía un reactivo que corroe lo que toca. No es una poción: sale de tu Carga y no se vende ni se guarda.'
        en: 'Your device sprays a reagent that eats what it touches. It is not a potion: it comes from your Charge and can be neither sold nor stored.'
      level: 2
      kind: save
      cost: 4
      damage: 2d6
      damage_type: poison
      save: dex
      half_on_save: true
    foam_shield:
      name: {es: Espuma Protectora, en: Protective Foam}
      description:
        es: 'Acción adicional: ganas 2d6 + tu modificador de conjuro de PV temporales. Cuesta 4 de Carga.'
        en: 'Bonus action: you gain 2d6 + your spellcasting modifier in temporary HP. Costs 4 Charge.'
      details:
        es: 'Una espuma densa te cubre y amortigua el siguiente golpe. Es una acción adicional: protégete y sigue trabajando.'
        en: 'A dense foam covers you and cushions the next blow. It is a bonus action: shield yourself and keep working.'
      level: 3
      kind: buff
      action: bonus
      cost: 4
      cooldown: 3
      temp_hp: 2d6
      heal_add: casting
    overcharge:
      name: {es: Sobrecarga, en: Overcharge}
      description:
        es: 'Ataque de conjuro a distancia: 3d8 de daño de fuerza. Cuesta 5 de Carga.'
        en: 'Ranged spell attack: 3d8 force damage. Costs 5 Charge.'
      details:
        es: Fuerzas el aparato más allá de lo seguro y descargas todo en un pulso. Caro, pero pega como nada de lo que llevas.
        en: You push the device past what is safe and discharge it all in one pulse. Dear, but it hits like nothing else you carry.
      level: 4
      kind: spell
      cost: 5
      damage: 3d8
      damage_type: force
    arcane_armament:
      name: {es: Armamento Arcano, en: Arcane Armament}
      description: {es: Tus conjuros suman tu modificador de conjuro al daño., en: Your spells add your spellcasting modifier to damage.}
      details:
        es: 'Tu aparato ya no solo dispara: está afinado para ti. Tus conjuros suman tu modificador de conjuro al daño.'
        en: 'Your device no longer just fires: it is tuned to you. Your spells add your spellcasting modifier to damage.'
      level: 5
      kind: passive
      action: none
      spell_damage_bonus: true
    chain_reaction:
      name: {es: Reacción en Cadena, en: Chain Reaction}
      description:
        es: 'Toda la fila tira DES: 4d6 de fuego, la mitad si la supera. Cuesta 8 de Carga.'
        en: 'The whole row rolls a DEX save: 4d6 fire, half on a success. Costs 8 Charge.'
      details:
        es: Un reactivo prende a otro y ese a otro. Cuando son varios en fila, rinde mucho más que cualquier disparo.
        en: One reagent lights another and that one another. When there are several in a row, it pays far more than any single shot.
      level: 6
      kind: save
      cost: 8
      cooldown: 3
      damage: 4d6
      damage_type: fire
      save: dex
      area: row
      half_on_save: true
    reinforced_plating:
      name: {es: Blindaje Reforzado, en: Reinforced Plating}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Has ido reforzando tu coraza placa a placa. Siempre tienes +1 a la CA, sin hacer nada.
        en: You have been reinforcing your armor plate by plate. You always have +1 AC, with no action needed.
      level: 8
      kind: passive
      action: none
      ac_bonus: 1
    grand_discharge:
      name: {es: Gran Descarga, en: Grand Discharge}
      description:
        es: 'Ataque de conjuro a distancia: 6d8 de daño de fuerza. Cuesta 10 de Carga.'
        en: 'Ranged spell attack: 6d8 force damage. Costs 10 Charge.'
      details:
        es: Todo el aparato descargado a la vez. Es lo mayor que puedes soltar y tarda unos turnos en volver a cargarse.
        en: The whole device discharged at once. It is the most you can release and it takes a few turns to charge again.
      level: 9
      kind: spell
      cost: 10
      cooldown: 3
      damage: 6d8
      damage_type: force

shaman:
  name: {es: Chamán, en: Shaman}
  description:
    es: 'Voz de los espíritus: pide prestada la fuerza de los elementos para golpear, sanar y proteger.'
    en: 'Voice of the spirits: borrows the strength of the elements to strike, heal and protect.'
  hit_die: 8
  primary: wis
  casting: wis
  array: {wis: 15, con: 14, str: 13, dex: 12, int: 10, cha: 8}
  skills: [survival, medicine]
  items: {quarterstaff: 1, leather_armor: 1, healing_potion: 1}
  equip: [quarterstaff, leather_armor]
  signature: [elemental_spark]
  resource: mana
  abilities:
    elemental_spark:
      name: {es: Chispa Elemental, en: Elemental Spark}
      description: {es: 'Ataque de conjuro a distancia (SAB): 1d8 de daño de fuego.', en: 'Ranged spell attack (WIS): 1d8 fire damage.'}
      details:
        es: Una chispa que un espíritu del fuego te presta un instante. Es tu ataque de siempre y no cuesta Maná.
        en: A spark that a fire spirit lends you for a moment. It is your everyday attack and costs no Mana.
      level: 1
      kind: spell
      damage: 1d8
      damage_type: fire
      damage_tiers: {5: 2d8, 11: 3d8, 17: 4d8}
    stoneskin:
      name: {es: Piel de Piedra, en: Stoneskin}
      description:
        es: 'Acción adicional: ganas 2d4 + tu modificador de conjuro de PV temporales. Cuesta 3 de Maná.'
        en: 'Bonus action: you gain 2d4 + your spellcasting modifier in temporary HP. Costs 3 Mana.'
      details:
        es: Un espíritu de la tierra endurece tu piel por un rato. Es una acción adicional barata para encajar el siguiente golpe.
        en: A spirit of the earth hardens your skin for a while. A cheap bonus action to soak up the next blow.
      level: 1
      kind: buff
      action: bonus
      cost: 3
      cooldown: 3
      temp_hp: 2d4
      heal_add: casting
    tidal_mending:
      name: {es: Marea Sanadora, en: Tidal Mending}
      description:
        es: Recuperas 1d10 + tu modificador de conjuro en PV. Cuesta 4 de Maná.
        en: You recover 1d10 + your spellcasting modifier in HP. Costs 4 Mana.
      details:
        es: El agua que cura sube por tus manos. Usa tu acción, así que cúrate cuando el combate te lo permita.
        en: The water that heals rises through your hands. It uses your action, so heal when the fight lets you.
      level: 2
      kind: heal
      cost: 4
      heal_dice: 1d10
      heal_add: casting
    earth_grasp:
      name: {es: Agarre de Tierra, en: Earth Grasp}
      description:
        es: 'Toda la fila tira DES: quien falla queda enredado 2 turnos. Cuesta 5 de Maná.'
        en: 'The whole row rolls a DEX save: whoever fails is restrained for 2 turns. Costs 5 Mana.'
      details:
        es: La tierra misma sujeta los pies de la fila entera. No hace daño, pero un enemigo atrapado ya no es un problema.
        en: The earth itself holds the feet of the whole row. It does no damage, but a trapped enemy is no longer a problem.
      level: 3
      kind: save
      cost: 5
      cooldown: 3
      save: dex
      area: row
      status: restrained
      status_turns: 2
    frost_lash:
      name: {es: Latigazo de Escarcha, en: Frost Lash}
      description:
        es: 'Ataque de conjuro a distancia: 3d6 de daño de frío. Cuesta 4 de Maná.'
        en: 'Ranged spell attack: 3d6 cold damage. Costs 4 Mana.'
      details:
        es: Un látigo de hielo que un espíritu del invierno hace restallar por ti. Más caro que la chispa, pero mucho más fuerte.
        en: A whip of ice that a winter spirit cracks for you. Dearer than the spark, but much stronger.
      level: 4
      kind: spell
      cost: 4
      damage: 3d6
      damage_type: cold
    spirit_ward:
      name: {es: Resguardo de los Espíritus, en: Spirit Ward}
      description: {es: Eres inmune al miedo., en: You are immune to fear.}
      details:
        es: 'Los espíritus te cuidan: ni el grito de un espectro ni un conjuro te hacen retroceder. Siempre activa.'
        en: 'The spirits watch over you: neither a spectre''s wail nor a spell makes you flinch. Always on.'
      level: 5
      kind: passive
      action: none
      immune: [frightened]
    storm_chain:
      name: {es: Cadena de Tormenta, en: Storm Chain}
      description:
        es: 'Toda la fila tira DES: 4d6 de fuego, la mitad si la supera. Cuesta 8 de Maná.'
        en: 'The whole row rolls a DEX save: 4d6 fire, half on a success. Costs 8 Mana.'
      details:
        es: El rayo salta de uno a otro por toda la fila. Es tu daño de área, y rinde más cuanto más juntos están.
        en: Lightning leaps from one to the next along the whole row. It is your area damage, and it pays more the closer together they stand.
      level: 6
      kind: save
      cost: 8
      cooldown: 2
      damage: 4d6
      damage_type: fire
      save: dex
      area: row
      half_on_save: true
    earthen_hide:
      name: {es: Cuero de Tierra, en: Earthen Hide}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: La tierra te ha tomado cariño. Siempre tienes +1 a la CA, sin hacer nada.
        en: The earth has grown fond of you. You always have +1 AC, with no action needed.
      level: 8
      kind: passive
      action: none
      ac_bonus: 1
    tempest_call:
      name: {es: Llamada de la Tempestad, en: Tempest Call}
      description:
        es: 'Toda la fila tira DES: 5d6 de frío y queda aturdida un turno si falla. Cuesta 12 de Maná.'
        en: 'The whole row rolls a DEX save: 5d6 cold and stunned for a turn on a fail. Costs 12 Mana.'
      details:
        es: Llamas a la tormenta entera y la sueltas sobre la fila. Es tu gasto más grande y casi siempre decide el combate.
        en: You call the whole storm and let it loose on the row. It is your biggest spend and it almost always decides the fight.
      level: 9
      kind: save
      cost: 12
      cooldown: 4
      damage: 5d6
      damage_type: cold
      save: dex
      area: row
      half_on_save: true
      status: stunned

death_knight:
  name: {es: Caballero de la Muerte, en: Death Knight}
  description:
    es: 'Guerrero atado a runas de muerte y escarcha: sus golpes cargan el poder que luego descarga.'
    en: 'A warrior bound to runes of death and frost: his blows charge the power he later unleashes.'
  hit_die: 10
  primary: str
  array: {str: 15, con: 14, cha: 13, wis: 12, dex: 10, int: 8}
  skills: [athletics, intimidation]
  items: {longsword: 1, chain_mail: 1, healing_potion: 1}
  equip: [longsword, chain_mail]
  signature: [death_strike]
  resource: runic_power
  resource_on_attack: 2
  abilities:
    death_strike:
      name: {es: Golpe de Muerte, en: Death Strike}
      description:
        es: Un ataque con arma que añade 1d8 de daño necrótico. Cuesta 3 de Poder rúnico.
        en: A weapon attack that adds 1d8 necrotic damage. Costs 3 Runic Power.
      details:
        es: Las runas de tu hoja beben vida con cada golpe. Es tu ataque normal, pero si acierta suma 1d8 de daño necrótico. Tus golpes cargan el Poder rúnico; este lo descarga.
        en: The runes on your blade drink life with every blow. It is your normal attack, but on a hit it adds 1d8 necrotic damage. Your blows charge Runic Power; this one discharges it.
      level: 1
      kind: strike
      cost: 3
      extra_damage: 1d8
      damage_type: necrotic
    rune_ward:
      name: {es: Runa Protectora, en: Rune Ward}
      description: {es: +1 a la CA., en: +1 AC.}
      details:
        es: Una runa grabada en tu armadura la vuelve más dura de lo que debería. Siempre tienes +1 a la CA, sin hacer nada.
        en: A rune carved on your armor makes it harder than it should be. You always have +1 AC, with no action needed.
      level: 1
      kind: passive
      action: none
      ac_bonus: 1
    blood_tap:
      name: {es: Sorber Vitalidad, en: Blood Tap}
      description:
        es: 'Acción adicional: recuperas 1d10 + tu nivel en PV. Cuesta 4 de Poder rúnico.'
        en: 'Bonus action: recover 1d10 + your level in HP. Costs 4 Runic Power.'
      details:
        es: Tomas para ti la vitalidad que tu hoja ha ido bebiendo. Como es una acción adicional, curas y sigues golpeando.
        en: You take for yourself the vitality your blade has been drinking. As a bonus action you heal and keep striking.
      level: 2
      kind: heal
      action: bonus
      cost: 4
      cooldown: 2
      heal_dice: 1d10
      heal_add: level
    frost_chains:
      name: {es: Cadenas de Escarcha, en: Frost Chains}
      description:
        es: 'El objetivo tira DES: si falla, recibe 1d6 de frío y queda enredado 2 turnos. Cuesta 4 de Poder rúnico.'
        en: 'The target rolls a DEX save: on a fail it takes 1d6 cold and is restrained for 2 turns. Costs 4 Runic Power.'
      details:
        es: Cadenas de hielo salen de tu hoja y atan al rival al suelo. Daño pequeño, pero un enemigo trabado es un enemigo al que le acierta cualquiera.
        en: Chains of ice leap from your blade and bind the foe to the ground. Small damage, but a bound enemy is one anyone can hit.
      level: 3
      kind: save
      cost: 4
      cooldown: 3
      damage: 1d6
      damage_type: cold
      save: dex
      status: restrained
      status_turns: 2
    rune_blade:
      name: {es: Hoja Rúnica, en: Rune Blade}
      description: {es: Atacas dos veces con tu acción de ataque., en: You attack twice with your attack action.}
      details:
        es: 'Las runas aceleran tu brazo: golpeas dos veces en la misma acción, cada golpe con su tirada, y cada golpe carga tu Poder rúnico.'
        en: 'The runes quicken your arm: you strike twice in the same action, each blow with its own roll, and each blow charges your Runic Power.'
      level: 5
      kind: passive
      action: none
      extra_attack: true
    obliterate:
      name: {es: Aniquilar, en: Obliterate}
      description:
        es: Un ataque con arma que añade 2d8 de daño de frío. Cuesta 6 de Poder rúnico.
        en: A weapon attack that adds 2d8 cold damage. Costs 6 Runic Power.
      details:
        es: 'Tu golpe más frío: la escarcha de la runa estalla al impactar. Pide unos turnos para volver a cargarse.'
        en: 'Your coldest blow: the rune''s frost bursts on impact. It asks a few turns to charge again.'
      level: 6
      kind: strike
      cost: 6
      cooldown: 2
      extra_damage: 2d8
      damage_type: cold
    unholy_will:
      name: {es: Voluntad Impía, en: Unholy Will}
      description: {es: Eres inmune al miedo., en: You are immune to fear.}
      details:
        es: Lo que te ata a las runas ya no conoce el miedo. Siempre activa, sin gastar acciones.
        en: What binds you to the runes no longer knows fear. Always on, with no action needed.
      level: 7
      kind: passive
      action: none
      immune: [frightened]
    merciless:
      name: {es: Despiadado, en: Merciless}
      description: {es: Haces crítico con un 19 o un 20., en: You score a critical hit on a 19 or 20.}
      details:
        es: No dudas, no sueltas, no fallas por piedad. Tus golpes son críticos también con un 19 natural.
        en: You do not hesitate, do not let go, do not miss out of mercy. Your blows are critical on a natural 19 too.
      level: 8
      kind: passive
      action: none
      crit_range: 19
    howling_blast:
      name: {es: Ráfaga Aullante, en: Howling Blast}
      description:
        es: 'Toda la fila tira DES: 4d6 de frío, la mitad si la supera. Cuesta 10 de Poder rúnico.'
        en: 'The whole row rolls a DEX save: 4d6 cold, half on a success. Costs 10 Runic Power.'
      details:
        es: Todo el Poder rúnico que has ido cargando sale de golpe en una ráfaga helada sobre la fila. Es lo mayor que puedes soltar.
        en: All the Runic Power you have charged leaves at once in an icy blast over the row. It is the most you can release.
      level: 9
      kind: save
      cost: 10
      cooldown: 3
      damage: 4d6
      damage_type: cold
      save: dex
      area: row
      half_on_save: true
