abilities:
  str:
    name: {es: Fuerza, en: Strength}
    short: {es: FUE, en: STR}
    effect:
      es: Ataque y daño con armas cuerpo a cuerpo (espadas, mazas). Atletismo.
      en: Attack and damage with melee weapons (swords, maces). Athletics.
  dex:
    name: {es: Destreza, en: Dexterity}
    short: {es: DES, en: DEX}
    effect:
      es: Clase de armadura con armadura ligera, iniciativa, arcos y armas sutiles. Acrobacias, Sigilo, Juego de manos y salvaciones de DES.
      en: Armor class in light armor, initiative, bows and finesse weapons. Acrobatics, Stealth, Sleight of Hand and DEX saves.
  con:
    name: {es: Constitución, en: Constitution}
    short: {es: CON, en: CON}
    effect:
      es: Puntos de vida. Cada punto de modificador suma vida en cada nivel.
      en: Hit points. Each point of modifier adds HP at every level.
  int:
    name: {es: Inteligencia, en: Intelligence}
    short: {es: INT, en: INT}
    effect:
      es: Conjuros del Mago. Arcanos, Historia, Investigación y Religión.
      en: Mage spells. Arcana, History, Investigation and Religion.
  wis:
    name: {es: Sabiduría, en: Wisdom}
    short: {es: SAB, en: WIS}
    effect:
      es: Conjuros y curación de Sacerdote y Druida. Percepción, Medicina, Perspicacia, Supervivencia y salvaciones de SAB.
      en: Priest and Druid spells and healing. Perception, Medicine, Insight, Survival and WIS saves.
  cha:
    name: {es: Carisma, en: Charisma}
    short: {es: CAR, en: CHA}
    effect:
      es: Conjuros de Bardo y Brujo. Persuasión, Engaño e Intimidación con los NPC.
      en: Bard and Warlock spells. Persuasion, Deception and Intimidation with NPCs.

skills:
  athletics: {ability: str, name: {es: Atletismo, en: Athletics}}
  acrobatics: {ability: dex, name: {es: Acrobacias, en: Acrobatics}}
  sleight_of_hand: {ability: dex, name: {es: Juego de manos, en: Sleight of Hand}}
  stealth: {ability: dex, name: {es: Sigilo, en: Stealth}}
  arcana: {ability: int, name: {es: Arcanos, en: Arcana}}
  history: {ability: int, name: {es: Historia, en: History}}
  investigation: {ability: int, name: {es: Investigación, en: Investigation}}
  religion: {ability: int, name: {es: Religión, en: Religion}}
  insight: {ability: wis, name: {es: Perspicacia, en: Insight}}
  medicine: {ability: wis, name: {es: Medicina, en: Medicine}}
  perception: {ability: wis, name: {es: Percepción, en: Perception}}
  survival: {ability: wis, name: {es: Supervivencia, en: Survival}}
  deception: {ability: cha, name: {es: Engaño, en: Deception}}
  intimidation: {ability: cha, name: {es: Intimidación, en: Intimidation}}
  persuasion: {ability: cha, name: {es: Persuasión, en: Persuasion}}
