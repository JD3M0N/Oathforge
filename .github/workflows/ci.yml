# Quality gate (planning/structura.md, phase 3). Nothing goes to main unless this is green.
name: CI

on:
  push:
    branches: [josue-development, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff, import-linter, pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check . --output-format github
      - name: ruff format
        run: .venv/bin/ruff format --check .
      - name: import-linter (engine is pure, only ai/client.py talks to Gemini)
        run: .venv/bin/lint-imports
      - name: pyright (engine and services)
        run: .venv/bin/pyright

  tests:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oathforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # conftest.py uses Postgres when this connects and SQLite otherwise: port 1 never answers
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://postgres:postgres@localhost:5432/oathforge_test' || 'postgresql+asyncpg://postgres:postgres@localhost:1/none' }}
      ARTIFACTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: oath validate
        run: .venv/bin/oath validate
      - name: pytest
        run: .venv/bin/python -m pytest -q
