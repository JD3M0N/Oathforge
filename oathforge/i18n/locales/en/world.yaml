    gather_herbalism: "🌿 Herbs"
    gather_fishing: "🎣 Fish"
    hunt: "🏹 Hunt and track"
    craft: "🔨 Craft"
    guild: "📜 Learn {prof}"
    npc: "💬 {npc}"

talk:
  quest_hint: "{npc} reminds you what to do: \"{hint}\""
