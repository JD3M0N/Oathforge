  success: "Success"
  failure: "Failure"
  already_tried: "You already tried {skill} here today. Come back tomorrow, or once you have improved."

explore:
  arrived: "You reach {place} ({yards} yd on the road)."
  arrived_via: "You reach {place} through {via} ({yards} yd on the road)."
