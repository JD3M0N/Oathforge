rep:
  changed: "Reputation with {faction}: {delta} (now {value})."

steal:
  success: "You lift {gold} gold from {npc} without being noticed."
  suspected: "{npc} frowns and pats their purse. They suspect something."
  caught: "{npc} catches you with your hand in their purse!"
  err:
    nothing: "There is nothing to steal there."

roll:
  prompt: "🎲 This action needs a <b>{skill}</b> roll. Roll the die with the button."
  warning: |-
    ⚠️ <b>Manual rolls on.</b> Telegram's animated die is only decoration: it is a d6 and its number is <b>not</b> your roll. The engine rolls a d20 (plus your bonus against the DC) and the real result appears below the die.
  "on": "on"
  "off": "off"
  changed: "🎲 Manual rolls {state}."
  stale: "That roll makes no sense here anymore: you have moved."

