  short_rested: "💤 You catch your breath."
  healed: "🙏 Sister Ysolde murmurs a prayer and bandages you: you recover {amount} HP ({hp}/{max_hp}). You leave {cost} gold in the chapel's box."
  healed_injured: "✨ Her prayer closes your grave wounds too: you are no longer injured."
  err:
    in_combat: "You are in the middle of a fight!"
    no_route: "You can't go there from here."
    no_rest: "There is nowhere to rest here."
    no_healer: "There is no one here to cure wounds."
    injured_cap: "Potions don't close grave wounds: get healed by Sister Ysolde or rest at the inn."
