  look: "Look around"
  map: "Map: where you are and where to go"
  hero: "Hero summary"
  sheet: "Full sheet with portrait"
  inventory: "Inventory"
  journal: "Adventure journal"
  quests: "Missions and progress"
  lineage: "Lineages: bonuses and traits"
