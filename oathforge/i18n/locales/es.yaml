help:
  text: |-
    <b>Cómo jugar a Oathforge</b>

    Usa los botones para viajar, investigar, hablar y combatir.
    También puedes <b>escribir lo que quieras hacer</b>: «me escondo tras la barra y escucho», «intento robarle la bolsa al tabernero», «empujo el carro sobre el bandido».
    El Dungeon Master interpreta tu acción, el motor tira los dados y tú ves el resultado real.

    Comandos: /look /activities /map /hero /sheet /inventory /journal /quests /classes /report /professions /recipes /room /masteries /hobbies /rulebook /settings
  version: "<i>Oathforge v{version}</i>"

settings:
  text: |-
    ⚙️ <b>Ajustes</b>

    🌐 Idioma: {language}
    🎲 Tiradas manuales: {rolls}

    <i>Con las tiradas manuales, cuando una prueba de habilidad necesite tirada (investigar, acciones de misión o acciones escritas) te pedimos que pulses «🎲 Tirar el dado». La animación es decorativa: el resultado lo calcula siempre el motor.</i>
  language_name: "Español"

