help:
  text: |-
    <b>Cómo jugar a Oathforge</b>

    Usa los botones para viajar, investigar, hablar y combatir.
    También puedes <b>escribir lo que quieras hacer</b>: «me escondo tras la barra y escucho», «intento robarle la bolsa al tabernero», «empujo el carro sobre el bandido».
    El Dungeon Master interpreta tu acción, el motor tira los dados y tú ves el resultado real.

    Comandos: /look /hero /sheet /inventory /journal /language
  version: "<i>Oathforge v{version}</i>"

lang:
  choose: "Elige tu idioma:"
  changed: "Idioma cambiado a español."

gender:
  male: "Hombre"
  female: "Mujer"

start:
  need_character: "Aún no tienes personaje. Usa /start para crearlo."

create:
  welcome: |-
    ⚔️ <b>Bienvenido a Aetherfall.</b>

    Un mundo que existía antes de ti y que seguirá existiendo cuando te marches. Las tabernas recuerdan, las facciones conspiran y tus actos dejan huella.
  ask_name: "¿Cómo se llama tu personaje? (2–24 letras)"
  bad_name: "Ese nombre no sirve. Usa entre 2 y 24 letras, espacios, apóstrofos o guiones."
  ask_gender: "<b>{name}</b>, ¿tu personaje es hombre o mujer? Decide su retrato y cómo le habla el mundo."
  gender_btn:
    male: "♂️ Hombre"
    female: "♀️ Mujer"
  ask_lineage: "<b>{name}</b>, ¿de qué linaje procedes?"
  ask_background: "¿Quién eras antes de convertirte en aventurero?"
  ask_class: "Elige tu clase:"
  summary: |-
    <b>{name}</b>
    {gender} · {lineage} · {background} · {cls}

    {stats}
    Puntos de vida: {hp}

    ¿Confirmas?
  done: "✨ <b>{name}</b> entra en Crownreach. Que tus juramentos te guíen."
  cancelled: "Creación cancelada. Usa /start cuando quieras."

