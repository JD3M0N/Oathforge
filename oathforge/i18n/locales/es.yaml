  warning: |-
    ⚠️ <b>Tiradas manuales activadas.</b> El dado animado de Telegram es solo decoración: es un d6 y su número <b>no</b> es tu tirada. El motor tira un d20 (más tu bonificador contra la CD) y el resultado real sale debajo del dado.
